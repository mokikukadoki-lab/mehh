<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2BB34B">
<title>Misafirler Yolda · Konsept demo</title>
<style>
:root{--u:1vh;--green:#2BB34B;--dgreen:#137A33;--black:#000;--white:#fff;--amber:#F5A623;--red:#E5322D;--night:#16213E;--c-teyze:#7B4BA0;--c-adam:#2C3E73;--c-cocuk:#F07B2C;--ink:#111;--cream:#fff;--kraft:var(--green);--navy:#000}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--dgreen);overscroll-behavior:none}
body{font-family:ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent}
#app{height:100vh;height:100dvh;display:flex;justify-content:center}

/* ---------- OYUN ALANI ---------- */
#game{position:relative;width:100%;max-width:430px;height:100%;overflow:hidden;display:grid;
  --topH:clamp(34px,calc(var(--u)*5.2),48px);--roomH:calc(var(--u)*29.6);--botH:calc(var(--u)*13);
  --ic:clamp(44px,calc(var(--u)*5.7),48px);--fs:clamp(60px,calc(var(--u)*10),84px);
  grid-template-rows:var(--topH) var(--roomH) minmax(0,1fr) var(--botH);grid-template-columns:minmax(0,1fr);gap:calc(var(--u)*1.2);
  padding:calc(var(--u)*1) 8px calc(var(--u)*1 + env(safe-area-inset-bottom,0px));
  background-color:var(--kraft);
  background-image:none;
  background-size:7px 7px,11px 13px,100% 100%;background-position:0 0,4px 6px,0 0;
  box-shadow:0 0 30px rgba(0,0,0,.5);touch-action:manipulation}
#game::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(200,30,20,0),rgba(190,20,10,.38));opacity:0;transition:opacity 1.2s;pointer-events:none}
#game.phase-2::before{opacity:1}
#topbar,#room,#kitchen,#bottom{position:relative;min-height:0}

/* ---------- VARLIKLAR ---------- */
.asset{display:inline-block;line-height:1;vertical-align:middle;flex:none;font-style:normal}
.asset-emoji{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
img.asset{height:1em;width:auto}
.pick{display:inline-block;line-height:1;transition:transform .09s ease-out}
.pick.sel{transform:translateY(-6px) scale(1.1);filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 6px #ffd54a)}

/* bardaklar */
.cup{position:relative;width:.6em;height:.8em;border:.05em solid rgba(40,30,20,.8);border-top-width:.03em;border-radius:.04em .04em .15em .15em;
  background:linear-gradient(to top,var(--liq) 0 70%,rgba(200,225,240,.7) 70%);box-shadow:inset .07em 0 0 rgba(255,255,255,.45)}
.cup-cola{--liq:#3b1a0e}.cup-fanta{--liq:#ff8a00}.cup-ayran{--liq:#fffdf3}
.cup-cola::before,.cup-fanta::before{content:"";position:absolute;right:.1em;top:-.26em;width:.06em;height:.55em;background:#e53935;transform:rotate(14deg);border-radius:.03em}
.cup-ayran::before{content:"";position:absolute;left:0;right:0;bottom:66%;height:.09em;background:#fff;border-radius:.05em}
/* şişeler */
.bottle{position:relative;width:.4em;height:.72em;margin-top:.26em;border-radius:.1em .1em .06em .06em;
  background:linear-gradient(transparent 32%,var(--lab) 32% 58%,transparent 58%),var(--bc);
  box-shadow:inset -.06em 0 0 rgba(0,0,0,.25),inset .05em 0 0 rgba(255,255,255,.35),0 .02em .04em rgba(0,0,0,.4)}
.bottle::before{content:"";position:absolute;left:50%;top:-.2em;width:.17em;height:.22em;margin-left:-.085em;background:var(--bc)}
.bottle::after{content:"";position:absolute;left:50%;top:-.28em;width:.2em;height:.09em;margin-left:-.1em;background:var(--cap);border-radius:.03em}
.bottle-cola{--bc:#3b1a0e;--cap:#d62b20;--lab:#d62b20}
.bottle-fanta{--bc:#ff8a00;--cap:#1f5fbf;--lab:#1f5fbf}
.bottle-ayran{--bc:#fbfaf3;--cap:#2b7de0;--lab:#2b7de0}
/* bütün tavuk */
.chicken{position:relative;width:1.5em;height:1.02em;border-radius:50% 50% 46% 46%;background:var(--chk,#f3dfb5);
  box-shadow:inset -.12em -.14em 0 rgba(0,0,0,.2),inset .1em .08em 0 rgba(255,255,255,.25)}
.chicken::before,.chicken::after{content:"";position:absolute;bottom:.06em;width:.42em;height:.3em;background:var(--chk,#f3dfb5);border-radius:50%;box-shadow:inset -.05em -.05em 0 rgba(0,0,0,.2)}
.chicken::before{left:-.16em;transform:rotate(-25deg)}
.chicken::after{right:-.16em;transform:rotate(25deg)}
.chicken-ready{--chk:#b4641f}
.roast{position:absolute;left:0;top:0;z-index:1;opacity:0}
.chicken-burnt{--chk:#17120f}
.spark{position:absolute;right:-.3em;top:-.35em;font-size:.5em;animation:twinkle .45s ease-in-out infinite alternate}
.puff{position:absolute;left:40%;top:-.2em;width:.35em;height:.35em;border-radius:50%;background:rgba(210,210,210,.85);opacity:0;animation:puff 1.2s linear infinite}
.puff.p2{left:15%;animation-delay:.4s}.puff.p3{left:65%;animation-delay:.8s}
@keyframes puff{0%{transform:translate(0,0) scale(.5);opacity:.9}100%{transform:translate(.2em,-1.1em) scale(1.9);opacity:0}}
@keyframes twinkle{from{opacity:.3;transform:scale(.8)}to{opacity:1;transform:scale(1.2)}}
/* doğranmış salata */
.chopped{width:1.35em;height:.78em;border-radius:40%;background:
  radial-gradient(circle at 18% 35%,#d8342a .09em,transparent .1em),
  radial-gradient(circle at 38% 72%,#7cb342 .09em,transparent .1em),
  radial-gradient(circle at 55% 28%,#7cb342 .09em,transparent .1em),
  radial-gradient(circle at 72% 64%,#d8342a .09em,transparent .1em),
  radial-gradient(circle at 87% 36%,#7cb342 .08em,transparent .09em),
  radial-gradient(circle at 28% 55%,#e8e2a0 .07em,transparent .08em),
  radial-gradient(circle at 63% 47%,#d8342a .08em,transparent .09em),
  radial-gradient(circle at 46% 52%,#9ccc65 .08em,transparent .09em),
  radial-gradient(circle at 12% 70%,#9ccc65 .07em,transparent .08em),
  radial-gradient(circle at 82% 78%,#e8e2a0 .07em,transparent .08em)}
/* tik */
.check{position:absolute;right:-.14em;bottom:-.08em;width:.55em;height:.55em;border-radius:50%;background:#2fa84f;box-shadow:0 0 0 .05em #fff}
.check::after{content:"";position:absolute;left:.19em;top:.07em;width:.13em;height:.26em;border:solid #fff;border-width:0 .07em .07em 0;transform:rotate(45deg)}

/* ---------- ÜST BAR ---------- */
#topbar{display:flex;align-items:center;justify-content:space-between;gap:6px}
.paper{background:var(--cream);box-shadow:0 2px 3px rgba(0,0,0,.3);padding:3px 10px;font-weight:900}
#clock{font-size:clamp(17px,calc(var(--u)*2.9),25px);font-variant-numeric:tabular-nums;rotate:-1.5deg;background:var(--navy);color:#fff;letter-spacing:.04em}
#hearts{display:flex;gap:2px;min-width:0;font-size:clamp(18px,calc(var(--u)*2.8),24px)}
#hearts .asset.lost{opacity:.22;filter:grayscale(1)}
#scoreBox{font-size:clamp(11px,calc(var(--u)*1.9),15px);rotate:1.2deg;display:flex;align-items:baseline;gap:5px;margin-left:auto}
#score{font-size:clamp(17px,calc(var(--u)*2.7),23px);font-variant-numeric:tabular-nums;min-width:2.1em;text-align:right}
#muteBtn{position:relative;width:34px;height:34px;flex:none;display:grid;place-items:center;font-size:17px;background:var(--cream);border-radius:50%;box-shadow:0 2px 3px rgba(0,0,0,.3)}
#muteBtn::after{content:"";position:absolute;inset:-11px}

/* ---------- YEMEK ODASI ---------- */
#window{position:absolute;left:-8px;right:-8px;top:0;height:clamp(44px,calc(var(--u)*7.2),64px);overflow:hidden;background:linear-gradient(var(--night),#22305a);box-shadow:0 2px 4px rgba(0,0,0,.3)}
#window svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#fwLayer{position:absolute;inset:0}
.fwp{position:absolute;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%}
#seats{position:absolute;inset:0;display:flex;gap:6px}
.seat{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:2px;border-radius:10px}
.armed .seat{z-index:60;box-shadow:0 0 0 3px #ffe066;background:rgba(255,236,160,.14)}
.armed .seat::after{content:"";position:absolute;inset:0;border-radius:10px;box-shadow:0 0 22px 6px rgba(255,224,102,.95);animation:glow .7s ease-in-out infinite alternate;pointer-events:none}
@keyframes glow{from{opacity:.3}to{opacity:1}}
.tk-wrap{width:100%;flex:1;min-height:0;display:flex}
.ticket{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;padding:6px 6px 7px;rotate:var(--r,0deg);
  background:#fff;background-image:repeating-linear-gradient(#fff 0 13px,#eef2ef 13px 14px);box-shadow:0 3px 8px rgba(0,40,10,.3);transition:opacity .35s}
.ticket.eating{box-shadow:0 0 0 2px #ffd54a,0 2px 4px rgba(0,0,0,.35)}
.ticket.gone{opacity:0}
.ticket::after{content:"";position:absolute;inset:0;background:rgba(229,50,45,.38);opacity:0;pointer-events:none}
.ticket.urgent{animation:tkShake .5s ease-in-out infinite}
.ticket.urgent::after{opacity:1;animation:blink .45s steps(2,start) infinite}
@keyframes tkShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px) rotate(-1deg)}75%{transform:translateX(2px) rotate(1deg)}}
.titems{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,var(--ic));grid-auto-rows:var(--ic);gap:4px;justify-content:center;align-content:center;font-size:var(--ic)}
.titem{position:relative;width:var(--ic);height:var(--ic);display:grid;place-items:center}
.titem:only-child,.titem:nth-child(3):last-child{grid-column:1 / -1;justify-self:center}
.titem .cup,.tslot .cup{font-size:1.3em}
.titem .check{font-size:1.45em;left:50%;top:50%;right:auto;bottom:auto;margin:-.275em 0 0 -.275em}
.titem.done>.asset:first-child{opacity:.35}
.titem.pop .check{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.4)}100%{transform:scale(1)}}
.pbar{flex:none;height:12px;margin-top:5px;background:rgba(0,0,0,.15);border-radius:6px;overflow:hidden}
.pfill{height:100%;width:100%;transform-origin:0 50%;background:var(--green);border-radius:6px}
.pfill.y{background:var(--amber)}
.pfill.r{background:var(--red);animation:blink .45s steps(2,start) infinite}
@keyframes blink{50%{opacity:.25}}
.g-wrap{position:relative;flex:none;font-size:var(--fs);width:1.1em;height:.78em}
.g-slot{position:absolute;inset:0}
.g-crop{position:absolute;inset:0;overflow:hidden}
.guest{position:absolute;left:0;right:0;top:0;text-align:center;line-height:1}
.gface{display:inline-block;transition:transform .12s ease-out}
.guest.smile .gface{transform:scale(1.12)}
/* kağıt kesiği figürler (1em = figür boyu; 390 genişlikte kafa ≈ 44px) */
.fig{position:relative;display:inline-block;vertical-align:bottom;width:1em;height:1em;rotate:var(--fr,-1.5deg)}
.fig i{position:absolute;display:block}
.fig .bd{left:.06em;right:.06em;bottom:-.14em;height:.52em;border-radius:50% 50% 14% 14% / 72% 72% 14% 14%;background:var(--shirt);box-shadow:0 0 0 .018em rgba(255,255,255,.7),0 .025em .05em rgba(0,0,0,.3),inset 0 -.05em 0 rgba(0,0,0,.12)}
.fig .hd{left:50%;top:.13em;width:.52em;height:.52em;margin-left:-.26em;border-radius:50%;background:#f0c49b;box-shadow:0 .02em .045em rgba(0,0,0,.32)}
.fig .ey{left:.14em;top:.205em;width:.05em;height:.05em;border-radius:50%;background:#2a1d12;box-shadow:.19em 0 0 #2a1d12}
.fig .mo{left:50%;top:.32em;width:.13em;height:.055em;margin-left:-.065em;border-bottom:.02em solid #7a3526;border-radius:0 0 50% 50%;transition:transform .15s ease-out}
.guest.sad .mo{transform:translateY(.035em) rotate(180deg)}
.fig .hr{left:50%;top:.1em;width:.56em;height:.2em;margin-left:-.28em;background:var(--hair);border-radius:50% 50% 16% 16% / 100% 100% 16% 16%;box-shadow:0 .015em .03em rgba(0,0,0,.25)}
.fig-teyze{--shirt:var(--c-teyze);--hair:#b8b4ad;--fr:-2deg}
.fig-teyze .bd::before{content:"";position:absolute;left:50%;top:0;width:.16em;height:.26em;margin-left:-.08em;background:#f4ead2;clip-path:polygon(0 0,100% 0,50% 100%)}
.fig-teyze .bn{left:50%;top:.01em;width:.21em;height:.18em;margin-left:-.105em;border-radius:50%;background:#a9a59e;box-shadow:0 .015em .03em rgba(0,0,0,.25)}
.fig-teyze .gl{left:.095em;top:.16em;width:.14em;height:.14em;border:.016em solid #3a2e28;border-radius:50%}
.fig-teyze .gl::after{content:"";position:absolute;left:.174em;top:-.016em;width:.14em;height:.14em;border:.016em solid #3a2e28;border-radius:50%}
.fig-teyze .gl::before{content:"";position:absolute;left:.124em;top:.047em;width:.05em;height:.016em;background:#3a2e28}
.fig-adam{--shirt:var(--c-adam);--hair:#1f1a17;--fr:1.5deg}
.fig-adam .hr{top:.11em;height:.17em}
.fig-adam .bd::before{content:"";position:absolute;left:50%;top:.01em;width:.28em;height:.07em;margin-left:-.14em;border-radius:50%;background:rgba(0,0,0,.28)}
.fig-cocuk{--shirt:var(--c-cocuk);--hair:#5a3418;--fr:-1deg}
.fig-cocuk .pt{left:.73em;top:.15em;width:.16em;height:.32em;border-radius:50% 50% 50% 50% / 40% 40% 60% 60%;background:var(--hair);rotate:28deg;box-shadow:0 .015em .03em rgba(0,0,0,.25)}
.guest.arrive{animation:arrive .45s cubic-bezier(.2,.9,.3,1.25)}
.guest.leave{animation:leave .4s .45s ease-in forwards}
@keyframes arrive{from{transform:translateY(70%);opacity:0}to{transform:none;opacity:1}}
@keyframes leave{to{transform:translateY(80%);opacity:0}}
.bubble{position:absolute;left:50%;bottom:92%;transform:translate(-50%,0);background:#fff;color:var(--ink);font-size:13px;font-weight:900;padding:4px 8px;border-radius:12px;white-space:nowrap;box-shadow:0 2px 3px rgba(0,0,0,.3);opacity:0;z-index:5;pointer-events:none}
.bubble.angry{background:var(--red);color:#fff}
.bubble.show{animation:bubble .9s forwards}
@keyframes bubble{0%{opacity:0;transform:translate(-50%,6px) scale(.7)}25%{opacity:1;transform:translate(-50%,0) scale(1.08)}40%{transform:translate(-50%,0) scale(1)}100%{opacity:1;transform:translate(-50%,-6px) scale(1)}}

/* ---------- MUTFAK ---------- */
#kitchen{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:16px 8px;padding-top:8px}
.kcol{display:contents}
#oven{grid-area:1 / 1}#board{grid-area:1 / 2}#plate{grid-area:2 / 1}#fridge{grid-area:2 / 2}
.station{position:relative;min-height:0;rotate:var(--r,0deg);border-radius:6px;background:var(--white);box-shadow:0 4px 10px rgba(0,50,15,.28)}
.tape{position:absolute;top:-9px;left:10px;z-index:4;background:var(--dgreen);color:#fff;font-weight:900;font-size:11px;letter-spacing:.08em;padding:2px 8px;rotate:-3deg;box-shadow:0 1px 2px rgba(0,0,0,.28);pointer-events:none;white-space:nowrap}
.tape::after{content:"";position:absolute;top:-5px;left:50%;width:24px;height:10px;margin-left:-12px;background:rgba(255,255,240,.55);transform:rotate(5deg);box-shadow:0 0 1px rgba(0,0,0,.15)}
.tape.small{left:50%;transform:translateX(-50%);padding:2px 6px;font-size:10px}
.oven-door{position:absolute;inset:16px 8px 8px 8px;background:#3a2118;border-radius:10px;box-shadow:inset 0 0 0 4px #d9c29a,inset 0 0 0 6px #3a2118;overflow:hidden;display:grid;place-items:center;container-type:size}
.oven-glow{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 72%,rgba(255,140,40,.7),transparent 66%);opacity:0;transition:opacity .3s}
#oven.cooking .oven-glow{opacity:1}
#oven.ready .oven-glow{opacity:1;animation:glow .45s ease-in-out infinite alternate}
.ghost{display:inline-block;opacity:.25;filter:grayscale(1)}
.oven-empty{position:relative;display:grid;place-items:center}
.oven-empty .asset{opacity:.25}
.plus{position:absolute;left:50%;top:50%;transform:translate(-50%,-54%);font-size:.72em;font-weight:900;line-height:1;color:#f6ecd4;text-shadow:0 1px 3px rgba(0,0,0,.6)}
#ovenFood{position:relative;z-index:1;font-size:40px;font-size:min(34cqw,52cqh);line-height:1}
.ring{position:absolute;left:50%;top:50%;width:80%;width:min(86cqw,90cqh);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;z-index:0;opacity:0;
  background:conic-gradient(var(--rc,#ffb300) calc(var(--p,0)*360deg),rgba(255,255,255,.14) 0)}
.ring::after{content:"";position:absolute;inset:9%;border-radius:50%;background:#3a2118}
#oven.cooking .ring,#oven.ready .ring{opacity:1}
.ready-tag,.burnt-tag{position:absolute;left:50%;bottom:14px;z-index:3;font-weight:900;font-size:12px;padding:2px 8px;border-radius:3px;opacity:0;transform:translateX(-50%) rotate(-3deg);pointer-events:none}
.ready-tag{background:#ffe066;color:var(--ink)}
.burnt-tag{background:#e2332b;color:#fff}
#oven.ready .ready-tag{opacity:1}
#oven.burnt .burnt-tag{opacity:1;animation:blink .5s steps(2,start) infinite}
#oven.burnt .oven-door::after{content:"";position:absolute;inset:0;border-radius:10px;box-shadow:inset 0 0 0 4px #ff2b1c;animation:blink .5s steps(2,start) infinite}
.dish{position:absolute;left:4%;right:4%;top:22px;bottom:12px;border-radius:50%;
  background:radial-gradient(#fff 52%,#e7e2d6 54%,#fff 62%,#d4cdbd 100%);box-shadow:0 3px 4px rgba(0,0,0,.3);
  display:flex;align-items:center;justify-content:center;container-type:inline-size;font-size:44px}
.pslot{flex:none;width:44px;height:44px;display:grid;place-items:center}
.pslot+.pslot{margin-left:clamp(-6px,calc((100cqw - 176px) / 3),5px)}
.badge{position:absolute;top:5px;right:6px;z-index:3;isolation:isolate;background:var(--navy);color:#fff;font-weight:900;font-size:12px;padding:2px 7px;border-radius:8px;font-variant-numeric:tabular-nums}
.badge.alert{animation:alertScale .7s}
.badge.alert::after{content:"";position:absolute;inset:0;border-radius:inherit;background:#e2332b;z-index:-1;animation:blink .25s steps(2,start) 3}
@keyframes alertScale{0%,100%{transform:scale(1)}20%,60%{transform:scale(1.4)}40%,80%{transform:scale(1.1)}}
.cboard{position:absolute;left:6%;right:15%;top:18px;bottom:22px;background:#d9a066;border-radius:8px;box-shadow:inset 0 -4px 0 #b77f47,0 2px 3px rgba(0,0,0,.3);display:grid;place-items:center;container-type:size}
#boardFood{font-size:36px;font-size:min(30cqw,62cqh);line-height:1}
.prog{position:absolute;left:16%;right:16%;bottom:7px;display:flex;gap:4px}
.prog i{flex:1;height:7px;border-radius:3px;background:rgba(0,0,0,.28)}
.prog i.on{background:var(--green)}
.cboard::after{content:"";position:absolute;right:-17px;top:50%;width:20px;height:28px;margin-top:-14px;background:#d9a066;border-radius:0 13px 13px 0;box-shadow:inset 0 -3px 0 #b77f47}
.cboard::before{content:"";position:absolute;right:-11px;top:50%;width:7px;height:12px;margin-top:-6px;border-radius:4px;background:var(--white);z-index:1}
.badge.hide{opacity:0}
#fridge{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:minmax(0,1fr);gap:0;padding:12px 0 0;container-type:size}
.fbtn{min-height:64px;min-width:0;display:grid;place-items:center;font-size:52px;font-size:min(46cqw,56cqh);background:#eef3ef;background-clip:padding-box;border:4px solid transparent;border-radius:10px}

/* ---------- ALT SATIR ---------- */
#bottom{display:grid;grid-template-columns:minmax(0,1fr) 60px auto;gap:8px;align-items:center;padding-top:6px}
#tray{height:100%;display:flex;align-items:stretch;gap:4px;padding:12px 6px 6px}
.tslot{flex:1;min-width:56px;min-height:56px;display:grid;place-items:center;border:2px dashed rgba(0,0,0,.18);border-radius:8px;background:#f3f6f4;font-size:var(--ic)}
#trash{height:100%;min-height:56px;display:grid;place-items:center;font-size:clamp(26px,calc(var(--u)*4.4),38px)}
#trash.urge{animation:trashBeat .8s ease-in-out infinite}
#trash::after{content:"";position:absolute;inset:-3px;border-radius:4px;box-shadow:0 0 0 3px #ffe066,0 0 18px 5px rgba(255,210,60,.95);opacity:0;pointer-events:none}
#trash.urge::after{animation:urgeGlow .8s ease-in-out infinite}

#joker{position:relative;z-index:3;width:clamp(64px,calc(var(--u)*10),84px);aspect-ratio:1;border-radius:50%;background:var(--green);border:4px solid #fff;
  box-shadow:0 4px 0 var(--dgreen),0 6px 10px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;font-weight:900;color:#fff;transition:opacity .3s}
#joker::before{content:"";position:absolute;inset:-8px;border-radius:50%;pointer-events:none;background:conic-gradient(#fff calc(var(--jc,1)*360deg),rgba(0,0,0,.25) 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px))}
#joker .jk-icon{font-size:22px;color:#fff;margin-bottom:2px}
#joker .jk-t{font-size:12px;letter-spacing:-.01em;white-space:nowrap}
#joker.charging .jk-icon,#joker.charging .jk-t{opacity:.5}
#joker.ready{animation:beat 1.3s ease-in-out infinite}
#joker.armed{z-index:60;box-shadow:0 0 0 4px #fff,0 0 22px 8px rgba(255,255,255,.9)}
.scooter-svg{display:inline-block;width:1.35em;height:1em;vertical-align:middle}
.scooter-svg svg{display:block;width:100%;height:100%}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.13)}30%{transform:scale(1)}45%{transform:scale(1.07)}}

/* ---------- KATMANLAR ---------- */
#dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:50;transition:opacity .12s}
.armed #dim{opacity:.4}
.ending #dim{opacity:.35;transition:opacity .4s}
#fx{position:absolute;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.fly{position:absolute;line-height:1;will-change:transform}
.crumb{position:absolute;width:6px;height:5px;border-radius:1px}
.float{position:absolute;left:0;top:0;font-weight:900;font-size:20px;color:var(--dgreen);text-shadow:0 1px 0 #fff,0 0 4px #fff;white-space:nowrap;will-change:transform,opacity}
.float.neg{color:var(--red)}
.float.big{font-size:32px;color:var(--navy)}
.banner{position:absolute;left:0;top:42%;width:100%;text-align:center;background:var(--cream);color:var(--red);font-weight:900;font-size:clamp(21px,calc(var(--u)*3.8),34px);padding:10px 0;box-shadow:0 4px 8px rgba(0,0,0,.35);white-space:nowrap}
.banner::before,.banner::after{content:"";position:absolute;top:-6px;width:46px;height:16px;background:rgba(255,255,240,.6);box-shadow:0 0 1px rgba(0,0,0,.2)}
.banner::before{left:12%;transform:rotate(-8deg)}.banner::after{right:12%;transform:rotate(7deg)}
.scooter{position:absolute;left:0;top:0;font-size:58px;line-height:1;white-space:nowrap;color:var(--green);filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
.scooter .asset{transform:scaleX(var(--flip,1))}
.speed{display:inline-block;width:60px;height:4px;margin-left:-4px;vertical-align:middle;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9));border-radius:2px;order:-1}
/* öğretici: %70 karartma + spot ışığı + kağıt etiket */
#tutSpot{position:absolute;left:0;top:0;z-index:66;display:none;border-radius:14px;pointer-events:none;box-shadow:0 0 0 3000px rgba(0,0,0,.7);will-change:transform}
#tutSpot::after{content:"";position:absolute;inset:-3px;border-radius:inherit;border:3px solid #ffe066;box-shadow:0 0 18px 4px rgba(255,224,102,.85);animation:tutPulse 1s ease-in-out infinite}
#tutSpot.wait::after{animation:none;opacity:.45}
@keyframes tutPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.06);opacity:.5}}
#tutLabel{position:absolute;left:0;top:0;z-index:78;display:none;pointer-events:none;will-change:transform}
#tutLabel span{display:block;background:var(--cream);color:var(--ink);font-weight:900;font-size:clamp(20px,calc(var(--u)*3),27px);line-height:1.15;padding:9px 16px;white-space:normal;max-width:310px;text-align:center;box-shadow:0 5px 12px rgba(0,0,0,.5);rotate:-2deg}
#tutLabel span::before{content:"";position:absolute;top:-8px;left:50%;width:44px;height:16px;margin-left:-22px;background:rgba(255,255,240,.65);transform:rotate(4deg);box-shadow:0 0 1px rgba(0,0,0,.2)}
#countdown{position:absolute;left:0;right:0;top:8%;text-align:center;font-size:clamp(64px,calc(var(--u)*13),120px);font-weight:900;color:#fff;
  text-shadow:0 4px 0 #c62828,0 0 22px rgba(0,0,0,.45);pointer-events:none;z-index:65;opacity:0;line-height:1}
#countdown.show{opacity:.88}
#fwCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:80;opacity:0;transition:opacity .4s}
#fwCanvas.show{opacity:1}
#endMsg{position:absolute;left:6%;right:6%;top:36%;z-index:85;text-align:center;background:var(--cream);padding:16px 12px;font-weight:900;box-shadow:0 6px 14px rgba(0,0,0,.4);rotate:-2deg;opacity:0;transform:scale(.6);transition:opacity .25s,transform .4s cubic-bezier(.2,1.4,.4,1);pointer-events:none}
#endMsg.show{opacity:1;transform:scale(1)}
.em-big{font-size:clamp(32px,calc(var(--u)*6),52px);color:var(--black);line-height:1.05}
.em-sub{display:inline-block;margin-top:8px;background:var(--amber);padding:4px 10px;font-size:18px;rotate:1.5deg}
.em-lose{font-size:clamp(22px,calc(var(--u)*3.8),32px);color:var(--ink);line-height:1.2}

/* ---------- EKRANLAR ---------- */
.screen{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*1.7);padding:20px 18px;text-align:center;
  background-color:var(--kraft);background-image:inherit;background-size:inherit;opacity:0;pointer-events:none;transition:opacity .4s}
.screen.show{opacity:1;pointer-events:auto}
.btn{min-height:56px;padding:0 28px;font-weight:900;font-size:19px;letter-spacing:.03em;background:var(--black);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.35),0 7px 12px rgba(0,0,0,.25);rotate:-1deg;border-radius:6px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35),0 3px 6px rgba(0,0,0,.25)}
.btn.big{min-height:64px;font-size:23px;padding:0 36px}
.btn.alt{background:#fff;color:var(--black);box-shadow:0 4px 0 rgba(0,0,0,.25),0 7px 12px rgba(0,0,0,.2);rotate:1deg}
.st-deco{display:flex;gap:14px;font-size:64px;padding-bottom:10px}
.st-title{display:flex;flex-direction:column;align-items:center;gap:6px}
.st-title span{display:inline-block;background:var(--black);color:#fff;font-size:clamp(34px,calc(var(--u)*6.4),54px);line-height:1.05;padding:6px 16px;box-shadow:0 4px 8px rgba(0,0,0,.3)}
.st-title span:nth-child(1){rotate:-2.5deg}.st-title span:nth-child(2){rotate:2deg;background:#fff;color:var(--black)}
.st-sub{max-width:300px;font-size:17px;font-weight:800;line-height:1.35;background:var(--cream);padding:10px 14px;rotate:.8deg;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.st-brand{font-size:13px;font-weight:800;line-height:1.35;color:#fff;max-width:290px}
.res-title{font-size:clamp(22px,calc(var(--u)*3.9),34px);font-weight:900;line-height:1.15;background:var(--cream);padding:8px 14px;rotate:-1.5deg;box-shadow:0 3px 6px rgba(0,0,0,.25);max-width:100%}
.res-sub{background:var(--amber);padding:4px 12px;font-weight:900;font-size:16px;rotate:1.5deg;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.res-stats{display:grid;grid-template-columns:1fr auto;gap:3px 18px;background:#fff;padding:9px 16px;font-size:15px;font-weight:700;min-width:240px;text-align:left;box-shadow:0 2px 4px rgba(0,0,0,.2);rotate:.5deg}
.res-stats b{text-align:right;font-variant-numeric:tabular-nums}
.res-stats .full{grid-column:1 / -1;margin-top:5px;padding-top:6px;border-top:2px solid #eef2ef;color:var(--dgreen);font-weight:900}
.res-tag{font-size:clamp(26px,calc(var(--u)*4.6),40px);font-weight:900;color:var(--navy);line-height:1.1}

.cp-brand{font-size:12px;font-weight:900;letter-spacing:.15em;color:var(--dgreen)}
.cp-text{font-size:15px;font-weight:900;margin:3px 0}
.cp-code{font-size:14px;font-weight:800}
.cp-code b{font-size:20px;letter-spacing:.02em;color:var(--navy)}
.res-btns{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:2px}
#toast{position:absolute;left:50%;bottom:12%;z-index:120;transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:11px 18px;border-radius:22px;font-weight:800;font-size:15px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
#debug{position:absolute;left:4px;bottom:4px;z-index:130;background:rgba(0,0,0,.78);color:#8f8;font:10px/1.3 ui-monospace,Menlo,monospace;padding:4px 6px;white-space:pre;pointer-events:none;max-width:97%;overflow:hidden;display:none}
/* ---------- MASAÜSTÜ KARŞILAMA ---------- */
#phone{display:contents}
#side{display:none}
body.desktop{background:var(--dgreen);background-image:radial-gradient(ellipse at 30% 40%,rgba(43,179,75,.45),transparent 60%)}

body.desktop #game{max-width:none;border-radius:40px;box-shadow:none}
body.desktop #side{display:flex;flex-direction:column;align-items:flex-start;gap:26px;max-width:430px;color:var(--cream)}
.sd-title{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.sd-title span{display:inline-block;background:var(--black);color:#fff;font-size:clamp(40px,4.2vw,62px);line-height:1.05;padding:6px 18px;box-shadow:0 4px 10px rgba(0,0,0,.35);rotate:-2deg}
.sd-title span:nth-child(2){background:#fff;color:var(--black);rotate:1.5deg;margin-left:22px}
.sd-desc{font-size:20px;font-weight:800;line-height:1.4;max-width:400px}
.sd-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--cream);color:var(--ink);padding:18px 18px 14px;rotate:-1.5deg;box-shadow:0 6px 14px rgba(0,0,0,.4)}
.sd-card::before{content:"";position:absolute;top:-9px;left:50%;width:70px;height:18px;margin-left:-35px;background:rgba(255,255,240,.6);transform:rotate(3deg);box-shadow:0 0 1px rgba(0,0,0,.2)}
#sdQr svg{display:block;width:210px;height:210px}
.sd-scan{font-size:19px;font-weight:900}
/* ---------- geri bildirim ---------- */
#clock.late{background:var(--red)}
#clock.pulse{animation:clockPulse .5s ease-in-out infinite}
@keyframes clockPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.hbubble{position:absolute;left:-14px;right:-14px;top:-8px;z-index:6;text-align:center;pointer-events:none;font-size:13px;line-height:1}
.hbubble span{display:inline-block;background:var(--red);color:#fff;font-size:13px;font-weight:900;padding:3px 8px;border-radius:10px;white-space:nowrap;box-shadow:0 2px 4px rgba(0,0,0,.3);opacity:0;transform:scale(.4);transform-origin:50% 100%;transition:opacity .15s,transform .25s cubic-bezier(.2,1.5,.4,1)}
.hbubble.show span{opacity:1;transform:scale(1)}
#holdMsg{position:absolute;left:8%;right:8%;top:38%;z-index:86;text-align:center;background:#fff;padding:20px 12px;font-weight:900;font-size:clamp(22px,calc(var(--u)*3.6),30px);line-height:1.25;box-shadow:0 8px 18px rgba(0,0,0,.4);rotate:-1.5deg;opacity:0;transform:scale(.6);transition:opacity .2s,transform .35s cubic-bezier(.2,1.4,.4,1);pointer-events:none}
#holdMsg.show{opacity:1;transform:scale(1)}
#holdMsg b{display:block;color:var(--red);font-size:1.25em;margin-top:4px}
.holding #dim{opacity:.45}
/* sürükle-bırak */
.tslot,#plate{touch-action:none}
.drag-ghost{position:absolute;left:0;top:0;z-index:74;pointer-events:none;line-height:1;filter:drop-shadow(0 8px 8px rgba(0,0,0,.35));will-change:transform}
.drag-ghost .cup{font-size:1.3em}
.pick.dragging{opacity:.25}
.drop-over{outline:4px solid #fff;outline-offset:-3px}
/* öğretici kapanış kartı */
#tutCard{position:absolute;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.7)}
#tutCard.show{display:flex}
.tc-box{background:#fff;padding:24px 20px 22px;text-align:center;rotate:-1.5deg;box-shadow:0 10px 24px rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;gap:20px;max-width:320px}
.tc-text{font-size:clamp(20px,calc(var(--u)*2.9),24px);font-weight:900;line-height:1.3}
</style>
</head>

(() => {
'use strict';

/* =====================================================================
   CONFIG — tüm ayarlar burada

const params = new URLSearchParams(location.search);
const DEBUG = params.get('debug') === '1';
const EASY = params.get('easy') === '1';
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const pad2 = n => String(n).padStart(2, '0');
const clamp01 = x => (x < 0 ? 0 : x > 1 ? 1 : x);
function weightedPick(w) {
  let total = 0;
  for (const k in w) total += w[k];
  let r = Math.random() * total, last = null;
  for (const k in w) { last = k; r -= w[k]; if (r <= 0) return k; }
  return last;
}
function tiltFor(seed) {
  const x = Math.sin(seed * 12.9898 + 78.233) * 43758.5453;
  return ((x - Math.floor(x)) * 3 - 1.5).toFixed(2);
}
function clockText(t) {
  const m = Math.floor(t / CONFIG.game.duration * 60);
  const h = CONFIG.game.clockStartHour;
  if (m >= 60) return pad2((h + 1) % 24) + ':00';
  return pad2(h) + ':' + pad2(Math.max(0, m));
}
function phaseAt(t) {
  const p = CONFIG.game.phaseStarts;
  return t >= p[2] ? 2 : t >= p[1] ? 1 : 0;
}

const Sound = {
  ctx: null, master: null, muted: false, nbuf: null, primed: false,
  /** touchend / pointerup / click gibi gerçek kullanıcı hareketlerinde çağrılır (iOS + Android). */
  unlock() {
    if (this.muted || document.hidden) return;          // sessizdeyken hiçbir şey açılmaz
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { if (navigator.audioSession && navigator.audioSession.type !== 'playback') navigator.audioSession.type = 'playback'; } catch (e) {}
    if (!this.ctx) {
      try {
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = this.muted ? 0 : 0.55;
        this.master.connect(this.ctx.destination);
      } catch (e) { this.ctx = null; return; }
    }
    if (this.ctx.state !== 'running') {
      const p = this.ctx.resume();
      if (p && p.catch) p.catch(() => {});
    }
    if (!this.primed || this.ctx.state !== 'running') {
      try {                                             // sessiz 1 örneklik buffer: iOS kilidini açar
        const b = this.ctx.createBuffer(1, 1, 22050), src = this.ctx.createBufferSource();
        src.buffer = b; src.connect(this.ctx.destination); src.start(0);
        this.primed = true;
      } catch (e) {}
    }
  },
  resumeIfAllowed() {
    if (!this.ctx || this.muted || document.hidden || this.ctx.state === 'running') return;
    const p = this.ctx.resume();
    if (p && p.catch) p.catch(() => {});
  },
  setMuted(m) { this.muted = m; if (this.master) this.master.gain.value = m ? 0 : 0.55; },
  tone(freq, dur, o) {
    o = o || {};
    const c = this.ctx; if (!c) return;
    const t0 = c.currentTime + (o.delay || 0);
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide, t0 + dur);
    const vol = o.vol || 0.2, att = Math.min(0.01, dur / 3);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + att);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(this.master);
    osc.start(t0); osc.stop(t0 + dur + 0.03);
  },
  noise(dur, o) {
    o = o || {};
    const c = this.ctx; if (!c) return;
    if (!this.nbuf) {
      const len = c.sampleRate;
      const b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.nbuf = b;
    }
    const t0 = c.currentTime + (o.delay || 0);
    const s = c.createBufferSource(); s.buffer = this.nbuf;
    const f = c.createBiquadFilter(); f.type = o.type || 'lowpass'; f.frequency.value = o.freq || 1000; f.Q.value = o.q || 1;
    const g = c.createGain();
    g.gain.setValueAtTime(o.vol || 0.3, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t0); s.stop(t0 + dur + 0.03);
  },
  play(name) {
    if (!this.ctx || this.muted || this.ctx.state !== 'running') return;
    const T = (f, d, o) => this.tone(f, d, o), N = (d, o) => this.noise(d, o);

      case 'burn':     N(.5, { vol: .25, freq: 500 }); T(260, .45, { type: 'sawtooth', vol: .12, slide: 90 }); break;

let S = null;

function newState(mode) {
  return {
    mode,                   // start | play | ending | result
    t: 0, paused: false, phase: 0,
    hearts: CONFIG.game.hearts, score: 0,
    oven: { state: 'empty', timer: 0, readyTotal: 1, warned: false },   // empty | cooking | ready | burnt
    plate: 0,
    salad: { stage: 0, lastTapMs: -1e9 },
    tray: new Array(CONFIG.tray.slots).fill(null),
    selection: null,        // {src:'plate'} | {src:'tray', idx}
    seats: Array.from({ length: CONFIG.game.seatCount }, () => ({ guest: null, respawnAt: null })),
    spawnQueue: CONFIG.game.intro.map(x => Object.assign({}, x)),
    lastLeaveT: -1e9,
    joker: { charge: 1, armed: false },
    hold: 0, holdText: '',
    stats: { fed: 0, served: 0, taps: 0, jokers: 0 },
    tut: null,
    endKind: null, endTimer: 0, perfect: false, endClock: '',
    events: [],
  };
}
function fx(type, data) { S.events.push(Object.assign({ type }, data || {})); }

/* ---------- seçim ---------- */
function selectedItem() {
  const s = S.selection;
  if (!s) return null;
  if (s.src === 'plate') return S.plate > 0 ? 'drum' : null;
  return S.tray[s.idx] || null;
}
function isSelected(src, idx) {
  const s = S.selection;
  return !!s && s.src === src && (src === 'plate' || s.idx === idx);
}
function consumeSelected() {
  const s = S.selection;
  let from;
  if (s.src === 'plate') { S.plate--; from = { src: 'plate', idx: S.plate }; }
  else { S.tray[s.idx] = null; from = { src: 'tray', idx: s.idx }; }
  S.selection = null;
  return from;
}
const freeTraySlot = () => S.tray.indexOf(null);

function addScore(delta, anchor, big) {
  if (!delta) return;
  S.score = Math.max(0, S.score + delta);
  fx('float', { text: (delta > 0 ? '+' : '') + delta, anchor, neg: delta < 0, big: !!big });
}

/* ---------- misafirler ---------- */
function makeOrder(g) {
  const cfg = CONFIG.guests[g.type];
  const intro = S.t < CONFIG.game.introDrinkOnlyUntil;
  let size;
  if (intro) size = 1;
  else { const r = CONFIG.orderSize[S.phase]; size = randInt(r[0], r[1]); }
  size = Math.min(size, CONFIG.maxOrderItems);
  const pool = {};
  for (const k in cfg.weights) if (!intro || CONFIG.drinks.includes(k)) pool[k] = cfg.weights[k];
  const items = [];
  let drums = 0;
  for (let i = 0; i < size; i++) {
    if (!Object.keys(pool).length) break;
    const it = weightedPick(pool);
    items.push(it);
    if (it === 'drum') { drums++; if (drums >= cfg.maxDrum) delete pool.drum; }
    else delete pool[it];
  }
  g.order = items.map(item => ({ item, done: false, doneAt: -9 }));
  const jitter = 1 + rand(-CONFIG.patienceJitter, CONFIG.patienceJitter);
  const p = cfg.patience[S.phase] * jitter * (EASY ? CONFIG.easyPatienceMultiplier : 1);
  g.patience = g.patienceMax = p;
  g.status = 'waiting';
  g.timer = 0;
  g.hungry = false;
}
function seatGuest(i, type) {
  const cfg = CONFIG.guests[type];
  const g = { id: ++guestSeq, type, roundsTotal: randInt(cfg.rounds[0], cfg.rounds[1]), roundsDone: 0,
              order: [], patience: 1, patienceMax: 1, status: 'waiting', timer: 0, smile: 0, leaveReason: null };
  S.seats[i].guest = g;
  S.seats[i].respawnAt = null;
  makeOrder(g);
  fx('arrive', { seat: i });
}
function guestLeave(i, reason) {
  const seat = S.seats[i], g = seat.guest;
  g.status = 'leaving';
  g.leaveReason = reason;
  g.timer = CONFIG.leaveTime;
  seat.respawnAt = S.t + CONFIG.respawnDelay;
  S.lastLeaveT = S.t;
  if (reason === 'full') { S.stats.fed++; fx('full', { seat: i }); }
  else { fx('angry', { seat: i }); loseHeart(g.type); }
}
function completeOrder(i, full) {
  const g = S.seats[i].guest;
  const ratio = full ? 1 : clamp01(g.patience / g.patienceMax);
  const bonus = Math.round(ratio * CONFIG.score.bonusMax);
  g.roundsDone++;
  g.status = 'eating';
  g.timer = CONFIG.eatTime;
  fx('complete', { seat: i, bonus });
  addScore(bonus, { seat: i }, true);
}
function afterEating(i) {
  const g = S.seats[i].guest;
  if (g.roundsDone >= g.roundsTotal) {
    if (S.t - S.lastLeaveT < CONFIG.noDoubleLeaveWindow) {
      g.roundsTotal++;                          // aynı anda kalkmama kuralı
      makeOrder(g);
      fx('order', { seat: i });
    } else guestLeave(i, 'full');
  } else {
    makeOrder(g);
    fx('order', { seat: i });
  }
}
function loseHeart(type) {
  if (S.hearts <= 0) return;
  S.hearts--;
  fx('heart', { idx: S.hearts });
  if (S.hearts <= 0) { endGame('lose'); return; }
  const T = CONFIG.text;
  const msg = T.heartLost.replace('{name}', T.guestNames[type] || T.guestNames.default);
  if (S.hearts === CONFIG.game.hearts - 1) { S.hold = CONFIG.hold.firstHeart; S.holdText = msg; }   // ilk kayıp: kısa duraklama
  else fx('heartBand', { text: msg });
}

/* ---------- oyuncu eylemleri ---------- */
function actOven() {
  const o = S.oven;
  switch (o.state) {
    case 'empty':
      o.state = 'cooking'; o.timer = CONFIG.oven.cookTime; o.warned = false;
      fx('ovenIn'); break;
    case 'cooking':
      fx('ovenBusy'); break;
    case 'ready':
      if (S.plate === 0) { S.plate = CONFIG.oven.drumsPerChicken; o.state = 'empty'; o.timer = 0; fx('ovenToPlate'); }
      else fx('plateBlocked');
      break;
    case 'burnt':
      o.state = 'empty'; o.timer = 0;
      addScore(CONFIG.score.burnt, 'oven');
      fx('clean'); break;
  }
}
function actPlate() {
  if (S.plate <= 0) { fx('nudge', { target: 'plate' }); return; }
  if (isSelected('plate')) { S.selection = null; fx('deselect'); }
  else { S.selection = { src: 'plate' }; fx('select'); }
}
function actTray(i) {
  if (!S.tray[i]) return;
  if (isSelected('tray', i)) { S.selection = null; fx('deselect'); }
  else { S.selection = { src: 'tray', idx: i }; fx('select'); }
}
function actSalad() {
  const now = performance.now();
  if (now - S.salad.lastTapMs < CONFIG.salad.minTapGapMs) return;
  S.salad.lastTapMs = now;
  const st = S.salad.stage;
  if (st < CONFIG.salad.taps - 1) { S.salad.stage = st + 1; fx('salad', { stage: st + 1 }); return; }
  const slot = freeTraySlot();
  if (slot < 0) { fx('trayFull'); return; }
  S.tray[slot] = 'salad';
  S.salad.stage = 0;
  fx('saladDone', { slot });
}
function actBottle(drink) {
  const slot = freeTraySlot();
  if (slot < 0) { fx('trayFull'); return; }
  S.tray[slot] = drink;
  fx('bottle', { drink, slot });
}
function actTrash() {
  const item = selectedItem();
  if (!item) { fx('nudge', { target: 'trash' }); return; }
  const from = consumeSelected();
  fx('trash', { item, from });
  addScore(CONFIG.score.trash, 'trash');
}
function actGuest(i) {
  const g = S.seats[i].guest;
  if (S.joker.armed) {
    if (!g || g.status !== 'waiting') { fx('wrong', { seat: i }); return; }
    useJoker(i);
    return;
  }
  let item = selectedItem();
  if (!item) {                                   // otomatik servis: önce tepsi, sonra tabak
    if (!g || g.status !== 'waiting') return;
    const need = g.order.filter(o => !o.done).map(o => o.item);
    const k = S.tray.findIndex(x => x && need.includes(x));
    if (k >= 0) S.selection = { src: 'tray', idx: k };
    else if (S.plate > 0 && need.includes('drum')) S.selection = { src: 'plate' };
    else return;
    item = selectedItem();
  }
  if (!g || g.status !== 'waiting') { fx('wrong', { seat: i }); return; }
  const entry = g.order.find(o => !o.done && o.item === item);
  if (!entry) { fx('wrong', { seat: i }); return; }
  const from = consumeSelected();
  entry.done = true; entry.doneAt = S.t;
  S.stats.served++;
  g.smile = CONFIG.smileTime;
  fx('deliver', { seat: i, item, from });
  addScore(CONFIG.score.item, { seat: i });
  if (g.order.every(o => o.done)) completeOrder(i, false);
}
function actJoker() {
  if (S.joker.charge < 1) { fx('jokerDenied'); return; }
  S.joker.armed = !S.joker.armed;
  fx(S.joker.armed ? 'jokerArm' : 'jokerDisarm');
}
function useJoker(i) {
  const g = S.seats[i].guest;
  S.joker.charge = 0;
  S.joker.armed = false;
  S.stats.jokers++;
  let n = 0;
  g.order.forEach(o => { if (!o.done) { o.done = true; o.doneAt = S.t; n++; } });
  S.stats.served += n;
  fx('joker', { seat: i });
  addScore(n * CONFIG.score.item, { seat: i });
  completeOrder(i, true);
}

/* ---------- güncelleme ---------- */
function updateOven(dt, frozen) {
  const o = S.oven;
  if (frozen && o.state !== 'cooking') return;
  if (o.state === 'cooking') {
    o.timer -= dt;
    if (o.timer <= 0) {
      o.state = 'ready';
      o.readyTotal = o.timer = CONFIG.oven.readyTime[S.phase];
      o.warned = false;
      fx('ovenReady');
    }
  } else if (o.state === 'ready') {
    o.timer -= dt;
    if (!o.warned && o.timer <= CONFIG.oven.warnBefore) { o.warned = true; fx('ovenWarn'); }
    if (o.timer <= 0) { o.state = 'burnt'; o.timer = 0; fx('burnt'); }
  }
}
function updateSeat(i, dt, frozen) {
  const seat = S.seats[i], g = seat.guest;
  if (!g) {
    if (!frozen && seat.respawnAt !== null && S.t >= seat.respawnAt) seatGuest(i, pick(CONFIG.guestTypes));
    return;
  }
  if (g.smile > 0) g.smile = Math.max(0, g.smile - dt);
  if (g.status === 'waiting') {
    if (frozen) return;
    g.patience -= dt;
    if (!g.hungry && g.patience / g.patienceMax <= CONFIG.thresholds.yellow) { g.hungry = true; fx('hungry', { seat: i }); }
    if (g.patience <= 0) { g.patience = 0; guestLeave(i, 'angry'); }
  } else if (g.status === 'eating') {
    g.timer -= dt;
    if (g.timer <= 0) afterEating(i);
  } else if (g.status === 'leaving') {
    g.timer -= dt;
    if (g.timer <= 0) seat.guest = null;
  }
}
function update(dt) {
  if (S.mode !== 'play' || S.paused) return;
  if (S.hold > 0) { S.hold = Math.max(0, S.hold - dt); return; }   // ilk kalp kaybı duraklaması
  tutUpdate();
  const frozen = tutFrozen();
  if (!frozen) {
    S.t += dt;
    const ph = phaseAt(S.t);
    if (ph !== S.phase) { S.phase = ph; fx('phase', { phase: ph }); }
    while (S.spawnQueue.length && S.t >= S.spawnQueue[0].t) {
      const s = S.spawnQueue.shift();
      if (!S.seats[s.seat].guest) seatGuest(s.seat, s.type);
    }
    if (S.joker.charge < 1) {
      S.joker.charge = Math.min(1, S.joker.charge + dt / CONFIG.joker.rechargeSec);
      if (S.joker.charge >= 1) fx('jokerUnlock');
    }
  }
  updateOven(dt, frozen);
  for (let i = 0; i < S.seats.length; i++) {
    updateSeat(i, dt, frozen);
    if (S.mode !== 'play') return;
  }
  if (S.selection && !selectedItem()) S.selection = null;
  if (S.t >= CONFIG.game.duration) { S.t = CONFIG.game.duration; endGame('win'); }
}
function endGame(kind) {
  if (S.mode !== 'play') return;
  S.mode = 'ending';
  S.endKind = kind;
  S.perfect = kind === 'win' && S.hearts === CONFIG.game.hearts;
  S.endClock = clockText(S.t);
  S.endTimer = kind === 'win' ? (S.perfect ? CONFIG.end.perfectHold : CONFIG.end.winHold) : CONFIG.end.loseHold;
  S.joker.armed = false;
  S.selection = null;
  fx('end', { kind });
}
function updateEnding(dt) {
  if (S.mode !== 'ending') return;
  S.endTimer -= dt;
  if (S.endTimer <= 0) { S.mode = 'result'; fx('result'); }
}
/* =====================================================================
   ÖĞRETİCİ — yalnızca ilk oyunda; saat ve sabır durur, tek hedef aydınlık
   ===================================================================== */
let tutorialSeen = false;
/* Aşamalar: 0 teyze içecek · 1 fırına tavuk · 2 çocuk içecek · 3 adama but · 4 joker · 5 kapanış kartı · 6 serbest (ilk salata) */
function newTutorial(on) {
  return { on, stage: on ? 0 : 6, jokerDone: false, cardDone: false, sal: null, seg: null, step: null };
}
/** 0–5. aşamalar boyunca ve ilk salata adımında oyun saati ve sabır durur. */
function tutFrozen() {
  const T = S.tut;
  return !!T && T.on && (T.stage < 6 || !!T.seg);
}
function tutCardOpen() {
  const T = S.tut;
  return !!T && T.on && T.stage === 5;
}
/** k. açılış misafirini (saat durduğu için) hemen oturtur, öğretici siparişini verir. */
function tutSeat(k) {
  const intro = CONFIG.game.intro[k];
  const q = S.spawnQueue.findIndex(s => s.seat === intro.seat && s.type === intro.type);
  if (q >= 0) {
    const s = S.spawnQueue.splice(q, 1)[0];
    if (!S.seats[s.seat].guest) {
      seatGuest(s.seat, s.type);
      const item = CONFIG.tutorial.script[k], g = S.seats[s.seat].guest;
      if (item) g.order = [{ item, done: false, doneAt: -9 }];
    }
  }
  const g = S.seats[intro.seat].guest;
  return g && g.id === k + 1 ? g : null;
}
function tutUpdate() {
  const T = S.tut;
  if (!T || !T.on) return;
  const X = CONFIG.text.tutorial;
  T.seg = null; T.step = null;
  for (let guard = 0; guard < 8; guard++) {
    if (T.stage === 0 || T.stage === 2) {                        // içecek: dolap → bardak → misafir
      const k = T.stage === 0 ? 0 : 2;
      if (T.stage === 2) tutSeat(1);
      const g = tutSeat(k);
      const e = g && g.roundsDone === 0 && g.status === 'waiting' ? g.order.find(o => !o.done) : null;
      if (!e) { T.stage++; continue; }
      T.seg = { kind: 'drink', seat: CONFIG.game.intro[k].seat, item: e.item };
    } else if (T.stage === 1) {                                  // fırına tavuk koy, beklemeden devam et
      tutSeat(1);
      if ((S.oven.state !== 'empty' && S.oven.state !== 'burnt') || S.plate > 0) { T.stage = 2; continue; }
      T.step = { el: V.oven, label: X.tapOven };
    } else if (T.stage === 3) {                                  // tavuk → adama but
      const g = tutSeat(1);
      const e = g && g.roundsDone === 0 && g.status === 'waiting' ? g.order.find(o => !o.done && o.item === 'drum') : null;
      if (!e) { T.stage = 4; continue; }
      T.seg = { kind: 'drum', seat: CONFIG.game.intro[1].seat, item: 'drum' };
    } else if (T.stage === 4) {                                  // joker (harcanmaz)
      if (T.jokerDone) { T.stage = 5; continue; }
      T.step = { el: V.joker, label: X.joker.replace('{brand}', CONFIG.BRAND), joker: true };
    } else if (T.stage === 5) {                                  // kapanış kartı
      if (T.cardDone) { T.stage = 6; continue; }
    } else {                                                     // ilk salata siparişi
      if (T.sal) {
        const g = S.seats[T.sal.seat].guest, e = g && g.id === T.sal.gid ? g.order[T.sal.idx] : null;
        if (!e || e.done) { T.sal = null; T.on = false; return; }
      } else {
        for (let i = 0; i < S.seats.length && !T.sal; i++) {
          const g = S.seats[i].guest;
          if (!g || g.status !== 'waiting') continue;
          const idx = g.order.findIndex(o => !o.done && o.item === 'salad');
          if (idx >= 0) T.sal = { seat: i, gid: g.id, idx };
        }
        if (!T.sal) return;
      }
      T.seg = { kind: 'salad', seat: T.sal.seat, item: 'salad' };
    }
    break;
  }
  if (T.seg) T.step = tutStep();
}
/** O anda dokunulması gereken tek hedef ve etiketi (durumdan türetilir). */
function tutStep() {
  const seg = S.tut.seg, X = CONFIG.text.tutorial, g = S.seats[seg.seat].guest;
  const give = { el: V.seats[seg.seat].root, label: X.giveTo[g.type] };
  const sel = selectedItem();
  if (sel === seg.item) return give;
  const clear = () => freeTraySlot() < 0 ? (sel ? { el: V.trash, label: X.toTrash } : { el: V.traySlots[0], label: X.pickAny }) : null;
  if (seg.kind === 'drum') {
    if (S.plate > 0) return sel ? { el: V.plate, label: X.pickDrum } : give;   // otomatik servis tabaktan
    if (S.oven.state === 'ready') return { el: V.oven, label: X.takeChicken };
    if (S.oven.state === 'cooking') return { el: V.oven, label: X.cooking, wait: true };
    return { el: V.oven, label: X.tapOven };
  }
  const k = S.tray.indexOf(seg.item);
  if (seg.kind === 'salad') {
    if (k >= 0) return sel ? { el: V.traySlots[k], label: X.pickSalad } : give; // otomatik servis tepsiden
    return clear() || { el: V.board, label: X.tapBoard.replace('{n}', CONFIG.salad.taps - S.salad.stage) };
  }
  if (k >= 0) return { el: V.traySlots[k], label: X.pickCup };
  return clear() || { el: V.bottles[seg.item], label: X.tapDrink[seg.item] };
}

function startGame() {
  S = newState('play');
  S.tut = newTutorial(!tutorialSeen);
  tutorialSeen = true;
  guestSeq = 0;
  resetViews();
  lastTime = performance.now();
}

function resetViews() {
  V.seats.forEach(v => { v.id = undefined; v.tkWrap.innerHTML = ''; v.gSlot.innerHTML = ''; v.ticket = null; });
  V.ovenState = V.plateSig = V.boardSig = V.jokerState = V.lastClock = V.lastScore = V.phaseCls = V.heartsSig = V.trashUrge = V.clockLate = V.clockPulse = V.jokerCharge = V.holdVis = V.cardVis = null;
  drag = null;
  V.traySigs = new Array(CONFIG.tray.slots).fill(null);
  V.cd = 0;
  V.countdown.classList.remove('show');
  Array.from(V.fx.children).forEach(c => c.remove());
  V.tutSpot.style.display = V.tutLabel.style.display = 'none';
  V.tutVis = false; V.tutText = V.tutSize = null;
  fwStop();
  V.endMsg.classList.remove('show');
  V.game.classList.remove('ending');
}

function buildGuestView(v, g, i) {
  const cfg = CONFIG.guests[g.type];
  v.tkWrap.innerHTML = `<div class="ticket" style="--r:${tiltFor(g.id * 7 + i)}deg"><div class="titems"></div><div class="pbar"><div class="pfill"></div></div></div>`;
  v.gSlot.innerHTML = `<div class="g-crop"><div class="guest arrive"><span class="gface">${asset(cfg.asset)}</span></div></div><div class="hbubble"><span>${CONFIG.text.hungry}</span></div><div class="bubble"></div>`;
  v.hb = v.gSlot.querySelector('.hbubble');
  v.ticket = v.tkWrap.firstElementChild;
  v.items = v.ticket.querySelector('.titems');
  v.fill = v.ticket.querySelector('.pfill');
  v.guestEl = v.gSlot.querySelector('.guest');
  v.bubble = v.gSlot.querySelector('.bubble');
  v.itemsSig = v.fillCls = v.statusKey = v.sad = v.urgent = null;
}

function renderSeat(i) {
  const v = V.seats[i], g = S.seats[i].guest;
  const gid = g ? g.id : null;
  if (gid !== v.id) {
    v.id = gid;
    if (!g) { v.tkWrap.innerHTML = ''; v.gSlot.innerHTML = ''; v.ticket = null; return; }
    buildGuestView(v, g, i);
  }
  if (!g) return;
  const isig = g.order.map(o => o.item + (o.done ? '1' : '0')).join(',');
  if (isig !== v.itemsSig) {
    v.itemsSig = isig;
    v.items.innerHTML = g.order.map(o =>
      `<span class="titem${o.done ? ' done' : ''}${o.done && S.t - o.doneAt < 0.35 ? ' pop' : ''}">${asset(o.item)}${o.done ? asset('check') : ''}</span>`
    ).join('');
  }
  const ratio = g.status === 'waiting' ? clamp01(g.patience / g.patienceMax)
              : (g.status === 'leaving' && g.leaveReason === 'angry') ? 0 : 1;
  v.fill.style.transform = `scaleX(${ratio.toFixed(3)})`;
  const th = CONFIG.thresholds;
  const band = ratio > th.green ? 'g' : ratio > th.yellow ? 'y' : 'r';
  const fcls = g.status === 'waiting' ? band : 'g';
  if (fcls !== v.fillCls) { v.fillCls = fcls; v.fill.className = 'pfill ' + fcls; }
  const sad = (g.status === 'waiting' && band === 'r') || (g.status === 'leaving' && g.leaveReason === 'angry');
  if (sad !== v.sad) { v.sad = sad; v.guestEl.classList.toggle('sad', sad); }
  const urgent = g.status === 'waiting' && band === 'r';
  if (urgent !== v.urgent) { v.urgent = urgent; v.ticket.classList.toggle('urgent', urgent); v.hb.classList.toggle('show', urgent); }
  const sk = g.status + (g.leaveReason || '') + (g.smile > 0 ? 's' : '');
  if (sk !== v.statusKey) {
    v.statusKey = sk;
    v.ticket.classList.toggle('eating', g.status === 'eating');
    v.ticket.classList.toggle('gone', g.status === 'leaving');
    v.guestEl.classList.toggle('smile', g.smile > 0 || g.status === 'eating');
    if (g.status === 'leaving') {
      v.guestEl.classList.remove('arrive');
      v.guestEl.classList.add('leave');
      const angry = g.leaveReason === 'angry';
      v.bubble.textContent = angry ? CONFIG.text.angry : CONFIG.text.full;
      v.bubble.className = 'bubble show' + (angry ? ' angry' : '');
    }
  }
}

function renderState() {
  const G = V.game;
  const pc = 'phase-' + S.phase;
  if (pc !== V.phaseCls) { G.classList.remove('phase-0', 'phase-1', 'phase-2'); G.classList.add(pc); V.phaseCls = pc; }
  G.classList.toggle('armed', S.joker.armed && S.mode === 'play');

  const ct = clockText(S.t);
  if (ct !== V.lastClock) { V.lastClock = ct; V.clock.textContent = ct; }
  const late = S.t >= CONFIG.game.phaseStarts[2];
  if (late !== V.clockLate) { V.clockLate = late; V.clock.classList.toggle('late', late); }
  const cpulse = S.mode === 'play' && S.t < CONFIG.game.duration && CONFIG.game.duration - S.t <= CONFIG.game.countdownFrom;
  if (cpulse !== V.clockPulse) { V.clockPulse = cpulse; V.clock.classList.toggle('pulse', cpulse); }
  if (S.score !== V.lastScore) { V.lastScore = S.score; V.score.textContent = S.score; }
  if (S.hearts !== V.heartsSig) { V.heartsSig = S.hearts; V.heartEls.forEach((h, k) => h.classList.toggle('lost', k >= S.hearts)); }

  for (let i = 0; i < V.seats.length; i++) renderSeat(i);

  // fırın
  const o = S.oven;
  if (o.state !== V.ovenState) {
    V.ovenState = o.state;
    V.oven.classList.remove('empty', 'cooking', 'ready', 'burnt');
    V.oven.classList.add(o.state);
    V.ovenFood.innerHTML = o.state === 'empty' ? `<span class="oven-empty">${asset('chickenGhost')}<b class="plus">+</b></span>` :
      asset({ cooking: 'chickenCooking', ready: 'chickenReady', burnt: 'chickenBurnt' }[o.state]);
    V.chickenEl = V.ovenFood.firstElementChild;
  }
  if (o.state === 'cooking') {
    const p = clamp01(1 - o.timer / CONFIG.oven.cookTime);
    V.ring.style.setProperty('--p', p.toFixed(3));
    V.ring.style.setProperty('--rc', '#ffb300');
    const roast = V.chickenEl && V.chickenEl.querySelector('.roast');
    if (roast) roast.style.opacity = p.toFixed(3);
  } else if (o.state === 'ready') {
    V.ring.style.setProperty('--p', clamp01(o.timer / o.readyTotal).toFixed(3));
    V.ring.style.setProperty('--rc', o.timer <= CONFIG.oven.warnBefore ? '#e2332b' : '#4caf50');
  }

  // tabak
  const plateSel = isSelected('plate');
  const psig = S.plate + (plateSel ? 's' : '');
  if (psig !== V.plateSig) {
    V.plateSig = psig;
    V.plateSlots.forEach((el, k) => {
      el.innerHTML = k < S.plate ? `<span class="pick${plateSel && k === S.plate - 1 ? ' sel' : ''}">${asset('drum')}</span>` : `<span class="ghost">${asset('drum')}</span>`;
    });
    V.plateBadge.textContent = S.plate + '/' + CONFIG.oven.drumsPerChicken;
  }

  // salata tahtası
  if (S.salad.stage !== V.boardSig) {
    V.boardSig = S.salad.stage;
    const k = SALAD_STAGE_ASSET[S.salad.stage];
    V.boardFood.innerHTML = k ? asset(k) : `<span class="ghost">${asset('saladStage1')}</span>`;
    V.progSegs.forEach((s, j) => s.classList.toggle('on', j < S.salad.stage));
    V.saladBadge.textContent = S.salad.stage + '/' + CONFIG.salad.taps;
    V.saladBadge.classList.toggle('hide', S.salad.stage === 0);
    if (S.salad.stage > 0) bump(V.saladBadge, 1.3);
  }

  // tepsi
  for (let i = 0; i < V.traySlots.length; i++) {
    const it = S.tray[i], sel = isSelected('tray', i);
    const sig = (it || '-') + (sel ? 's' : '');
    if (sig !== V.traySigs[i]) {
      V.traySigs[i] = sig;
      V.traySlots[i].innerHTML = it ? `<span class="pick${sel ? ' sel' : ''}">${asset(it)}</span>` : '';
    }
  }

  // çöp: sadece gerektiğinde dikkat çeker
  const urge = S.mode === 'play' && ((S.oven.state === 'ready' && S.plate > 0) || S.tray.every(Boolean));
  if (urge !== V.trashUrge) { V.trashUrge = urge; V.trash.classList.toggle('urge', urge); }

  // joker
  const js = S.joker.armed ? 'armed' : S.joker.charge >= 1 ? 'ready' : 'charging';
  if (js !== V.jokerState) { V.jokerState = js; V.joker.className = js; }
  const jc = S.joker.charge.toFixed(3);
  if (jc !== V.jokerCharge) { V.jokerCharge = jc; V.joker.style.setProperty('--jc', jc); }

  // ilk kalp kaybı duraklaması ve öğretici kapanış kartı
  const hold = S.mode === 'play' && S.hold > 0;
  if (hold !== V.holdVis) {
    V.holdVis = hold;
    if (hold) { const p = S.holdText.split('♥'); V.holdMsg.textContent = p[0]; if (p.length > 1) { const b = document.createElement('b'); b.textContent = '♥' + p[1]; V.holdMsg.appendChild(b); } }
    V.holdMsg.classList.toggle('show', hold);
    G.classList.toggle('holding', hold);
  }
  const card = S.mode === 'play' && tutCardOpen();
  if (card !== V.cardVis) { V.cardVis = card; V.tutCard.classList.toggle('show', card); }

  // geri sayım
  const rem = CONFIG.game.duration - S.t;
  const n = (S.mode === 'play' && rem <= CONFIG.game.countdownFrom && rem > 0) ? Math.ceil(rem) : 0;
  if (n !== V.cd) {
    V.cd = n;
    if (n > 0) {
      V.countdown.textContent = n;
      V.countdown.classList.add('show');
      V.countdown.animate([{ transform: 'scale(1.7)', opacity: 0 }, { transform: 'scale(1)', opacity: 0.88 }], { duration: 260, easing: 'ease-out' });
      Sound.play('tick');
    } else V.countdown.classList.remove('show');
  }

  // ekranlar
  V.start.classList.toggle('show', S.mode === 'start');
  V.result.classList.toggle('show', S.mode === 'result');
  V.pause.classList.toggle('show', S.mode === 'play' && S.paused);
}

/* ---------- öğretici spot ışığı ---------- */
function renderTutorial() {
  const T = S.tut;
  const st = S.mode === 'play' && !S.paused && !(S.hold > 0) && T && T.on ? T.step : null;
  const sp = V.tutSpot, lb = V.tutLabel;
  if (!st || !st.el) {
    if (V.tutVis) { sp.style.display = lb.style.display = 'none'; V.tutVis = false; V.tutText = null; }
    return;
  }
  if (!V.tutVis) { sp.style.display = lb.style.display = 'block'; V.tutVis = true; }
  const gr = V.game.getBoundingClientRect(), r = st.el.getBoundingClientRect(), pad = 6;
  const x = r.left - gr.left - pad, y = r.top - gr.top - pad, w = r.width + pad * 2, h = r.height + pad * 2;
  const size = Math.round(w) + 'x' + Math.round(h);
  if (size !== V.tutSize) { V.tutSize = size; sp.style.width = Math.round(w) + 'px'; sp.style.height = Math.round(h) + 'px'; }
  sp.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;
  sp.classList.toggle('wait', !!st.wait);
  const inner = lb.firstElementChild;
  if (st.label !== V.tutText) {
    V.tutText = st.label;
    inner.textContent = st.label;
    inner.animate([{ transform: 'scale(.6)', opacity: 0 }, { transform: 'scale(1.08)', opacity: 1, offset: .7 }, { transform: 'scale(1)' }], { duration: 260, easing: 'ease-out' });
  }
  const lw = lb.offsetWidth, lh = lb.offsetHeight, gw = V.game.clientWidth, gh = V.game.clientHeight;
  const lx = Math.max(8, Math.min(gw - lw - 8, x + w / 2 - lw / 2));
  const above = y + h / 2 > gh * 0.5;
  const ly = Math.max(6, Math.min(gh - lh - 6, above ? y - lh - 14 : y + h + 14));
  lb.style.transform = `translate(${lx.toFixed(1)}px,${ly.toFixed(1)}px)`;
}

function renderExtras(now, dt) {
  renderTutorial();

  if ((S.mode === 'play' && !S.paused) || S.mode === 'start') {
    if (now >= V.nextFw) {
      windowFirework();
      const k = S.phase === 2 ? 0.45 : 1;
      V.nextFw = now + rand(CONFIG.fx.windowFwMinMs, CONFIG.fx.windowFwMaxMs) * k;
    }
  }
  fwStep(dt);
  if (DEBUG) renderDebug();
}

function renderDebug() {
  const L = [
    `t=${S.t.toFixed(1)} ${CONFIG.game.phaseNames[S.phase]} ${clockText(S.t)} mod=${S.mode}${S.paused ? ' (DURAK)' : ''}${EASY ? ' EASY' : ''}`,

/* =====================================================================
   EFEKTLER — state olaylarını ses + animasyona çevirir
   ===================================================================== */
const LATE_FX = { bottle: 1, saladDone: 1, ovenToPlate: 1 };   // yeni DOM gerektirenler

function flushFx() {
  if (!S.events.length) return;
  const evs = S.events.splice(0);
  const late = [];
  for (const e of evs) { if (LATE_FX[e.type]) late.push(e); else handleFx(e); }
  if (late.length) { renderState(); late.forEach(handleFx); }
}

function gameRect() { return V.game.getBoundingClientRect(); }
function ticketOf(i) { const v = V.seats[i]; return (v && v.ticket) || (v && v.root); }
function anchorEl(a) {
  if (a && typeof a === 'object' && 'seat' in a) return ticketOf(a.seat);
  return { oven: V.oven, plate: V.plate, trash: V.trash, tray: V.tray, board: V.board, joker: V.joker }[a] || null;
}
function sourceEl(from) {
  return from.src === 'plate' ? V.plateSlots[from.idx] : V.traySlots[from.idx];
}
function shake(el, mag, dur) {
  if (!el) return;
  mag = mag || 6; dur = dur || 220;
  const n = Math.max(4, Math.round(dur / 45)), kf = [];
  for (let k = 0; k <= n; k++) {
    const d = k === 0 || k === n ? 0 : (k % 2 ? 1 : -1) * mag * (1 - k / n);
    kf.push({ transform: `translateX(${d.toFixed(1)}px)` });
  }
  el.animate(kf, { duration: dur, easing: 'linear' });
}
function bump(el, s) {
  if (!el) return;
  s = s || 1.15;
  el.animate([{ transform: 'scale(1)' }, { transform: `scale(${s})` }, { transform: 'scale(1)' }], { duration: 180, easing: 'ease-out' });
}
function pulseClass(el, cls, ms) {
  if (!el) return;
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
  clearTimeout(el._pt);
  el._pt = setTimeout(() => el.classList.remove(cls), ms);
}
function centerOf(el, gr) {
  const r = el.getBoundingClientRect();
  return { x: r.left - gr.left + r.width / 2, y: r.top - gr.top + r.height / 2, h: r.height };
}
function flyClone(srcEl, dstEl, html, opt) {
  if (!srcEl || !dstEl) return;
  opt = opt || {};
  const gr = gameRect(), a = centerOf(srcEl, gr), b = centerOf(dstEl, gr);
  const d = document.createElement('div');
  d.className = 'fly';
  d.innerHTML = html;
  d.style.fontSize = (parseFloat(getComputedStyle(srcEl).fontSize) || 28) + 'px';
  d.style.left = a.x + 'px';
  d.style.top = a.y + 'px';
  V.fx.appendChild(d);
  const dx = b.x - a.x, dy = b.y - a.y, end = opt.endScale || 0.6;
  const anim = d.animate([
    { transform: 'translate(-50%,-50%) translate(0px,0px) scale(1.1)', opacity: 1 },
    { transform: `translate(-50%,-50%) translate(${dx / 2}px,${dy / 2 - 34}px) scale(1.05)`, opacity: 1 },
    { transform: `translate(-50%,-50%) translate(${dx}px,${dy}px) scale(${end})`, opacity: opt.fade ? 0 : 1 },
  ], { duration: opt.dur || CONFIG.fx.flyMs, easing: 'cubic-bezier(.3,.6,.4,1)' });
  anim.onfinish = () => d.remove();
}
function dropInto(slotEl, fromEl) {
  const t = slotEl && slotEl.firstElementChild;
  if (!t || !fromEl) return;
  const a = fromEl.getBoundingClientRect(), b = t.getBoundingClientRect();
  const dx = (a.left + a.width / 2) - (b.left + b.width / 2);
  const dy = (a.top + a.height / 2) - (b.top + b.height / 2);
  t.animate([
    { transform: `translate(${dx}px,${dy}px) scale(.7)` },
    { transform: `translate(${dx * 0.45}px,${dy * 0.45 - 40}px) scale(1.05)`, offset: 0.55 },
    { transform: 'translate(0px,0px) scale(1)', offset: 0.84 },
    { transform: 'translate(0px,-6px) scale(1)', offset: 0.92 },
    { transform: 'translate(0px,0px) scale(1)' },
  ], { duration: 320, easing: 'ease-out' });
}
function crumbs(el, colors, count) {
  if (!el) return;
  colors = colors || ['#d8342a', '#7cb342', '#f6ecd4', '#caa77a'];
  const gr = gameRect(), c = centerOf(el, gr);
  for (let k = 0; k < (count || 9); k++) {
    const p = document.createElement('i');
    p.className = 'crumb';
    p.style.left = (c.x - 3) + 'px';
    p.style.top = (c.y - 3) + 'px';
    p.style.background = pick(colors);
    V.fx.appendChild(p);
    const a = rand(0, Math.PI * 2), d = rand(18, 44);
    p.animate([
      { transform: 'translate(0px,0px) rotate(0deg)', opacity: 1 },
      { transform: `translate(${(Math.cos(a) * d).toFixed(1)}px,${(Math.sin(a) * d + 14).toFixed(1)}px) rotate(${randInt(-220, 220)}deg)`, opacity: 0 },
    ], { duration: rand(380, 560), easing: 'cubic-bezier(.2,.7,.4,1)' }).onfinish = () => p.remove();
  }
}
function floatText(text, el, neg, big) {
  if (!el) return;
  const gr = gameRect(), c = centerOf(el, gr);
  const d = document.createElement('div');
  d.className = 'float' + (neg ? ' neg' : '') + (big ? ' big' : '');

  d.style.left = c.x + 'px';

  V.fx.appendChild(d);
  d.animate([
    { transform: 'translate(-50%,-50%) scale(.6)', opacity: 0 },
    { transform: 'translate(-50%,-80%) scale(1.15)', opacity: 1, offset: 0.2 },
    { transform: 'translate(-50%,-260%) scale(1)', opacity: 0 },

}
function celebrate(el) {

  el.animate([
    { transform: 'scale(1) rotate(0deg)' }, { transform: 'scale(1.18) rotate(-4deg)' },
    { transform: 'scale(.95) rotate(2deg)' }, { transform: 'scale(1) rotate(0deg)' },

  d.animate([

function scooter() {
  const gr = gameRect(), rr = V.room.getBoundingClientRect();

  d.className = 'scooter';
  d.innerHTML = `<span class="speed"></span>${asset('scooter')}`;

  d.animate([{ transform: 'translateX(-130px)' }, { transform: `translateX(${gr.width + 30}px)` }],
            { duration: CONFIG.joker.scooterMs, easing: 'cubic-bezier(.45,0,.55,1)' }).onfinish = () => d.remove();
}
function windowFirework() {
  const w = V.win.clientWidth, h = V.win.clientHeight;
  if (!w || !h) return;
  const x = rand(0.1, 0.9) * w, y = rand(0.12, 0.45) * h;
  const col = pick(['#ffd54a', '#ff6b6b', '#7ee8fa', '#b388ff', '#9cff8a', '#ffffff']);
  const n = 10, dist = rand(10, 20);
  for (let k = 0; k < n; k++) {
    const p = document.createElement('i');
    p.className = 'fwp';
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    p.style.background = col;
    V.fwLayer.appendChild(p);
    const a = k / n * Math.PI * 2;
    p.animate([
      { transform: 'translate(0px,0px) scale(1)', opacity: 1 },

    ], { duration: 900, easing: 'cubic-bezier(.1,.7,.3,1)' }).onfinish = () => p.remove();

function toast(text) {
  V.toast.textContent = text;

  clearTimeout(V.toastT);
