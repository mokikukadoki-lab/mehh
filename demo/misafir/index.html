}

/* ---------- final havai fişekleri (canvas) ---------- */
const FW = { on: false, big: false, parts: [], next: 0, ctx: null, w: 0, h: 0, lastBoom: 0 };
function fwStart(big) {
  const c = V.canvas, dpr = Math.min(2, window.devicePixelRatio || 1);
  FW.w = V.game.clientWidth; FW.h = V.game.clientHeight;
  c.width = Math.round(FW.w * dpr); c.height = Math.round(FW.h * dpr);
  FW.ctx = c.getContext('2d');
  FW.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  FW.on = true; FW.big = big; FW.parts = []; FW.next = 0;
  c.classList.add('show');
}
function fwStop() {
  FW.on = false; FW.parts = [];
  if (V.canvas) V.canvas.classList.remove('show');
  if (FW.ctx) FW.ctx.clearRect(0, 0, FW.w, FW.h);
}
function fwBurst() {
  const x = rand(0.12, 0.88) * FW.w, y = rand(0.08, 0.5) * FW.h;
  const hue = randInt(0, 360), n = FW.big ? 70 : 46, sp = FW.big ? rand(170, 270) : rand(120, 200);
  for (let k = 0; k < n; k++) {
    const a = k / n * Math.PI * 2 + rand(-0.05, 0.05), s = sp * rand(0.55, 1);
    FW.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.8, 1.3), max: 1.3,
                    r: rand(1.5, 3.2), c: `hsl(${(hue + randInt(-25, 25) + 360) % 360},100%,${randInt(55, 72)}%)` });
  }
  if (FW.parts.length > 900) FW.parts.splice(0, FW.parts.length - 900);
  const now = performance.now();
  if (now - FW.lastBoom > 260) { FW.lastBoom = now; Sound.play('patlama'); }
}
function fwStep(dt) {
  if (!FW.on) return;
  FW.next -= dt;
  if (FW.next <= 0) { fwBurst(); FW.next = FW.big ? rand(0.08, 0.16) : rand(0.18, 0.3); }
  const ctx = FW.ctx;
  ctx.clearRect(0, 0, FW.w, FW.h);
  for (let k = FW.parts.length - 1; k >= 0; k--) {
    const p = FW.parts[k];
    p.life -= dt;
    if (p.life <= 0) { FW.parts.splice(k, 1); continue; }
    p.vx *= 0.985;
    p.vy = p.vy * 0.985 + 140 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    ctx.globalAlpha = Math.min(1, p.life / p.max * 1.5);
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function loseText() { return CONFIG.text.loseTitle.replace('{time}', S.endClock); }
function onEnd(kind) {
  V.game.classList.add('ending');
  V.countdown.classList.remove('show');
  if (kind === 'win') {
    V.endMsg.innerHTML = `<div class="em-big">${CONFIG.text.winTitle}</div>` +
      (S.perfect ? `<div class="em-sub">${CONFIG.text.perfectTitle}</div>` : '');
    fwStart(S.perfect);
  } else {
    V.endMsg.innerHTML = `<div class="em-lose">${loseText()}</div>`;
    Sound.play('lose');
  }
  V.endMsg.classList.add('show');
}
function onResult() {
  fwStop();
  V.endMsg.classList.remove('show');
  V.game.classList.remove('ending');
  const T = CONFIG.text;
  $('resTitle').textContent = S.endKind === 'win' ? T.winTitle : loseText();
  const sub = $('resSub');
  sub.textContent = S.perfect ? T.perfectTitle : '';
  sub.style.display = S.perfect ? '' : 'none';
  $('resStats').innerHTML =
    `<span>${T.statFed}</span><b>${S.stats.fed}</b>` +
    `<span>${T.statServed}</span><b>${S.stats.served}</b>` +
    `<span>${T.statTaps}</span><b>${S.stats.taps}</b>` +
    `<span>${T.statScore}</span><b>${S.score}</b>` +
    (S.stats.jokers > 0 ? `<span class="full">${T.jokerSaved.replace('{brand}', CONFIG.BRAND).replace('{n}', S.stats.jokers)}</span>` : '');
}

function handleFx(e) {
  switch (e.type) {
    case 'float':       floatText(e.text, anchorEl(e.anchor), e.neg, e.big); break;
    case 'select':      Sound.play('select'); break;
    case 'deselect':    Sound.play('deselect'); break;
    case 'nudge':       shake(anchorEl(e.target), 3, 160); break;
    case 'bottle':      Sound.play('tik'); dropInto(V.traySlots[e.slot], V.bottles[e.drink]); bump(V.bottles[e.drink], 1.08); break;
    case 'saladDone':   Sound.play('chop'); crumbs(V.boardFood); dropInto(V.traySlots[e.slot], V.boardFood); break;
    case 'trayFull':    Sound.play('bzzt'); shake(V.tray, 6, 220); break;
    case 'salad':       Sound.play('chop'); crumbs(V.boardFood); bump(V.boardFood, 1.2); break;
    case 'deliver':     Sound.play('ding'); flyClone(V.dropGhost || sourceEl(e.from), ticketOf(e.seat), asset(e.item)); break;
    case 'wrong':       Sound.play('bzzt'); shake(ticketOf(e.seat), 7, 200); break;
    case 'complete':    Sound.play('complete'); celebrate(ticketOf(e.seat)); break;
    case 'trash':       Sound.play('pof'); flyClone(V.dropGhost || sourceEl(e.from), V.trash, asset(e.item), { endScale: 0.3, fade: true }); setTimeout(() => shake(V.trash, 4, 200), 180); break;
    case 'ovenIn':      Sound.play('ovenIn'); bump(V.oven, 1.05); break;
    case 'ovenBusy':    Sound.play('soft'); shake(V.oven, 3, 180); break;
    case 'ovenReady':   Sound.play('cin'); bump(V.ovenFood, 1.25); break;
    case 'ovenWarn':    Sound.play('bipbip'); shake(V.oven, 3, 900); break;
    case 'burnt':       Sound.play('burn'); shake(V.oven, 6, 300); break;
    case 'ovenToPlate': {
      Sound.play('plate');
      const gr = gameRect(), oc = centerOf(V.ovenFood, gr);
      V.plateSlots.forEach((s, k) => {
        const el = s.querySelector('.pick');
        if (!el) return;
        const c = centerOf(el, gr);
        el.animate([{ transform: `translate(${oc.x - c.x}px,${oc.y - c.y}px) scale(.5)` }, { transform: 'translate(0px,0px) scale(1)' }],
                   { duration: 240 + k * 40, easing: 'cubic-bezier(.2,.8,.3,1.2)' });
      });
      break;
    }
    case 'plateBlocked': Sound.play('bzzt'); shake(V.oven, 6, 220); shake(V.plate, 3, 220); pulseClass(V.plateBadge, 'alert', 760); break;
    case 'clean':       Sound.play('pof'); crumbs(V.ovenFood, ['#222', '#555', '#888'], 10); break;
    case 'arrive':      Sound.play('dingdong'); break;
    case 'order':       Sound.play('paper'); bump(ticketOf(e.seat), 1.08); break;
    case 'full':        Sound.play('happy'); break;
    case 'angry':       Sound.play('angry'); shake(V.seats[e.seat].root, 5, 300); break;
    case 'heart': {
      const h = V.heartEls[e.idx];
      if (h) h.animate([{ transform: 'scale(1.9)' }, { transform: 'scale(1)' }], { duration: 420, easing: 'ease-out' });
      shake(V.hearts, 5, 300);
      Sound.play('heart');
      break;
    }
    case 'phase':       break;                    // aşama bantları kaldırıldı; saat rengi yeterli
    case 'hungry':      Sound.play('hungry'); break;
    case 'heartBand':   banner(e.text); break;
    case 'jokerUnlock': Sound.play('unlock'); bump(V.joker, 1.25); break;
    case 'jokerArm':    Sound.play('select'); break;
    case 'jokerDisarm': Sound.play('deselect'); break;
    case 'jokerDenied': Sound.play('bzzt'); shake(V.joker, 5, 200); break;
    case 'joker':       Sound.play('vroom'); scooter(); break;
    case 'end':         onEnd(e.kind); break;
    case 'result':      onResult(); break;
  }
}

/* =====================================================================
   GİRDİ
   ===================================================================== */
function toggleMute() {
  Sound.setMuted(!Sound.muted);
  V.mute.innerHTML = asset(Sound.muted ? 'soundOff' : 'soundOn');
}
function onPointerDown(e) {
  if (S.mode === 'play' && !S.paused) S.stats.taps++;
  const t = e.target.closest('[data-act]');
  if (!t || !V.game.contains(t)) return;
  if (e.cancelable) e.preventDefault();
  const act = t.dataset.act;
  switch (act) {
    case 'mute': toggleMute(); return;
    case 'start':
    case 'replay': startGame(); renderState(); return;
    case 'order': Sound.play('select'); toast(CONFIG.text.orderToast); return;
    case 'resume': S.paused = false; lastTime = performance.now(); renderState(); return;
    case 'tutStart':
      if (S.mode === 'play' && tutCardOpen()) { S.tut.cardDone = true; Sound.play('select'); lastTime = performance.now(); refreshAfterInput(); }
      return;
  }
  const draggable = act === 'tray' || act === 'plate';
  const idx = +t.dataset.idx;
  if (draggable && isSelected(act, idx)) { beginDrag(e, t, true); return; }   // seçiliyi sürükleyebilir; bırakmadan kalkarsa seçim kalkar
  const ok = doAction(t);
  if (ok && draggable && isSelected(act, idx)) beginDrag(e, t, false);
}

/** Oyun eylemi (dokunuş veya bırakma). Öğretici sırasında yalnızca hedef geçerli. */
function doAction(t) {
  if (S.mode !== 'play' || S.paused || S.hold > 0 || tutCardOpen()) return false;
  const act = t.dataset.act;
  if (tutFrozen()) {
    const st = S.tut.step;
    if (!st || st.wait || t !== st.el) return false;           // yanlış yere dokunuş yok sayılır
    if (st.joker) { S.tut.jokerDone = true; Sound.play('select'); refreshAfterInput(); return true; }  // öğreticide joker harcanmaz
  }
  switch (act) {
    case 'oven':   actOven(); break;
    case 'plate':  actPlate(); break;
    case 'salad':  actSalad(); break;
    case 'bottle': actBottle(t.dataset.drink); break;
    case 'tray':   actTray(+t.dataset.idx); break;
    case 'trash':  actTrash(); break;
    case 'guest':  actGuest(+t.dataset.seat); break;
    case 'joker':  actJoker(); break;
  }
  refreshAfterInput();
  return true;
}
function refreshAfterInput() {
  tutUpdate();
  flushFx();
  renderState();
  renderTutorial();
}

/* ---------- sürükle-bırak (tabaktaki but, tepsideki ürünler → misafir / çöp) ---------- */
let drag = null;
function beginDrag(e, t, deferred) {
  drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, t, deferred, moving: false, ghost: null, pick: null, over: null };
}
function dragPick(t) {
  if (t.dataset.act === 'plate') { const sl = V.plateSlots[S.plate - 1]; return sl ? sl.querySelector('.pick') : null; }
  return t.querySelector('.pick');
}
function dropTarget(x, y) {
  const el = document.elementFromPoint(x, y);
  const t = el && el.closest('[data-act="guest"],[data-act="trash"]');
  return t && V.game.contains(t) ? t : null;
}
function onPointerMove(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if (!drag.moving) {
    if (dx * dx + dy * dy < 64) return;
    const item = selectedItem();
    if (!item || S.mode !== 'play' || S.paused || S.hold > 0) { drag = null; return; }
    drag.moving = true;
    const src = dragPick(drag.t);
    const g = document.createElement('div');
    g.className = 'drag-ghost';
    g.innerHTML = asset(item);
    g.style.fontSize = getComputedStyle(src ? src.parentElement : drag.t).fontSize;
    V.fx.appendChild(g);
    drag.ghost = g; drag.pick = src;
    if (src) src.classList.add('dragging');
  }
  const gr = gameRect();
  drag.ghost.style.transform = `translate(${(e.clientX - gr.left).toFixed(1)}px,${(e.clientY - gr.top).toFixed(1)}px) translate(-50%,-60%) scale(1.15)`;
  const over = dropTarget(e.clientX, e.clientY);
  if (over !== drag.over) {
    if (drag.over) drag.over.classList.remove('drop-over');
    drag.over = over;
    if (over) over.classList.add('drop-over');
  }
}
function onPointerUp(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag;
  drag = null;
  if (d.over) d.over.classList.remove('drop-over');
  if (!d.moving) { if (d.deferred && e.type === 'pointerup') doAction(d.t); return; }
  const target = e.type === 'pointerup' ? dropTarget(e.clientX, e.clientY) : null;
  let ok = false;
  if (target) {
    const sig = () => S.stats.served + '|' + S.tray.join(',') + '|' + S.plate;
    const before = sig();
    V.dropGhost = d.ghost;
    doAction(target);
    V.dropGhost = null;
    ok = sig() !== before;
  }
  if (d.pick) d.pick.classList.remove('dragging');
  if (ok) { d.ghost.remove(); return; }
  const src = d.pick || d.t, gr = gameRect(), r = src.getBoundingClientRect();      // başarısız: yerine döner
  const to = `translate(${(r.left - gr.left + r.width / 2).toFixed(1)}px,${(r.top - gr.top + r.height / 2).toFixed(1)}px) translate(-50%,-50%) scale(1)`;
  d.ghost.animate([{ transform: d.ghost.style.transform }, { transform: to }], { duration: 180, easing: 'ease-out' }).onfinish = () => d.ghost.remove();
}

/* =====================================================================
   DÖNGÜ
   ===================================================================== */
let lastTime = performance.now();
function frame(now) {
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (!(dt > 0)) dt = 0;
  if (dt > 0.1) dt = 0.1;
  update(dt);
  updateEnding(dt);
  flushFx();
  renderState();
  renderExtras(now, dt);
  requestAnimationFrame(frame);
}

/* ---------- masaüstü düzeni + QR ---------- */
function applyLayout() {
  const on = window.innerWidth > CONFIG.desktop.minWidth && window.matchMedia('(pointer: fine)').matches;
  document.body.classList.toggle('desktop', on);
  if (on && !V.qrDone) { V.qrDone = true; $('sdQr').innerHTML = qrSvg(location.href); }
}

/** Kısa QR üretici: bayt modu, hata düzeltme M, sürüm 1–20 (≈660 bayta kadar). */
function makeQR(text) {
  const ECC = [10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26];
  const BLK = [1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16];
  const data = Array.from(new TextEncoder().encode(text));
  const rawMods = v => { let r = (16 * v + 128) * v + 64; if (v >= 2) { const n = Math.floor(v / 7) + 2; r -= (25 * n - 10) * n - 55; if (v >= 7) r -= 36; } return r; };
  const dataCap = v => Math.floor(rawMods(v) / 8) - ECC[v - 1] * BLK[v - 1];
  let ver = 0;
  for (let v = 1; v <= 20 && !ver; v++) if (4 + (v < 10 ? 8 : 16) + data.length * 8 <= dataCap(v) * 8) ver = v;
  if (!ver) return null;
  // veri bitleri
  const bits = [], put = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
  put(4, 4); put(data.length, ver < 10 ? 8 : 16); data.forEach(b => put(b, 8));
  const cap = dataCap(ver) * 8;
  put(0, Math.min(4, cap - bits.length));
  put(0, (8 - bits.length % 8) % 8);
  for (let p = 0xEC; bits.length < cap; p ^= 0xEC ^ 0x11) put(p, 8);
  const cw = [];
  for (let i = 0; i < bits.length; i += 8) { let b = 0; for (let j = 0; j < 8; j++) b = (b << 1) | bits[i + j]; cw.push(b); }
  // Reed-Solomon
  const mul = (x, y) => { let z = 0; for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; } return z; };
  const eLen = ECC[ver - 1], nb = BLK[ver - 1], div = new Array(eLen).fill(0);
  div[eLen - 1] = 1;
  for (let i = 0, root = 1; i < eLen; i++) { for (let j = 0; j < eLen; j++) { div[j] = mul(div[j], root); if (j + 1 < eLen) div[j] ^= div[j + 1]; } root = mul(root, 2); }
  const rsRem = d => { const r = new Array(eLen).fill(0); for (const b of d) { const f = b ^ r.shift(); r.push(0); for (let i = 0; i < eLen; i++) r[i] ^= mul(div[i], f); } return r; };
  const raw = Math.floor(rawMods(ver) / 8), nShort = nb - raw % nb, shortLen = Math.floor(raw / nb), blocks = [];
  for (let i = 0, k = 0; i < nb; i++) {
    const d = cw.slice(k, k + shortLen - eLen + (i < nShort ? 0 : 1));
    k += d.length;
    const e = rsRem(d);
    if (i < nShort) d.push(0);
    blocks.push(d.concat(e));
  }
  const all = [];
  for (let i = 0; i < blocks[0].length; i++) blocks.forEach((b, j) => { if (i !== shortLen - eLen || j >= nShort) all.push(b[i]); });
  // matris
  const size = ver * 4 + 17;
  const M = Array.from({ length: size }, () => new Array(size).fill(false));
  const F = Array.from({ length: size }, () => new Array(size).fill(false));
  const set = (x, y, d) => { M[y][x] = d; F[y][x] = true; };
  for (let i = 0; i < size; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
  const finder = (cx, cy) => {
    for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
      const x = cx + dx, y = cy + dy;
      if (x >= 0 && y >= 0 && x < size && y < size) { const d = Math.max(Math.abs(dx), Math.abs(dy)); set(x, y, d !== 2 && d !== 4); }
    }
  };
  finder(3, 3); finder(size - 4, 3); finder(3, size - 4);
  if (ver > 1) {
    const n = Math.floor(ver / 7) + 2, step = Math.ceil((ver * 4 + 4) / (n * 2 - 2)) * 2, pos = [6];
    for (let p = size - 7; pos.length < n; p -= step) pos.splice(1, 0, p);
    pos.forEach((a, i) => pos.forEach((b, j) => {
      if ((i === 0 && j === 0) || (i === 0 && j === n - 1) || (i === n - 1 && j === 0)) return;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) set(a + dx, b + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }));
  }
  const format = mask => {
    let r = mask;                                   // M seviyesi = 00
    for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537);
    const b = ((mask << 10) | r) ^ 0x5412, bit = i => ((b >>> i) & 1) === 1;
    for (let i = 0; i <= 5; i++) set(8, i, bit(i));
    set(8, 7, bit(6)); set(8, 8, bit(7)); set(7, 8, bit(8));
    for (let i = 9; i < 15; i++) set(14 - i, 8, bit(i));
    for (let i = 0; i < 8; i++) set(size - 1 - i, 8, bit(i));
    for (let i = 8; i < 15; i++) set(8, size - 15 + i, bit(i));
    set(8, size - 8, true);
  };
  format(0);
  if (ver >= 7) {
    let r = ver;
    for (let i = 0; i < 12; i++) r = (r << 1) ^ ((r >>> 11) * 0x1F25);
    const b = (ver << 12) | r;
    for (let i = 0; i < 18; i++) { const d = ((b >>> i) & 1) === 1, a = size - 11 + i % 3, c = Math.floor(i / 3); set(a, c, d); set(c, a, d); }
  }
  let k = 0;
  for (let right = size - 1; right >= 1; right -= 2) {
    if (right === 6) right = 5;
    for (let v = 0; v < size; v++) for (let j = 0; j < 2; j++) {
      const x = right - j, y = ((right + 1) & 2) === 0 ? size - 1 - v : v;
      if (!F[y][x] && k < all.length * 8) { M[y][x] = ((all[k >>> 3] >>> (7 - (k & 7))) & 1) === 1; k++; }
    }
  }
  // maske seçimi
  const MASKS = [
    (x, y) => (x + y) % 2 === 0, (x, y) => y % 2 === 0, (x, y) => x % 3 === 0, (x, y) => (x + y) % 3 === 0,
    (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0, (x, y) => x * y % 2 + x * y % 3 === 0,
    (x, y) => (x * y % 2 + x * y % 3) % 2 === 0, (x, y) => ((x + y) % 2 + x * y % 3) % 2 === 0,
  ];
  const applyMask = m => { for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (!F[y][x] && MASKS[m](x, y)) M[y][x] = !M[y][x]; };
  const penalty = () => {
    let p = 0, dark = 0;
    for (let a = 0; a < size; a++) {
      let row = '', col = '';
      for (let b = 0; b < size; b++) { row += M[a][b] ? 1 : 0; col += M[b][a] ? 1 : 0; if (M[a][b]) dark++; }
      for (const l of [row, col]) {
        (l.match(/0{5,}|1{5,}/g) || []).forEach(run => { p += run.length - 2; });
        p += 40 * (l.match(/(?=10111010000|00001011101)/g) || []).length;
      }
    }
    for (let y = 0; y < size - 1; y++) for (let x = 0; x < size - 1; x++) {
      const c = M[y][x];
      if (c === M[y][x + 1] && c === M[y + 1][x] && c === M[y + 1][x + 1]) p += 3;
    }
    return p + 10 * Math.floor(Math.abs(dark * 20 - size * size * 10) / (size * size));
  };
  let best = 0, bestP = Infinity;
  for (let m = 0; m < 8; m++) { applyMask(m); format(m); const p = penalty(); if (p < bestP) { bestP = p; best = m; } applyMask(m); }
  applyMask(best); format(best);
  return M;
}
function qrSvg(text) {
  const M = makeQR(text);
  if (!M) return '';
  const n = M.length, q = 4;
  let d = '';
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (M[y][x]) d += `M${x + q} ${y + q}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n + 2 * q} ${n + 2 * q}" shape-rendering="crispEdges" role="img" aria-label="QR"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#1b1410"/></svg>`;
}

function setUnit() {
  const h = V.game.clientHeight || window.innerHeight;
  document.documentElement.style.setProperty('--u', (h / 100).toFixed(2) + 'px');
}

function init() {
  buildDom();
  S = newState('start');
  resetViews();
  applyLayout();
  setUnit();
  window.addEventListener('resize', () => { applyLayout(); setUnit(); });
  V.game.addEventListener('pointerdown', onPointerDown, { passive: false });
  document.addEventListener('pointermove', onPointerMove, { passive: true });
  document.addEventListener('pointerup', onPointerUp, { passive: true });
  document.addEventListener('pointercancel', onPointerUp, { passive: true });
  V.game.addEventListener('touchmove', e => { if (e.cancelable) e.preventDefault(); }, { passive: false });
  document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
  document.addEventListener('gesturestart', e => e.preventDefault(), { passive: false });
  document.addEventListener('contextmenu', e => e.preventDefault());
  const unlock = () => Sound.unlock();
  ['touchend', 'pointerup', 'click', 'keydown'].forEach(t => document.addEventListener(t, unlock, { passive: true, capture: true }));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (S.mode === 'play') S.paused = true;
      if (Sound.ctx && Sound.ctx.state === 'running') Sound.ctx.suspend();
    } else {
      lastTime = performance.now();
      Sound.resumeIfAllowed();
    }
  });
  if (DEBUG) {
    window.addEventListener('keydown', e => {
      const k = (e.key || '').toLowerCase();
      if (S.mode !== 'play') return;
      if (k === 'n') S.t += 10;
      else if (k === 'h') { loseHeart('teyze'); flushFx(); }
      else if (k === 'p') { S.paused = !S.paused; lastTime = performance.now(); }
    });
  }
  renderState();
  requestAnimationFrame(frame);
}

init();
})();
