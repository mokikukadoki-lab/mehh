<style>
:root{
  --bg:#F1E9D6; --panel:#FBF7EE; --ink:#1F2A31; --muted:#6B7A82; --gold:#E4A93A; --sea:#2E8C7A; --line:#D7CBB0; --shadow:#1F2A31;
  --font:'Pixelify Sans','Courier New',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#16262F; --panel:#1F3340; --ink:#EDE6D3; --muted:#9DB0B8; --gold:#F2C14E; --sea:#5DB39A; --line:#2F4A58; --shadow:#0B141A; }
}
:root[data-theme="dark"]{ --bg:#16262F; --panel:#1F3340; --ink:#EDE6D3; --muted:#9DB0B8; --gold:#F2C14E; --sea:#5DB39A; --line:#2F4A58; --shadow:#0B141A; }

*{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:18px; line-height:1.5; min-height:100vh; }
body::before{ content:""; position:fixed; inset:0; pointer-events:none; opacity:.35;
  background-image:linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size:24px 24px; mask-image:linear-gradient(#000 40%, transparent); -webkit-mask-image:linear-gradient(#000 40%, transparent); }
#app{ position:relative; max-width:720px; margin:0 auto; padding:16px 16px 48px; }

header{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:12px; }
#brand{ font-size:15px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-right:auto; }
#prog{ display:flex; gap:4px; }
#prog i{ display:block; width:22px; height:8px; border:2px solid var(--ink); background:transparent; }
#prog i.done{ background:var(--sea); }
#prog i.now{ background:var(--gold); }
#hud{ display:flex; flex-wrap:wrap; gap:6px; width:100%; align-items:center; }
#hud .day{ background:var(--ink); color:var(--panel); padding:2px 8px; font-size:15px; letter-spacing:.06em; text-transform:uppercase; }
#hud .phase{ color:var(--muted); font-size:15px; margin-right:auto; }
#hud .chip{ border:2px solid var(--line); padding:1px 8px; font-size:15px; background:var(--panel); }
#hud .chip.wx{ border-color:var(--sea); }
.tools{ display:flex; gap:8px; margin-left:auto; }

button{ font:inherit; color:inherit; }
.pbtn, .choice, .item{
  appearance:none; border:2px solid var(--ink); background:var(--panel); color:var(--ink); border-radius:0;
  box-shadow:3px 3px 0 var(--shadow); cursor:pointer; text-align:left; padding:10px 14px;
  transition:transform .06s, box-shadow .06s;
}
.pbtn:hover, .choice:hover:not([disabled]), .item:hover{ transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--shadow); }
.pbtn:active, .choice:active:not([disabled]), .item:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--shadow); }
.pbtn{ padding:6px 12px; font-size:15px; }
button:focus-visible, .item:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }

.stage{ border:2px solid var(--ink); box-shadow:4px 4px 0 var(--shadow); background:#000; line-height:0; }
#scene{ display:block; width:100%; aspect-ratio:16/9; image-rendering:pixelated; image-rendering:crisp-edges; }

#panel{ margin-top:18px; }
#panel.in{ animation:fadein .35s ease-out both; }
@keyframes fadein{ from{ opacity:0; transform:translateY(4px);} to{ opacity:1; transform:none;} }
h1{ font-size:44px; line-height:1.05; margin:0 0 12px; letter-spacing:-.01em; }
h2{ font-size:28px; line-height:1.15; margin:0 0 10px; }
h3{ font-size:16px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:22px 0 6px; }
p{ margin:0 0 12px; }
.lead{ color:var(--muted); font-size:15px; letter-spacing:.08em; text-transform:uppercase; margin-bottom:6px; }
.hint{ border-left:4px solid var(--gold); padding:8px 12px; background:var(--panel); margin-top:16px; }
ul.mem, ul.plain{ margin:0 0 8px; padding-left:0; list-style:none; }
ul.mem li{ padding:6px 0 6px 20px; position:relative; border-bottom:1px dashed var(--line); }
ul.mem li::before{ content:""; position:absolute; left:2px; top:14px; width:8px; height:8px; background:var(--sea); }
ul.plain li{ padding:4px 0; }
/* what people told you: the headword carries it, the speaker is an aside */
ul.tips li{ padding:5px 0 5px 0; border-bottom:1px dashed var(--line); }
ul.tips b{ color:var(--sea); font-weight:600; }
ul.tips i{ color:var(--muted); font-style:normal; font-size:0.88em; }
ul.answers li b{ color:var(--sea); }

#choices{ display:grid; gap:10px; margin-top:20px; counter-reset:c; }
.choice{ display:grid; gap:2px; width:100%; }
.choice::before{ counter-increment:c; content:counter(c); position:absolute; }
.choice{ position:relative; padding-left:44px; }
.choice::before{ left:12px; top:10px; width:22px; height:22px; border:2px solid var(--ink); font-size:14px; line-height:18px; text-align:center; background:var(--gold); color:#1F2A31; }
.choice .lbl{ font-size:19px; }
.choice .sub{ font-size:15px; color:var(--muted); }
.choice[disabled]{ opacity:.45; cursor:not-allowed; box-shadow:none; }
.choice[disabled]::before{ background:var(--line); }

.items{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin:12px 0 8px; }
.item{ display:grid; gap:2px; padding:8px 10px 8px 34px; position:relative; }
.item::before{ content:""; position:absolute; left:10px; top:12px; width:14px; height:14px; border:2px solid var(--ink); background:var(--panel); }
.item.on{ background:var(--gold); color:#1F2A31; }
.item.on::before{ background:#1F2A31; box-shadow:inset 0 0 0 3px var(--gold); }
.item .lbl{ font-size:17px; }
.item .sub{ font-size:14px; color:var(--muted); }
.item.on .sub{ color:#4A3A10; }
.item.shake{ animation:shake .3s; }
@keyframes shake{ 0%,100%{transform:none;} 25%{transform:translateX(-4px);} 75%{transform:translateX(4px);} }
/* the suitcase capacity, read before the first tap */
.packcap{ font-size:0.82rem; letter-spacing:0.09em; color:var(--muted); margin:0 0 10px; text-transform:uppercase; }
.count{ color:var(--muted); font-size:15px; letter-spacing:.06em; text-transform:uppercase; }

.stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:8px; margin:8px 0 6px; }
.stats div{ border:2px solid var(--ink); background:var(--panel); padding:10px 8px; text-align:center; box-shadow:3px 3px 0 var(--shadow); }
.stats b{ display:block; font-size:30px; line-height:1; color:var(--sea); }
.stats span{ display:block; font-size:13px; color:var(--muted); margin-top:4px; line-height:1.2; }
.score{ display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; border:2px solid var(--ink); background:var(--panel); padding:14px 16px; box-shadow:4px 4px 0 var(--shadow); }
.score b{ font-size:64px; line-height:1; color:var(--gold); }
.score span{ color:var(--muted); font-size:15px; max-width:260px; line-height:1.3; }
ul.nights{ list-style:none; padding:0; margin:0; }
ul.nights li{ display:grid; grid-template-columns:110px 1fr auto; gap:10px; align-items:center; padding:6px 0; border-bottom:1px dashed var(--line); }
ul.nights i{ font-style:normal; color:var(--sea); letter-spacing:2px; font-size:16px; }

#journal{ border:2px solid var(--ink); background:var(--panel); padding:12px 16px; margin:0 0 14px; box-shadow:4px 4px 0 var(--shadow); max-height:280px; overflow:auto; }
#journal h3:first-child{ margin-top:0; }
footer{ margin-top:36px; display:flex; justify-content:space-between; align-items:center; gap:12px; color:var(--muted); font-size:14px; flex-wrap:wrap; }
footer .kbd{ border:1px solid var(--line); padding:0 5px; font-size:13px; }

@media (max-width:480px){
  body{ font-size:17px; }
  #app{ padding:12px 12px 40px; }
  h1{ font-size:36px; }
  .stats{ grid-template-columns:repeat(2,1fr); }
  .items{ grid-template-columns:1fr; }
  ul.nights li{ grid-template-columns:90px 1fr auto; }
  .score b{ font-size:52px; }
}
@media (prefers-reduced-motion: reduce){
  #panel.in{ animation:none; }
  .item.shake{ animation:none; }
  .pbtn, .choice, .item{ transition:none; }
}

/* v3: cost/duration on buttons, wallet tempo */
.choice .meta{ display:inline-block; margin-left:8px; font-size:14px; color:var(--muted); letter-spacing:.02em; white-space:nowrap; }
.choice:disabled .meta{ color:#B4533A; }
#hud .chip.money{ border-color:var(--gold); }
.feel{ color:var(--muted); font-style:italic; margin:0 0 10px; }
#hud .chip.phone{ border-color:#B4533A; }
.item .slots{ margin-left:6px; font-size:12px; color:var(--muted); border:1px solid var(--line); padding:0 4px; }

/* ===== v3 layout: status beside the choices, no page scroll on laptops ===== */
#hud{ display:block; margin-top:12px; border:2px solid var(--ink); background:var(--panel); box-shadow:4px 4px 0 var(--shadow); padding:8px 12px; }
#hud .line{ font-size:17px; letter-spacing:.06em; text-transform:uppercase; }
#hud .chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
#hud .chip{ font-size:14px; }
.delta{ color:var(--sea); font-size:15px; margin:0 0 10px; letter-spacing:.02em; }
footer{ margin-top:16px; }
@media (min-width:900px){
  html,body{ height:100%; }
  body{ overflow:hidden; }
  #app{ max-width:1180px; height:100vh; box-sizing:border-box; display:flex; flex-direction:column; padding:12px 20px 12px; }
  header{ flex:0 0 auto; margin-bottom:8px; }
  .cols{ flex:1 1 auto; min-height:0; display:grid; grid-template-columns:minmax(360px,44%) 1fr; gap:22px; }
  .left{ position:sticky; top:0; align-self:start; }
  .right{ min-height:0; display:flex; flex-direction:column; overflow:auto; padding-right:6px; }
  #panel{ flex:0 1 auto; }
  #choices{ margin-top:14px; }
  #journal{ position:absolute; z-index:5; right:20px; top:60px; width:min(520px,60%); max-height:60vh; }
  body{ font-size:17px; }
  #panel p{ margin:0 0 10px; }
}

/* P0: readable digits, locked-only fading, back reason */
.num{ font-family: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-variant-numeric: slashed-zero tabular-nums; font-size:1.08em; font-weight:700; letter-spacing:0; }
#hud .line{ font-size:19px; }
.choice .meta .num{ font-size:1em; }
.choice:disabled{ opacity:.5; }
.choice:not(:disabled){ opacity:1; }
.pbtn.locked{ opacity:.5; }
.why{ color:var(--muted); font-size:13px; margin-left:6px; }
.recap li{ margin:2px 0; }
/* Pass 0a: the product mark on the opening screen, and the trip lengths under it */
h1.mark{ letter-spacing:.02em; }
h1.mark span{ display:block; font-size:.62em; line-height:1; color:var(--sea); letter-spacing:.12em; }
.trips{ margin-top:18px; }
.trips .lead{ margin-bottom:8px; }
.trip{ display:inline-block; border:2px solid var(--ink); background:var(--panel); padding:6px 12px; margin:0 8px 8px 0; font-size:16px; letter-spacing:.08em; }
.trip.on{ background:var(--gold); color:#1F2A31; box-shadow:3px 3px 0 var(--shadow); }
.trip.soon{ opacity:.4; border-style:dashed; box-shadow:none; }
.trip i{ display:block; font-style:normal; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
/* Pass 0a: the overflow button under a hub's 4-6 contextual options */
.choice[data-more]{ background:transparent; box-shadow:none; border-style:dashed; }
.choice[data-more]::before{ background:var(--panel); }
.choice[data-more] .lbl{ font-size:17px; color:var(--muted); }
details{ margin-top:14px; color:var(--muted); }
details summary{ cursor:pointer; }
/* the day recap: closed by default, and the summary line reads like a tap target rather than a label */
details.recap{ margin-top:18px; border-top:1px solid var(--line); padding-top:10px; }
details.recap summary{ font-size:0.95rem; letter-spacing:0.02em; }
details.recap .mem{ margin-top:8px; }

/* Pass 0b: the packing list, two layers */
ul.pack li{ padding-left:30px; }
ul.pack li::before{ display:none; }
ul.pack .box{ position:absolute; left:2px; top:9px; width:14px; height:14px; border:2px solid var(--ink); background:var(--panel); font-style:normal; font-size:11px; line-height:12px; text-align:center; }
ul.pack .box.on{ background:var(--gold); color:#1F2A31; }
ul.pack.learned b{ font-weight:600; }

.closing{ border-left:4px solid var(--line); padding:8px 12px; color:var(--muted); margin:18px 0 0; font-size:0.95em; }
.verdictline{ border-left:4px solid var(--sea); padding:8px 12px; background:var(--panel); font-size:17px; }

/* ---- a locked option is subordinate; its reason is not ------------------------
   The card dims. The reason keeps full opacity and a warm accent, because
   "Opens at 08:00" is the only actionable thing on that button, and at .5 opacity
   on a phone in daylight it could not be read at all. */
:root{ --lock:#B4533A; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --lock:#FF8A66; } }
:root[data-theme="dark"]{ --lock:#FF8A66; }
.choice[disabled], .choice:disabled{ opacity:1; border-style:dashed; box-shadow:none; background:transparent; }
.choice[disabled] .lbl, .choice[disabled] .sub, .choice[disabled] .meta{ opacity:.5; }
.choice[disabled] .meta{ color:var(--muted); }
.choice .why-lock{
  display:inline-block; margin-top:5px; opacity:1;
  font-size:15px; line-height:1.3; letter-spacing:.02em; color:var(--lock);
  border:2px solid var(--lock); padding:1px 7px; background:var(--panel);
}
.choice .why-lock .num{ color:var(--lock); font-size:1em; }

/* ---- the card at the end: facts a person can read at a glance and send on ---- */
h2.cardhead{ font-size:19px; letter-spacing:.1em; line-height:1.3; margin-bottom:10px; color:var(--muted); }
.tripcard{ border:2px solid var(--ink); background:var(--panel); box-shadow:4px 4px 0 var(--shadow); padding:16px 18px; margin:0 0 16px; }
.tripcard .cardmoney{ font-size:20px; line-height:1.35; margin:0 0 10px; }
.tripcard .cardfacts{ font-size:17px; color:var(--muted); margin:0 0 10px; }
.tripcard .cardnotes{ list-style:none; padding:0; margin:0 0 12px; }
.tripcard .cardnotes li{ font-size:16px; padding:3px 0 3px 16px; position:relative; }
.tripcard .cardnotes li::before{ content:""; position:absolute; left:0; top:11px; width:7px; height:7px; background:var(--lock); }
.tripcard .cardq{ margin:0; padding-top:12px; border-top:2px solid var(--line); display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
.tripcard .cardq span{ font-size:15px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
.tripcard .cardq b{ font-size:28px; line-height:1; color:var(--gold); letter-spacing:.06em; }

/* ==================================================================================
   TWO TYPOGRAPHIC LAYERS

   The pixel face is the machine talking: the brand, the clock, the day counter, the
   buttons, the headings, the end card. It is a UI face — narrow, even-width, no true
   lowercase rhythm — and it is fine for four words on a chip and punishing for four
   sentences of narration. So narration moves to a second layer:

     layer 1  chrome      --font-ui    Pixelify Sans        buttons, HUD, headings, chips
     layer 2  numbers     --font-num   system monospace     anything a player compares
     layer 3  prose       --font-body  system serif         everything they read

   --font-body is a system stack on purpose: the page already pays for one webfont and
   a second one would be a second blocking request for the layer that has to render
   first. Every platform in the stack ships one of these; the last fallback is the
   platform's own serif, which is the right shape even when the name is not.

   Two rules govern the prose layer and nothing else does: it never renders below
   19px — not on a phone, not in the 900px desktop layout that shrinks the chrome to
   17px — and it never runs wider than --measure. That is 61ch rather than 66ch on
   purpose: `ch` is the advance of the digit zero, which in this serif is wider than
   the average lowercase letter, so 66ch measured 71 real characters on a wide screen
   and 61ch measures 67. The target is the characters, not the unit.

   Choice labels and their subs stay in the chrome face deliberately: they are things
   you click, counted and numbered, not things you read.
   ================================================================================== */
:root{
  --font-ui:'Pixelify Sans','Courier New',ui-monospace,Menlo,monospace;
  --font-num:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
  --font-body:Georgia,"Iowan Old Style","Palatino Linotype","Book Antiqua","Times New Roman",serif;
  --body-size:19px;
  --measure:61ch;
}

/* the prose layer */
/* `paras()` emits narration as bare <p>; every classed <p> in the panel is a readout
   (.delta carries a duration, .packcap a capacity, .cardmoney a total) and stays in the
   chrome face. The four classes named here are the ones that are narration. */
.prose,
#panel > p:not([class]), #panel .feel, #panel .hint, #panel .closing, #panel .verdictline,
#panel ul.mem li, #panel ul.tips li, #panel ul.plain li, #panel ul.answers li,
#journal li, #journal p,
details.recap .mem li{
  font-family:var(--font-body);
  font-size:var(--body-size);
  line-height:1.6;
  letter-spacing:0;
  max-width:var(--measure);
}
/* a padded block holds the same measure inside its own border */
#panel .hint, #panel .closing, #panel .verdictline{ max-width:calc(var(--measure) + 2.2rem); }
/* the tips list keeps its two voices: headword in the accent, speaker as an aside */
#panel ul.tips li b{ font-family:var(--font-body); font-weight:700; }
#panel ul.tips li i{ font-family:var(--font-ui); font-size:0.8em; }
/* italic in a serif is real italic, so the mood line no longer needs to shout */
#panel .feel{ font-style:italic; }

/* The delta line carries both layers at once. The meters are numbers and stay mono; the
   sentence inside it is the same sentence `.feel` prints and is set as prose, so "You feel
   tired." does not change typeface depending on whether a duration arrived with it. */
#panel > p.delta{ font-family:var(--font-body); font-size:var(--body-size); line-height:1.5; letter-spacing:0; max-width:var(--measure); }
#panel > p.delta .meter, #panel > p.delta .sep{
  font-family:var(--font-num); font-variant-numeric:slashed-zero tabular-nums;
  font-size:0.82em; letter-spacing:.02em;
}
#panel > p.delta .said{ font-family:var(--font-body); }

/* the number layer: anything a player compares against another number */
.num, .stats b, .score b, .tripcard .cardmoney .num, .tripcard .cardq b, #hud .chip .num{
  font-family:var(--font-num);
  font-variant-numeric:slashed-zero tabular-nums;
}

/* the chrome layer keeps the pixel face even where a cascade above would not */
header, #hud, #choices, .items, footer, h1, h2, h3, .lead, .packcap, .count, .trip, .pbtn{
  font-family:var(--font-ui);
}

@media (max-width:480px){
  /* the chrome may shrink on a phone; the prose may not. The measure is academic at
     this width — the viewport is narrower than the cap — but the floor is not. */
  :root{ --body-size:19px; }
}

/* v29 — the four meter icons. Square pixels, the colour of the text beside them. */
.ico{ display:inline-block; width:0.9em; height:0.9em; margin-right:0.3em; vertical-align:-0.08em; fill:currentColor; }
.ico-money{ color:var(--gold); } .ico-energy{ color:var(--sea); } .ico-phone{ color:var(--lock); }
#panel .feel .ico, #panel .delta .said .ico{ font-style:normal; }

/* v31 — the traveller type, big, under the card head; and the folds under the verdict */
.traveller{ font-family:var(--font-body); font-style:italic; font-size:26px; line-height:1.25; color:var(--sea); margin:-4px 0 14px; }
@media (max-width:480px){ .traveller{ font-size:22px; } }
details.fold{ margin-top:12px; border-top:1px solid var(--line); padding-top:8px; }
details.fold > summary{ cursor:pointer; font-family:var(--font-ui); font-size:17px; letter-spacing:.04em; color:var(--ink); padding:6px 0; }
details.fold[open] > summary{ margin-bottom:6px; }
.storyline{ font-family:var(--font-body); font-size:19px; line-height:1.35; color:var(--muted,#5b6470); margin:-4px 0 12px; }

/* the last resort when neither the clipboard API nor execCommand is available (artifact iframe) */
.handoff{ display:block; width:100%; min-height:160px; margin-top:12px; font:14px/1.45 ui-monospace,Menlo,monospace;
  color:var(--ink); background:var(--panel); border:2px solid var(--ink); box-shadow:3px 3px 0 var(--shadow); padding:10px; resize:vertical; }
.item .note{ color:var(--muted); font-size:.85em; } .item.on .note{ color:#4A3A10; }
#mapimg{ display:block; width:100%; max-width:100%; height:auto; aspect-ratio:16/9; object-fit:contain; background:#E9E2CF; }
#mapimg[hidden], #scene[hidden]{ display:none; }
#hud[hidden]{ display:none; }   /* v36: the empty HUD box under the title picture */
/* v37: the title screen is the title — no Back / Journal / Restart, no progress boxes until the trip starts */
#app[data-scene="title"] .tools, #app[data-scene="title"] #prog{ display:none !important; }
/* the keyboard hint means nothing under a finger */
@media (pointer: coarse){ footer{ display:none; } }
button.trip{ font:inherit; color:inherit; text-align:left; cursor:pointer; }
button.trip.soon:active{ transform:none; }
.tripnote{ min-height:1.3em; margin:4px 0 0; font-size:14px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
#panel > .choice[data-top]{ margin:0 0 14px; }

/* ==================================================================================
   v40 — readability. The pixel face stays on headings, the HUD and a button's main label.
   Everything small that explains something moves to the reading face, never under 15px.
   ================================================================================== */
.choice .sub, .choice .meta, .choice .why-lock, .item .note, .packcap, .count, footer, #backwhy, .why,
.trip i, .tripnote, details summary, details.recap summary, details.fold > summary, .cardfacts, .cardq span, .tripcard .cardmoney, .tripcard .cardnotes li{
  font-family:var(--font-body); letter-spacing:.01em;
}
.choice .sub{ font-size:16px; line-height:1.4; }
.choice .meta{ font-size:15px; }
.choice .meta .num{ font-size:1em; }
.choice .why-lock{ font-size:15px; }
.item .note{ font-size:15px; }
.packcap, .count, .tripnote, .cardq span{ font-size:15px; letter-spacing:.06em; }
footer, #backwhy, .why{ font-size:15px; }
.trip i{ font-size:15px; text-transform:none; letter-spacing:0; }   /* inside the trip chip, under its pixel label */
.tripcard .cardnotes li{ font-size:17px; }
details summary, details.recap summary, details.fold > summary{ font-size:17px; }
.cardfacts{ font-size:17px; }
/* the HUD: money and the clock are read at a glance */
#hud .line .num{ font-size:1.35em; font-weight:700; line-height:1; }
#hud .line .ico{ width:1.05em; height:1.05em; }
#hud .chip{ font-size:15px; }
@media (max-width:480px){
  #hud .line{ font-size:17px; line-height:1.45; }
  #panel > p:not([class]), #panel .feel, #panel > p.delta, #panel ul.mem li, #panel .hint{ font-size:max(17px, var(--body-size)); }
}
#hud .line .seg{ white-space:nowrap; }

</style>
</head>

      <div id="hud" hidden></div>
    </div>
    <div class="right">

      <footer><span>Press <span class="kbd">1</span>–<span class="kbd">9</span> to choose. Saves on this device.</span></footer>
    </div>
  </div>

var STORY_DATA = {"meta":{"title":"DESTINATION — Bali","version":"2.0","notes":"All game content lives here. engine.js interprets it; nothing story-specific is in code. See story_map.md for the readable graph. Conditions: 'has:item', '!has:item', 'flag:name', 'region:canggu,ubud', 'target:ubud', 'home', 'rand<0.5', 'm.energy<35', 'd2.eve==out'. Effects: 'spend:9', 'm.social+=1', 'flag:name', 'mem:text', 'food:text', 'person:text', 'evt:text', 'photos:4', 'tip=1', {if,do,else}, {random:[{p,do},{do}]}, {pick:'target.events', into:'d2.event', obj:'d2.eventObj'}. Text: string | [segments joined by blank line] | {by:'region', canggu:..., default:...} | {if, text, else} | {ref:'region.something'} | {parts:[...], join:' '}. Templates: {region.name} {region.owner} {region.hotel} {target.name} {npc1} {npc2} {trip} {d2.weather|lower} {bagNames} {event.text}. Choices may carry cost (€, number or template or conditional) and dur (minutes): cost is spent automatically on click and locks the choice when the wallet is short; dur is shown on the button (the clock is driven by dur once the hub exists). Money never goes below zero.","days":3,"slots":6,"product":"DESTINATION","description":"A playable 3-day trip to Bali. Pick a town, spend your budget, meet strangers. Can you do it on €30 a day?","destination":"Bali","slug":"bali","url":"https://lifeismehh.com/bali","invite":"Your turn: 3 days in Bali. Can you do it on €30 a day?","saveKey":"destination_bali_v1","tripLengths":[{"days":3,"label":"3 DAYS"},{"days":7,"label":"7 DAYS","soon":true},{"days":14,"label":"14 DAYS","soon":true}],"packingBasics":["Passport, and a photo of it on your phone","Plug adapter — the sockets here take two round pins","Sunscreen, stronger than you think you need","Something for your stomach","A light rain layer, even in the dry season","Flip-flops, and one pair you can actually walk in","Insect repellent, for dusk","Small notes: a lot of this island does not take cards","A dry bag, or a pouch that keeps the phone dry"],"saveVersion":10,"saveNotes":"`saveKey` is fixed forever (destination_bali_v1) — renaming it would orphan `_packing` and `_answers` too. `saveVersion` is what guards an in-progress trip: ui.js writes it into the save payload and refuses a save written by a different one, because a half-played day carries a clock, a wallet and a set of moment flags that only make sense under the build that produced them. Bump it whenever durations, the travel table, plan, the tier wallet or the state shape change. The learned packing list and the Yes/Maybe/No log are never versioned and never dropped.","roster":[{"id":"marta","name":"Marta","gender":"f","where":"airport, one mid-trip event, the departure gate"},{"id":"canggu.npc1","name":"Falk","gender":"m","where":"Canggu, day 1"},{"id":"canggu.npc2","name":"Jonas","gender":"m","where":"Canggu, day 2"},{"id":"ubud.npc1","name":"Wayan","gender":"m","where":"Ubud, day 1"},{"id":"ubud.npc2","name":"Priya","gender":"f","where":"Ubud, day 2"},{"id":"uluwatu.npc1","name":"Made","gender":"m","where":"Uluwatu, day 1"},{"id":"uluwatu.npc2","name":"Rafa","gender":"f","where":"Uluwatu, day 2"}],"sharedNotes":"Everything the three region hubs have in common: the pool entries that exist everywhere, the day-trip hub, and every patch that rewires a linear scene for hub mode. Merged FIRST, before the region overlays. Where you are right now is `d2.target`; `home` is true when that equals `region`, and `target.*` therefore always resolves to the place you are standing in.","hubNotes":"Canggu's action pool, contextual events and three day hubs. Everything generic lives in hub_shared.json. Durations are BLOCKS: door to door, including getting there and back — `friction` is only the gap between things. No scene here carries a clock; the mornings are relative to the wake scene and the last day's deadline is plan.leaveBy.","ubudNotes":"Ubud on the hub. Fewer, longer, quieter actions than Canggu and the lowest friction on the island, because everything worth doing is a walk away. The priced actions route through d2_price so the terraces sarong, the Monkey Forest gate and the yoga drop-in stay real money decisions. Durations are blocks, door to door.","uluwatuNotes":"Uluwatu on the hub. Seven or eight real actions, all of them longer than anywhere else, and the highest friction on the island because on the Bukit nothing is ten minutes away and the drivers are few. The sunset is the day's real appointment. Durations are blocks, door to door."},"start":"title","meters":{"money":115,"energy":55,"social":0},"state":{"bag":[],"sim":null,"transport":null,"region":null,"settle":null,"act1":null,"npc1q":null,"rainOk":null,"rainWalk":false,"dinner":null,"sunsetStay":null,"phone":90,"d2":{"weather":null,"target":null,"transport":null,"event":null,"eventObj":null,"act":null,"priceOut":"","skip":false,"npc2":null,"eve":null,"late":false,"bailed":false},"d3":{"morning":null,"surprise":null},"q":{},"sc":{"nature":0,"beach":0,"culture":0,"plan":0,"comfort":0,"haggle":0},"flags":{},"photos":0,"spend":0,"foods":[],"people":[],"events":[],"time":0,"clockRunning":false,"day":0,"days":3,"weather":null,"budgetPerDay":null,"done":{},"usedEvents":[],"transitMin":0,"rainAfternoons":0,"bellyRisk":0,"npc":{"tip":0,"marta":0},"log":[],"extraDrawn":0,"rain1":0,"brokeDay":0,"unpaid":0,"seenActs":[],"tips":[],"pics":{}},"items":[{"id":"jacket","name":"Rain jacket","sub":"","why":"Day 1 rain: you can keep walking instead of sheltering. Day 2 on a scooter in rain: dry, no energy loss.","slots":1},{"id":"sunscreen","name":"Sunscreen","sub":"","why":"Surf, cliff beaches, terraces at noon: without it you burn, lose energy and comfort, and carry it into Day 3.","slots":1},{"id":"repellent","name":"Insect repellent","sub":"","why":"Dusk at the beach, the ravine deck, the cliff garden: without it you get bitten, lose a little energy and carry the itch into the next morning.","slots":1},{"id":"flipflops","name":"Flip-flops","sub":"","why":"Black sand in the afternoon, the Bingin stairs, the hotel bathroom: without them, small pains and energy loss.","slots":1},{"id":"sarong","name":"Sarong","sub":"you have one, somehow","why":"Temples want covered knees. Carrying one from home is not the advice — you can buy one at the first gate for four euros — but if it is already in the bag you walk straight in.","slots":1},{"id":"drybag","name":"Dry bag","sub":"fits a phone","why":"Rain, the back of a scooter, an afternoon in the water: the phone stays dry. Without it the phone takes the weather, and a wet phone is no Grab home.","slots":1},{"id":"powerbank","name":"Power bank","sub":"","why":"Day trip: phone survives past three. No adapter: it charges the phone overnight. Dead phone means no Grab home at night.","slots":1},{"id":"adapter","name":"Plug adapter","sub":"","why":"Without it (and without a power bank) the phone spends the night uncharged: Day 2 Grab fails or Maps dies, guaranteed.","slots":1},{"id":"laptop","name":"Laptop","sub":"","why":"Café day: you work and feel like a resident. Quiet night: you lose an hour to email instead of sleeping. Day 3: half a kilo of humidity.","slots":1},{"id":"shoes","name":"Walking shoes","sub":"","why":"Terraces, the ridge, the cliff path: faster and less tiring. Day 3 dawn walk in flip-flops on wet stone is slow.","slots":1},{"id":"book","name":"A paperback","sub":"","why":"Rain with no gear: you can wait it out reading instead of on your phone. Quiet night: you finish a book and sleep well.","slots":1},{"id":"meds","name":"Stomach tablets","sub":"","why":"Warung food or the midnight cart can hit your stomach. With tablets you lose an hour; without them you lose half a day and the day trip.","slots":1}],"regions":{"canggu":{"name":"Canggu","blurb":"Surf, cafés, crowds.","sub":"Near the airport. Black-sand beach. A bar on every corner.","hotel":"a guesthouse behind a café on the shortcut road","owner":"Pak Agung","neighbors":["ubud","uluwatu"],"npc1":{"name":"Falk","role":"a traveller from Leipzig","gender":"m"},"npc2":{"name":"Jonas","role":"Dutch, four years in Canggu","place":"café","item":"plug","gender":"m"},"arrive":"The shortcut road is one lane of scooters going both ways past rice paddies squeezed between villas. Every third building is a café; every café is playing the same lo-fi playlist. Your guesthouse is behind one of them. Pak Agung hands you a key, a towel and the wifi password on a laminated card. The whole day in front of you.","act1":[{"k":"beach","label":"Walk to Batu Bolong beach","sub":"Ten minutes. Black sand, surfers, dogs.","do":["act1=beach","sc.beach+=1","m.energy-=5",{"if":"!has:flipflops","do":["m.energy-=5","flag:hotsand"]}],"next":"act1_out","dur":90},{"k":"temple","label":"Tanah Lot temple","sub":"Forty minutes by scooter taxi, Famous, on a rock in the sea.","do":["act1=temple","sc.culture+=1","m.energy-=10"],"next":"act1_out","cost":6,"dur":150},{"k":"rest","label":"The guesthouse pool","sub":"Small, clean, yours.","do":["act1=rest","sc.comfort+=1","m.energy+=10"],"next":"act1_out","dur":60}],"act1_out":{"beach":{"text":["The beach is black sand and long, with a temple on the point and a line of surf schools, each a tent and a rack of soft boards. Dogs that belong to nobody patrol between the bean bags.",{"if":"flag:hotsand","text":{"by":"timeBand","morning":"The black sand is already warm enough to make you skip the last few metres. By afternoon it will be hot enough to hurt, and flip-flops would have cost three euros.","midday":"Black sand at midday is hot enough to hurt. You do the walk in short, undignified bursts between shadows. Flip-flops would have cost three euros.","afternoon":"In the afternoon the black sand is hot enough to hurt. You do the walk in short, undignified bursts between shadows. Flip-flops would have cost three euros.","default":"The sand has cooled off, which is the only reason your feet are forgiving you. Earlier it would have hurt."},"else":{"by":"timeBand","midday":"The flip-flops go on at the edge of the sand, which at midday is hot enough to hurt through anything thinner.","afternoon":"The flip-flops go on at the edge of the sand, which in the afternoon is hot enough to hurt through anything thinner.","default":"The flip-flops go on at the edge of the sand out of habit; at this hour it is not even warm."}},"You walk in the shallows until the jetlag is gone, or until you have stopped noticing it."],"mem":"Walked Batu Bolong beach at golden hour"},"temple":{"text":"The man at the gate wants a ticket, not a sarong: a hundred thousand rupiah. Nobody goes into the temple; you look at it from the shore, a thousand people and one python around you, and for ten minutes it is just the temple and the sea.","mem":"Tanah Lot, python not included"},"rest":{"text":"The pool is small, cool and, for an hour, entirely yours. A frangipani falls in. Somewhere a scooter fails to start, repeatedly. You float and think about nothing for the first time in a long time.","mem":"An hour in the guesthouse pool, thinking about nothing"}},"npc1_intro":{"beach":"On the sand near the surf school a man is waxing a board with the concentration of someone defusing a bomb. Sticker on the board: LEIPZIG. He catches you looking.\n\n\"Leipzisch,\" he says, and taps it. \"Not Berlin.\"\n\n\"Falk. Third week. I still can't stand up. Do you surf?\"","temple":"On the shuttle back a man with wet hair and a LEIPZIG sticker on his water bottle sits down opposite you.\n\n\"Did you also pay sixty thousand to see the temple from a hundred metres away?\" He puts out a hand. \"Falk. Leipzisch, not Berlin. Third week here.\"","rest":"At the pool a man is reading on the only dry chair. Sticker on his bottle: LEIPZIG.\n\n\"Nu. You just arrived, right? You have the look. Pale and hopeful. Falk. Third week.\""},"npc1_a":{"q":"\"Three weeks? Doing what?\"","a":"\"Ubud for a week, which was beautiful and I got bored. Never bored here.\" He scrapes wax. \"Honest advice? Surf early, before the crowd and bargain.\"","q2":[["\"What's the real price?\"",{"parts":["\"Three-fifty. They ask five. Don't be a hero about it, it's still their living.\" He goes back to the wax. Later, on the beach, you will see him fall off the board ten times in a row and get back on the eleventh.",{"if":{"any":["timeBand==evening","timeBand==night"]},"text":" It's getting dark. Need to go back."}],"join":""}],["\"What made Ubud boring?\"","\"Nothing. That's the point. It's for people who want nothing to happen, beautifully. I wanted something to happen.\" He shrugs. \"You'll figure out which one you are. Three-fifty for the surf, by the way. They ask five.\""]]},"npc1_b":["\"Not yet. Maybe tomorrow.\"","\"Tomorrow is a very Canggu word.\" He grins. \"Blue tent, early, ask for Komang. Eat at the warung next to it — at twelve, not at three. Everyone blames the ice. Ice with a hole is from a factory; lumpy ice isn't. And the tray that's been out since lunch.\" Then he is back in the water."],"npc1_c":"You smile, nod, walk on. Behind you the wax scraping resumes. The beach is long enough for both of you.","rain":{"roof":"the nearest café, which has a roof but no walls","roofShort":"a café with a roof but no walls","under":"The café's speaker keeps playing. A dog you recognise from the beach comes in, shakes itself onto three people and lies down. Somebody at the next table says the surf will be brown tomorrow, and that everything the villages upstream put in the river gets to the break in about four hours."},"dinner":{"warung":{"label":"A warung on the lane","cost":2},"tourist":{"label":"A restaurant on Batu Bolong road","cost":12},"tip":{"label":"The warung next to the blue tent","sub":"Where the instructors eat.","cost":3}},"sunset":"The beach fills up. Everyone faces the same way. Bean bags, Bintang, a dog that belongs to no one, a drone that belongs to someone annoying. The sun goes down orange behind a line of surfers still in the water, and for a minute nobody on the beach is looking at a phone.","night_sound":"scooters","breakfast2":"Breakfast is included and consists of a banana pancake and a coffee that could restart a scooter.","events":[{"id":"traffic","if":"d2.transport==driver && phone>=30","w":40,"text":"Traffic. The famous Canggu kind. Forty minutes for nine kilometres, scooters filling every gap like water. The driver shrugs at the whole island, then at you, then puts on a song about a girl from Denpasar and sings it.","mem":"Forty minutes for nine kilometres","do":["m.energy-=5"]},{"id":"cancel","if":"d2.transport==driver && phone>=30","w":30,"text":"The Grab cancels. Then cancels again. The third driver, Pak Nyoman, arrives in a car that smells of jasmine and has been driving this island for twenty-two years. You learn more in the first ten minutes than from any blog.","mem":"Two Grab cancellations, one great driver","do":["m.social+=1","person:Pak Nyoman, driver for twenty-two years"]},{"id":"cancel_dead","if":"d2.transport==driver && phone<30","w":100,"text":"You open the app at {phone}% and it dies mid-order, screen black, the little apple gone. No power, no Grab. You walk to the main road and flag a driver the old way, with your arm. It takes eleven minutes and costs a little more, and the driver, Pak Nyoman, thinks the whole thing is very funny.","mem":"Phone died mid-Grab. Flagged a driver with an arm.","do":["phone=0","m.social+=1","m.energy-=5","spend:5","person:Pak Nyoman, flagged down on the main road","evt:Phone dead before the day had properly started. No adapter."]},{"id":"lights","if":"d2.transport==scooter && phone>=30 && !flag:rainride","w":35,"text":"At the lights on the shortcut road a woman on a scooter with a surfboard rack asks where you are from, then where you are going, then says \"same\" and rides with you to the beach. Sam, from Melbourne, second month, also cannot stand up yet.","mem":"Rode to the beach with a stranger from the traffic lights","do":["m.social+=1","person:Sam, from Melbourne, met at the traffic lights"]},{"id":"flat","if":"d2.transport==scooter && phone>=30 && !flag:rainride","w":25,"text":"Twenty minutes in, the back wheel goes soft. You roll into a warung where a boy of about twelve looks at it, disappears, and comes back with a plug kit. Six minutes, twenty thousand rupiah. His grandmother charges you for a coffee you needed anyway.","mem":"Flat tyre, fixed by a twelve-year-old in six minutes","do":["m.social+=1","spend:2"]},{"id":"lost_dead","if":"d2.transport==scooter && phone<30","w":100,"text":"Maps dies at the third junction, at 6%, then at 0%. The shortcut road has no signs because everyone already knows it. You ask a woman selling petrol in vodka bottles, then a man washing a dog, then a child. Each of them points a slightly different way. You arrive forty minutes late and slightly more part of the place.","mem":"Phone dead, navigated by asking three strangers","do":["phone=0","m.social+=2","m.energy-=10","evt:Phone dead before the day had properly started. No adapter."]},{"id":"rain","if":"d2.transport==scooter && flag:rainride","w":100,"text":["It rains for the first twenty minutes, the road turning to a shallow river of ponchos.",{"if":"has:jacket","text":"The jacket earns its place in the bag: wet legs, dry everything else, and the scooter does not care either way.","else":"You are wet, then dry, in that order; everything here dries within the hour."}],"mem":"Rode the scooter through the morning rain","do":[{"if":"!has:jacket","do":["m.energy-=8"]}]},{"id":"none_s","if":"d2.transport==scooter && phone>=30 && !flag:rainride","w":20,"text":"The road does what it says. You pass three small ceremonies, one dog asleep in the exact middle of the lane, and a truck carrying a full-size statue of a god wrapped in cloth. Nobody but you looks twice.","mem":"A scooter ride past three ceremonies and one sleeping dog","do":[]}],"act2":[{"k":"surf","label":"Surf lesson at Batu Bolong","sub":"Instructor, soft board, two hours.","do":["d2.act=surf"],"next":"d2_price","dur":120},{"k":"cafe","label":"Café-hop the shortcut road","sub":"People-watch, work, or pretend to.","do":["d2.act=cafe"],"next":"d2_price","dur":180},{"k":"club","label":"Beach club afternoon","sub":"Daybed, pool, DJ, minimum spend.","do":["d2.act=club"],"next":"d2_price","dur":300}],"price":{"surf":{"text":{"if":"flag:tip_npc1_q2 && home","text":"\"Three-fifty. Don't tell the Australians.\" Nobody haggles; the price was decided yesterday.","else":"The instructor says five hundred thousand, about thirty euros. The sign behind him says four hundred."},"choices":[{"if":"flag:tip_npc1_q2 && home","label":"Pay 350k","do":["m.social+=1","d2.priceOut=You pay three-fifty and get the good board, the one without the dent.","mem:Surfed with Komang at the friend price","flag:used_tip"],"next":"d2_act_out","cost":21},{"if":"flag:tip_npc1_q2 && home","label":"Pay the 500k anyway","do":["sc.comfort+=1","d2.priceOut=You pay the full price. Komang looks at you for a second, then gives you the good board and an extra half hour. Nobody mentions it.","mem:Paid full price for the surf lesson on purpose","flag:used_tip"],"next":"d2_act_out","cost":30},{"if":"!flag:tip_npc1_q2 || !home","label":"Pay 500k","do":["sc.comfort+=1","sc.plan+=1","d2.priceOut=You pay it. He gives you the newer board. Whether that is connected is unclear.","mem:Surf lesson, full price, no fuss"],"next":"d2_act_out","cost":30},{"if":"!flag:tip_npc1_q2 || !home","label":"Offer 350k","do":["sc.haggle+=1",{"random":[{"p":0.7,"do":["spend:-6","d2.priceOut=He sighs, theatrically. \"Four hundred. Because you asked nicely.\" You both know how this works.","mem:Haggled the surf lesson down to 400k"]},{"do":["d2.priceOut=\"Five hundred. Small day, high demand.\" You pay it. He is not wrong about the demand.","mem:Tried to haggle the surf lesson. Lost."]}]}],"next":"d2_act_out","cost":30,"paidBand":[24,30]},{"if":"!flag:tip_npc1_q2 || !home","label":"Walk to the next tent","do":["sc.haggle+=1","sc.plan-=1","m.energy-=3",{"random":[{"p":0.5,"do":["spend:-9","d2.priceOut=Next tent: three-fifty, older board, older instructor, better instructor as it turns out.","mem:Walked to the next surf tent and found the better teacher"]},{"do":["d2.priceOut=Next tent is the same price, and now the first guy has your slot. You wait forty minutes for the tide, then pay five hundred anyway.","mem:Walked to the next tent. Same price, lost the slot."]}]}],"next":"d2_act_out","cost":30,"paidBand":[21,30]},{"label":"Watch from the sand instead","cost":0,"do":["d2.skip=true","d2.priceOut=You watch the lesson from the sand. The instructor's students fall off in the same order you would have.","mem:Watched the surf lesson from the sand"],"next":"d2_act_out"}]},"cafe":{"text":"Smoothie bowl: 85,000. About five euros, four times what the warung across the road, where the drivers eat, charges for nasi campur.","choices":[{"label":"The bowl. It is why you came.","do":["sc.comfort+=1","photos:1",{"if":"phone>0","do":["d2.priceOut=It is very good and very expensive and you photograph it, like everyone. The wifi password is \"goodvibesonly\", without irony."],"else":["d2.priceOut=It is very good and very expensive and everyone but you is photographing it. The wifi password is \"goodvibesonly\", without irony."]},"food:Canggu: a smoothie bowl, obviously","mem:A smoothie bowl on the shortcut road"],"next":"d2_act_out","cost":5},{"label":"The warung with the drivers","do":["m.social+=1",{"if":"phone>0","do":["d2.priceOut=You eat at the warung with the drivers, who are watching a football match on a phone propped against the sambal. One of them shows you a shortcut to the beach on Maps that is not on Maps."],"else":["d2.priceOut=You eat at the warung with the drivers, who are watching a football match on a phone propped against the sambal. One of them draws you a shortcut to the beach on the back of a receipt."]},"food:Canggu: nasi campur with the drivers","mem:Ate with the drivers across from the café"],"next":"d2_act_out","cost":1.5},{"label":"Both. It is a holiday.","do":["photos:1","d2.priceOut=Both. The bowl for the photo, the warung for the food. This is, you suspect, how everyone here actually lives.","food:Canggu: a smoothie bowl and then a proper lunch","mem:Smoothie bowl, then a warung, in that order"],"next":"d2_act_out","cost":6.5}]},"club":{"text":"Daybed minimum spend: 500,000, about thirty euros. The bar has stools and no minimum. The beach outside the fence is free and has, as far as you can tell, the same sunset.","choices":[{"label":"The daybed","do":["sc.comfort+=2","m.energy+=10","d2.priceOut=The daybed. You are horizontal for five hours with a cold drink that arrives before you know you want it.","mem:Five hours on a beach-club daybed"],"next":"d2_act_out","cost":30},{"label":"Bar stool, one drink, then the free beach","sub":"","do":["sc.beach+=1","d2.priceOut=One drink at the bar, then out the gate and onto the sand with everyone who did the maths.","mem:One drink inside, sunset outside the fence"],"next":"d2_act_out","cost":5},{"label":"Skip inside. The sand outside.","do":["sc.beach+=1","m.social+=1","sc.plan-=1","d2.skip=true","d2.priceOut=You sit on the sand outside the fence with a beer from a cart. Same sunset, same DJ leaking through the hedge, same sea. A dog adopts you for an hour.","mem:Sat outside the beach club fence with a 20k beer and a borrowed dog"],"next":"d2_act_out","cost":1.5}]}},"act2_out":{"surf":{"text":{"if":"d2.skip","text":"Two hours on the sand. A dog lies down against your leg and stays for most of it.","else":["Two hours. You stand up once, for maybe a second and a half, and it is the best second and a half of the year. Your arms stop working around minute ninety. The instructor says \"good, good\" in a way that means \"not good, but good\".",{"if":"!has:sunscreen","text":"By evening your shoulders are the colour of the sunset. Tomorrow will know about it.","else":""}]},"mem":{"if":"d2.skip","text":"","else":"Stood up on a surfboard for a second and a half"},"do":[{"if":"d2.skip","do":["m.energy-=5"],"else":["sc.beach+=1","m.energy-=25",{"if":"!has:sunscreen","do":["flag:sunburn","evt:Sunburn. No sunscreen in the bag.","sc.comfort-=1","m.energy-=10"]}]}]},"cafe":{"text":{"if":"has:laptop","text":"Three more cafés, and in the last one you open the laptop and answer four emails, like a resident.","else":"Three more cafés, everyone on a laptop but you, the coffee excellent everywhere."},"mem":"A day of cafés on the shortcut road","do":["m.social+=1",{"if":"has:laptop","do":["sc.comfort+=1"]}]},"club":{"text":{"if":"d2.skip","text":"Inside the fence someone is paying thirty euros for the view you have. The dog leaves at sunset without saying goodbye. Fair.","else":{"parts":["A pool that is the same temperature as the air, and a view of the sea over a hedge.",{"if":"time>=870","text":"The DJ has been going since two and shows no sign of stopping.","else":{"if":"time>=780","text":"The DJ is setting up; he starts at two, in a few minutes, and then he does not stop.","else":"The DJ starts at two. Until then it is a playlist and the sound of the pool."}},"It is exactly what it looks like on Instagram, which is either the point or the problem."],"join":" "}},"mem":{"if":"d2.skip","text":"","else":"The beach club, exactly as advertised"},"do":[{"if":"!d2.skip && !has:sunscreen","do":["flag:sunburn","evt:Sunburn on the daybed. No sunscreen.","m.energy-=8"]}]}},"npc2_intro":"At a café on the shortcut road a man in his forties with a laptop and a glass of something green nods at the empty chair.\n\n\"Sit, it's the only one with a plug. Jonas. Four years here. You've been here about a day, right? Everyone has the same face on day two.\"","npc2_a":"\"One: the sunset is free. Two: after half four, when the shortcut locks up, stop looking at Maps and follow the delivery riders.\" He closes the laptop. \"And if you like this, stay in Canggu. If it already annoys you, you're an Ubud person or an Uluwatu person, and no amount of smoothie bowls will fix that.\"","npc2_b":"\"I came for two weeks in 2022. The internet was better than my office in Rotterdam and the coffee was cheaper. Then a client didn't notice I'd moved. Then another.\" He pauses. \"I go home every summer and I'm bored in nine days. That's the honest answer. The other one is that almost nothing I spend here stays here. I'm not the exception, I'm the business model.\"","npc2_c":"\"Fair.\" He goes back to his screen. You charge to eighty percent and leave. The café plays the same song twice.","eve":{"quietSub":"","outSub":"A bar with a live band doing \"Wonderwall\", cheap beer, strangers.","outCost":10,"quietSound":"Scooters, a bar somewhere doing a cover of something, a rooster that has lost track of time.","outText":"The bar has a live band doing \"Wonderwall\" for the second time and nobody minds. You end up at a table with a nurse from Manchester, two Argentinians and a Balinese guy who works the bar and has opinions on all three countries.","outMem":"A table of strangers and a band doing \"Wonderwall\" twice","outPeople":"a nurse from Manchester, two Argentinians and a bartender with opinions"},"d3":{"breakfast":"Pak Agung has put an extra pancake on the plate without comment.","restSub":"Slow breakfast, pool, nothing at all.","exploreSub":"Walk the beach north to Pererenan while it is still empty.","restOut":"You do nothing, expertly. The pool, the pancake, a chair in the shade. The shortcut road goes on being the shortcut road without you.","exploreOut":"The beach north of the village is empty at eight except for a man exercising a horse in the surf and a woman who is clearly a local swimming laps in the sea. The black sand is cool. You walk until the villas thin out and the paddies come down to the shore.","exploreMem":"The empty beach north of the village at eight","npc1Bye":"On the way back along the beach, Falk is on the sand, and then he is standing on the board. For two full seconds. He sees you, throws both arms up, and falls off. You cheer from the road like an idiot. Nobody minds.","npc1ByeMem":"Saw Falk stand up. Two seconds. Cheered.","road":"The shortcut road at noon is the shortcut road at any hour: one lane, both directions, everyone somehow fine."},"npc1Bye":"On the way back along the beach, Falk is on the sand, and then he is standing on the board. For two full seconds. He sees you, throws both arms up, and falls off. You cheer from the road like an idiot. Nobody minds.","npc1ByeMem":"Saw Falk stand up. Two seconds. Cheered.","tips":{"npc1a":{"a":"","b":""},"npc1b":{"a":"tip:Bali belly | Lumpy ice, and the tray out since lunch. | Falk","b":"tip:Komang | Blue tent. Ask for him. | Falk"},"npc1q2":{"a":"tip:Surf price | Three-fifty. They ask five. | Falk"},"npc2a":{"a":"tip:Traffic | After half four, follow the delivery riders, not Maps. | Jonas","b":"tip:Sunset | The sunset is free. | Jonas"},"npc1intro":{"a":""}},"hub":{"friction":25,"eventRate":0.45,"actions":[{"id":"beach","pri":3,"air":"out","label":"Batu Bolong beach","sub":"The surf beach everyone means when they say Canggu. Black sand.","dur":150,"cost":0,"do":["act1=beach","sc.beach+=1","m.energy-=5",{"if":"!has:flipflops && done.act:beach<=1","do":["m.energy-=5","flag:hotsand"]},{"if":"!has:sunscreen && timeBand==midday","do":["m.energy-=4","flag:sunburn"]},{"if":"has:drybag","do":["m.energy+=3","flag:drybag_used"],"else":["phone-=4"]},{"if":"phone<45 && has:powerbank && !flag:bankday","do":["phone=100","flag:bankday","evt:The phone hit single digits out on the coast. The power bank, that brick, earned its place."]}],"next":[{"if":"!flag:met_npc1 && home","next":"act1_out"},{"next":"hub_out"}],"out":{"2":"The beach again, different light, fewer surfers. Still black, still hot.","3":"Third time. A surf instructor nods at you like a colleague.","by":"done.act:beach","default":"The same beach. The same dogs. You are a regular now, and it feels like it."},"where":"beach"},{"id":"surf","art":"surf","pri":3,"air":"out","label":"Take a surf lesson at Batu Bolong","dur":165,"from":390,"until":900,"do":["d2.act=surf"],"next":"d2_price","tiredLock":20,"lockText":"You're too tired for that","where":"water","oncePerDay":true,"costBand":[0,30]},{"id":"club","art":"beachclub","pri":2,"air":"out","label":"Beach club daybed","dur":255,"from":660,"until":1140,"once":true,"do":["d2.act=club"],"next":"d2_price","where":"water","commitDo":[{"if":"sim==skip","do":["time+=15","spend:2","flag:sim_cost","evt:No SIM, so the ride home had to be arranged from the bar's wifi. Fifteen minutes of standing about."]}],"costBand":[1.5,30]},{"id":"cafehop","pri":1,"air":"in","label":"Café-hop the shortcut road","sub":{"if":"sim==skip","text":"There is wifi, which is where you call cars from now."},"dur":195,"from":420,"until":1080,"once":true,"do":["d2.act=cafe",{"if":"phone<45 && has:powerbank && !flag:bankday","do":["phone=100","flag:bankday","evt:The phone was down to a quarter by mid-afternoon. The power bank, that brick, earned its place."]}],"next":"d2_price","rest":true,"where":"indoor","costBand":[1.5,6.5]},{"id":"trip_ubud","pri":3,"air":"out","label":"Ubud for the day","sub":"You decide over there how long you stay.","cost":0,"dur":0,"from":420,"until":1020,"once":true,"if":"day==2 && !flag:halfday && home","noEvent":true,"noFriction":true,"do":["d2.target=ubud","flag:daytrip"],"next":"d2_transport","route":"canggu-ubud","roundTrip":true,"where":"road"},{"id":"trip_uluwatu","pri":3,"air":"out","label":"Uluwatu for the day","sub":"You decide over there how long you stay.","cost":0,"dur":0,"from":420,"until":1020,"once":true,"if":"day==2 && !flag:halfday && home","noEvent":true,"noFriction":true,"do":["d2.target=uluwatu","flag:daytrip"],"next":"d2_transport","route":"canggu-uluwatu","roundTrip":true,"where":"road"},{"id":"temple","art":"tanahlot","pri":2,"air":"out","label":"Visit Tanah Lot","sub":"A temple on a rock in the sea, the one on every postcard.","dur":180,"cost":6,"until":1110,"transit":true,"transitMin":80,"once":true,"do":[{"if":"has:shoes","do":["m.energy-=5"],"else":["m.energy-=12"]},"act1=temple","sc.culture+=1"],"next":[{"if":"!flag:met_npc1 && home","next":"act1_out"},{"next":"hub_out"}],"out":["The man at the gate wants a ticket, not a sarong: a hundred thousand rupiah. Nobody goes into the temple; you look at it from the shore, a thousand people and one python around you.",{"if":"time<600 || time>=960","text":"The tide is out, so you walk across the wet rock to the foot of it, where the sea has been at the stone for five hundred years.","else":"The tide is in, and the rock is an island again. You watch it from the shore like everyone else."}],"where":"road"},{"id":"yoga","art":"shala","pri":2,"air":"out","label":"Morning yoga class","dur":120,"cost":9,"from":390,"until":690,"do":["m.energy+=8","sc.comfort+=1","sc.nature+=1"],"out":"Twenty people, one rooster, one man who is extremely good at it. You are not. You are calmer anyway.","oncePerDay":true,"where":"indoor"},{"id":"market","art":"market","pri":2,"air":"out","label":"The morning market","dur":120,"cost":5,"from":390,"until":780,"once":true,"do":["m.social+=1","food:Canggu: fruit from the morning market","person:the woman at the market with a son in Sydney"],"out":"A sarong you will never wear, mangoes you will, and a conversation about Sydney.","where":"road"},{"id":"cowork","pri":0,"air":"in","label":"A morning in a coworking space","dur":165,"cost":5,"from":480,"until":1050,"if":"has:laptop","do":["sc.comfort+=1","m.energy-=5","phone=100","flag:laptop_used","evt:Worked a morning on holiday"],"out":"Three hours of email in a room full of people doing the same. Outside, Bali continues without you.","where":"indoor"},{"id":"pool","art":"guesthouse","pri":0,"air":"out","label":"The guesthouse pool","dur":120,"cost":0,"noFriction":true,"do":["act1=rest","sc.comfort+=1","m.energy+=10"],"next":[{"if":"!flag:met_npc1 && home","next":"act1_out"},{"next":"hub_out"}],"out":"The pool. A frangipani falls in. Nothing else happens, which is the point.","rest":true,"where":"water"},{"id":"massage","events":"handoff","art":"massage","pri":1,"air":"in","label":"Massage on the lane","dur":110,"cost":6,"do":[{"if":"hub.actions.massage<=1","do":["m.energy+=20"],"else":["m.energy+=8"]},"sc.comfort+=1"],"out":{"1":["An hour under someone's elbows. You walk out two centimetres taller.","The hour is spent looking down through the hole in the table at a pair of feet in flip-flops. Two of the toes never got painted."],"by":"hub.actions.massage","default":["The second one today does less. Your body noticed.","The hour is spent looking down through the hole in the table at a pair of feet in flip-flops. Two of the toes never got painted."]},"rest":true,"oncePerDay":true,"where":"indoor"},{"id":"walk","art":"dogs","pri":0,"air":"out","label":"Walk around","dur":105,"cost":0,"noFriction":true,"eventRate":0.6,"do":[{"if":"has:shoes","do":["m.energy-=1"],"else":["m.energy-=3"]},{"if":"phone<45 && has:powerbank && !flag:bankday","do":["phone=100","flag:bankday","evt:The phone was down to a quarter by mid-afternoon. The power bank, that brick, earned its place."]}],"out":{"by":"timeBand","morning":"Offerings being laid on every step, smoke, a rooster with opinions.","midday":"The heat is unreasonable. Villas, paddies, a shrine with fresh flowers, a scooter with a ladder on it.","afternoon":"Surfboards on scooters, dogs asleep in the exact middle of the road.","evening":"The lane lights up one bulb at a time. Every café has switched the music up.","night":"Scooters, a bar somewhere doing a cover of something, a rooster that has lost track of time.","default":"The lane, the paddies, the heat."},"rest":true,"where":"road"},{"id":"lunch","art":"warungcase","slot":"food","pri":2,"air":"in","label":"Lunch at a warung","sub":"A warung is a family kitchen with a glass case out front.","dur":75,"cost":2,"from":690,"until":"plan.lunchCloses","noFriction":true,"do":["m.energy+=8","bellyRisk+=0.2","food:Canggu: nasi campur at lunch","flag:ate_lunch"],"out":"Two euros of rice and ten things. The cat inspects your bag and finds it wanting.","oncePerDay":true,"rest":true,"where":"indoor"},{"id":"eat","art":"warungcase","slot":"food","pri":3,"air":"in","label":"Dinner","dur":0,"cost":0,"from":1050,"until":1320,"if":"home","noEvent":true,"noFriction":true,"do":["flag:ate1"],"next":"dinner","oncePerDay":true,"rest":true,"where":"indoor"},{"id":"cart","slot":"food","pri":1,"air":"out","label":"Nasi goreng from a cart","dur":80,"cost":2,"from":1140,"until":1350,"noFriction":true,"do":["m.energy+=5","bellyRisk+=0.25","food:Canggu: nasi goreng from a cart"],"out":"A plastic stool by the wok at night, and a dog waiting for the egg.","rest":true,"where":"road"},{"id":"bar","art":"nightout","slot":"night","pri":2,"air":"in","label":"A bar with a live band","dur":150,"cost":10,"from":1170,"until":1380,"if":"day==1 && home","do":["m.social+=2","m.energy-=15","person:a nurse from Manchester and two Argentinians","mem:A table of strangers and a band doing Wonderwall twice"],"out":"A table of strangers, a band doing Wonderwall for the second time, nobody minding.","oncePerDay":true,"noFriction":true,"where":"indoor"},{"id":"sleep","art":"guesthouse","slot":"bed","pri":3,"air":"in","label":"Back to the room. Sleep.","dur":0,"cost":0,"from":1170,"if":"day<3 && home","noEvent":true,"noFriction":true,"do":[{"if":"!flag:ate1","do":["m.energy-=5","evt:Skipped dinner"]},"unflag:ate1"],"next":[{"if":"day==1","next":"night1"},{"next":"d2_eve"}],"oncePerDay":true,"rest":true,"where":"home"}],"events":[{"id":"marta2","tag":"pos","w":400,"if":"flag:marta1 && !flag:marta2 && day>=2","mem":"Ran into Marta again, and the yellow raincoat","do":["flag:marta2","npc.marta+=1","m.social+=1","npc.tip=1","person:Marta, fourth time on the island, yellow raincoat"],"next":"npc_marta2"},{"id":"dog","art":"dogs","tag":"neutral","w":30,"text":"A dog that belongs to nobody walks with you for a hundred metres and leaves without comment.","mem":"A dog that belonged to nobody"},{"id":"canang","tag":"neutral","w":25,"text":"You step over a canang sari on the pavement. Then another. Then you start seeing them everywhere.","mem":"Started noticing the offerings on the pavement","art":"canangrow","only":true},{"id":"drone","tag":"neutral","w":15,"if":"timeBand==afternoon || timeBand==evening","text":"A drone hovers over the beach, filming a couple pretending not to be filmed.","mem":"A drone, a couple, a performance"},{"id":"gecko","tag":"neutral","w":15,"if":"timeBand==night","text":"A gecko the length of your forearm says TO-KEH from the wall, seven times. Lucky, apparently.","mem":"A tokek gecko, seven times"},{"id":"ceremony","tag":"neutral","w":12,"text":"The lane is closed for a ceremony: white and gold, gamelan from somewhere. You wait, gladly.","mem":"A ceremony closed the lane","do":["time+=20","sc.culture+=1"]},{"id":"jam","tag":"neg","w":30,"text":"The shortcut road jams solid. Ten minutes go nowhere.","mem":"Ten minutes in a scooter jam","do":["time+=10","m.energy-=3"]},{"id":"spit","tag":"neg","w":12,"if":"!flag:m_rain","text":"It spits for five minutes, then thinks better of it.","mem":"Five minutes of rain that changed its mind"},{"id":"cancel","tag":"neg","w":12,"if":"phone>0 && phone<40","text":"The phone dies mid-Grab. You walk the last stretch, asking twice.","mem":"Phone died mid-Grab","do":["phone=0","m.energy-=5","m.social+=1"]},{"id":"nomad","tag":"pos","w":25,"if":"timeBand!=night","text":"Someone at the next table asks where you are from. Twenty minutes later you have a surf tip and a name.","mem":"A stranger with a surf tip","do":["m.social+=1","person:Ana, from Lisbon, at the next table"]},{"id":"coconut","art":"coconut","tag":"pos","w":20,"text":"A cart sells you a coconut for fifteen thousand. It is the best thing you have had today.","mem":"A coconut from a cart","do":["spend:1"]},{"id":"lights","tag":"pos","w":12,"if":"flag:scooter_day","text":"At the lights a woman with a board rack asks where you are going, says \"same\", and rides with you.","mem":"Rode with a stranger from the traffic lights","do":["m.social+=1","person:Sam, from Melbourne, met at the traffic lights"]}]}},"ubud":{"name":"Ubud","blurb":"Jungle, temples, rice fields.","sub":"Inland. Roosters at dawn. Nothing happens, beautifully.","hotel":"a bungalow above a ravine on the edge of town","owner":"Ibu Sari","neighbors":["canggu","uluwatu"],"npc1":{"name":"Wayan","role":"a farmer on the ridge","gender":"m"},"npc2":{"name":"Priya","role":"six years in Ubud","place":"warung","item":"fan","gender":"f"},"arrive":"The road climbs and the green closes in on both sides. Roosters, incense, a man carrying a ladder on a scooter. Your bungalow sits above a ravine on the edge of town; the sound is water and insects and, somewhere, a gamelan practising. Ibu Sari brings tea you did not ask for and says breakfast is on the deck at eight.","act1":[{"k":"beach","label":"Campuhan ridge walk","sub":"A paved path along a ridge between two rivers. Twenty-five minutes.","do":["act1=beach","sc.nature+=1",{"if":"has:shoes","do":["m.energy-=3"],"else":["m.energy-=8"]}],"next":"act1_out","dur":90},{"k":"temple","label":"The water temple in town","sub":{"if":"has:sarong","text":"Lotus pond, carved gate, a queue for the same photo.","else":"Lotus pond, carved gate. No sarong: you rent one at the gate."},"do":["act1=temple","sc.culture+=1","m.energy-=5",{"if":"!has:sarong","do":["flag:rented_sarong","evt:Rented a sarong at the temple gate"]}],"next":"act1_out","dur":{"if":"has:sarong","text":90,"else":105},"cost":{"if":"has:sarong","text":0,"else":2}},{"k":"rest","label":"The deck above the ravine","sub":"Tea. Insects. Nothing.","do":["act1=rest","sc.comfort+=1","m.energy+=10",{"if":"!has:repellent","do":["m.energy-=3","flag:bitten"]}],"next":"act1_out","dur":60}],"act1_out":{"beach":{"text":["The ridge path is paved, narrow, and runs above two rivers you can hear but not see. Tall grass, a temple at the start, villas creeping up the far side. Every few minutes someone passes the other way and says hello, because on this path people say hello.",{"if":"!has:shoes","text":"In flip-flops the last steep bit is a small, sweaty negotiation with gravity. You do it anyway."}],"mem":"The Campuhan ridge walk"},"temple":{"text":["The water temple sits behind a lotus pond in the middle of town. The gate is carved within an inch of its life. You sit on the steps; a woman lays a small palm-leaf offering by your foot, lights the incense and moves on without looking at you.",{"if":"has:sarong","text":"The sarong is in the bag, so you tie it on at the gate and walk in with everyone else.","else":"Knees are knees: no sarong, so you rent one at the gate for two euros and queue twice."}],"mem":"Sat on the steps of the water temple"},"rest":{"text":[{"parts":["The deck hangs over the ravine. Tea. A gecko on the railing. Below, water over stones; above, a bird you will never identify.",{"if":"phone>0","text":" You do not check your phone for forty minutes. It is a record.","else":" The phone died hours ago and nobody here minds."}],"join":""},{"if":"!has:repellent","text":"When the light starts to go the mosquitoes find you. You do not find them.","else":"The mosquitoes come with the last of the light and go away again, offended by the repellent."}],"mem":"Forty minutes on the deck without a phone"}},"npc1_intro":{"beach":"Halfway along the ridge a man in a faded blue shirt is rebuilding a section of low wall, one stone at a time. He straightens up as you pass.\n\n\"From the bungalows down there? You walk fast. Nobody walks fast here. I am Wayan.\"","temple":"On the temple steps a man is arranging small palm-leaf offerings, a girl of about eight handing them to him one by one.\n\n\"You can take a photo,\" he says without looking up. \"Everybody does. Better if you sit a moment first. I am Wayan.\"","rest":"In the late afternoon the neighbour comes up the path with a bag of rambutan.\n\n\"For the new guest. I am Wayan. My wife says the ones from the market are old.\""},"npc1_a":{"q":"\"How long have you lived here?\"","a":"\"All my life. My father had this land, now it is my brother's and mine. Every year, one more villa.\" He points down the valley, without bitterness. \"Tomorrow, if you want rice terraces: not the famous one, it is a photo shop now. Go early to the small ones behind the village. My wife has a warung there. No sign, green door, next to the bale. Say Wayan.\"","q2":[["\"What should I order?\"","\"Jackfruit curry. She only makes it if someone asks.\" He picks up the next stone. \"And don't pay for the swing, the view is the same from the ground. If you buy a woven bag, not from the road — the real ones come from Tenganan, smoked over coconut husk. That is the smell. The road ones are from Java and they bend.\""],["\"Do you mind the tourists?\"","\"They pay for my daughter's school.\" He goes back to the wall. \"Also they walk in the middle of the road. Both things are true.\""]]},"npc1_b":["\"Thank you. It's beautiful up here.\"","\"Beautiful and expensive,\" he says, and laughs. \"Rice is cheaper in the supermarket now than to grow. And turn your outside light off at night — it brings a small orange-and-black beetle. Don't brush it off your arm. If you crush it on the skin it burns for a week.\" He goes back to the wall."],"npc1_c":"You nod, he nods. The sound of stone on stone follows you along the path for a while.","rain":{"roof":"a bale, the open pavilion by the road, where two old women are already sitting","roofShort":"a bale full of people looking out","under":"One of the women says something to the other and they both laugh at you, kindly. A boy on a bicycle goes past through the rain at full speed, not caring at all."},"dinner":{"warung":{"label":"A warung with a rooster on the sign","sub":"No menu. Ibu decides.","cost":2},"tourist":{"label":"The restaurant with the swing over the paddy","cost":13},"tip":{"label":"The green door, no sign, next to the bale","sub":"Wayan's wife. Jackfruit curry, if you ask.","cost":3}},"sunset":"There is no sea here, so the light goes gold across the paddies instead, and then the frogs start. Hundreds of them. Nobody on Instagram told you about the frogs. Then the geckos, then the insects, then it is properly dark and loud.","night_sound":"frogs","breakfast2":"Breakfast arrives on the deck: black rice porridge, fruit you cannot name, coffee with the grounds still in it.","events":[{"id":"monkeys","if":"phone>=30 && !flag:rainride","w":30,"text":"A troop of macaques crosses the road at their own pace. Everything stops. One sits on the mirror of the scooter in front and looks at its own reflection with enormous dignity. Nobody honks. In Ubud, the monkeys have right of way and everyone knows it.","mem":"Waited for a troop of monkeys to cross the road","do":["sc.nature+=1"]},{"id":"ceremony","if":"phone>=30 && !flag:rainride","w":25,"text":"The road is closed. A temple ceremony: the whole village in white and gold, women carrying towers of fruit on their heads, gamelan from somewhere you cannot see. You stop and watch. Thirty minutes. You do not mind at all.","mem":"Road closed for a temple ceremony. Waited, gladly.","do":["sc.culture+=1","evt:A ceremony closed the road"]},{"id":"quiet","if":"phone>=30 && !flag:rainride","w":20,"text":"For twenty minutes the road is completely empty: paddies, a shrine, a dog, more paddies. Somewhere around the second shrine you realise you have not said a word to anyone since breakfast, and that here that is normal, and that you are not sure yet how you feel about it.","mem":"Twenty minutes of empty road and nobody to talk to","do":["flag:lonely"]},{"id":"lost","if":"d2.transport==scooter && phone>=30 && !flag:rainride","w":25,"text":"The map sends you down a road that becomes a path that becomes someone's yard. A man waves you through his garden with the resignation of a person whose garden is on Google Maps. Chickens scatter. You are, eventually, exactly where you meant to be.","mem":"Google Maps sent you through a stranger's garden","do":["m.social+=1"]},{"id":"cancel","if":"d2.transport==driver && phone>=30","w":20,"text":"The driver is late, then later. When he comes, Pak Nyoman apologises for a ceremony that is not his fault and drives with the windows down so you can hear the frogs in the ditches, which he says are louder this year.","mem":"A late driver, and frogs in the ditches","do":["m.social+=1","person:Pak Nyoman, who knows about frogs"]},{"id":"cancel_dead","if":"d2.transport==driver && phone<30","w":100,"text":"You open the app at {phone}% and it dies mid-order. There is no one to flag down on a road this quiet; you walk to the football field, where a man asleep in a car says \"transport?\" before you have asked. Pak Nyoman. He has been waiting there since 2019, more or less.","mem":"Phone dead. Woke a driver by the football field.","do":["phone=0","m.social+=1","m.energy-=5","spend:5","person:Pak Nyoman, asleep by the football field","evt:Phone dead before the day had properly started. No adapter."]},{"id":"lost_dead","if":"d2.transport==scooter && phone<30","w":100,"text":"Maps dies at 6%, then 0%, at a junction with four identical green roads. You ask a woman with a basket, a man with a strimmer, a girl on a bicycle. Each says \"straight, then left\" and points somewhere different. Forty minutes late, you are there, and you have spoken more Indonesian than in the whole trip so far.","mem":"Phone dead, navigated by asking three strangers","do":["phone=0","m.social+=2","m.energy-=10","evt:Phone dead before the day had properly started. No adapter."]},{"id":"rain","if":"d2.transport==scooter && flag:rainride","w":100,"text":["It rains for the first twenty minutes, hard, the jungle steaming on both sides.",{"if":"has:jacket","text":"The jacket earns its place in the bag: wet legs, dry everything else.","else":"You are wet, then dry, in that order; everything here dries within the hour."}],"mem":"Rode the scooter through the morning rain","do":[{"if":"!has:jacket","do":["m.energy-=8"]}]}],"act2":[{"k":"terrace","label":{"if":"flag:halfday","text":"Walk the rice terraces","else":"Walk the rice terraces early"},"sub":{"if":"flag:halfday","text":"Too late for early. The light is better now anyway.","else":"Before the tour buses."},"do":["d2.act=terrace"],"next":"d2_price","dur":150},{"k":"monkey","label":"The Monkey Forest","sub":"Sacred, wild, keep your sunglasses on your face.","do":["d2.act=monkey"],"next":"d2_price","dur":120},{"k":"yoga","label":"Drop-in yoga class","sub":"Open-air shala above a river.","do":["d2.act=yoga"],"next":"d2_price","dur":90}],"price":{"terrace":{"text":"At the end of the path a woman sells sarongs: 200,000. In the market they are sixty. She has been here since six, with the ducks.","choices":[{"label":"Pay 200k","do":["sc.comfort+=1","d2.priceOut=You pay it. She folds the sarong into a plastic bag with a care that suggests it is not, to her, sixty thousand.","mem:Bought a sarong at the terraces, full price"],"next":"d2_act_out","cost":12},{"label":"Offer 100k","do":["sc.haggle+=1",{"random":[{"p":0.7,"do":["spend:-3","d2.priceOut=\"One-fifty.\" You both smile. Deal. She ties it on you to show how, then takes it off again and folds it.","mem:Haggled a sarong to 150k, both smiling"]},{"do":["spend:-12","d2.priceOut=\"Two hundred.\" She folds it back up. You leave without it and think about it for an hour.","mem:Tried to haggle a sarong, walked away, regretted it"]}]}],"next":"d2_act_out","cost":12,"paidBand":[0,9]},{"label":"No sarong today","do":["d2.priceOut=No sarong. She nods, unbothered; the next group is already coming up the path.","mem:Skipped the sarong"],"next":"d2_act_out","cost":0}]},"monkey":{"text":"Ticket: 80,000, fixed, a real price with a real turnstile. Outside, a man offers a \"guided tour, all the secrets\" for 200,000.","choices":[{"label":"Just the ticket","sub":"","do":["d2.priceOut=Just the ticket. The map on the back is enough."],"next":"d2_act_out","cost":5},{"label":"Take the guide","do":[{"random":[{"p":0.6,"do":["sc.culture+=1","m.social+=1","person:Gede, who grew up next to the Monkey Forest","d2.priceOut=His name is Gede, he grew up next to the forest, and he shows you where the monkeys sleep and which of the three temples is for the dead. Worth every rupiah.","mem:Gede's tour of the Monkey Forest, the real one"]},{"do":["sc.comfort-=1","d2.priceOut=He walks you the same loop as the signs, slightly faster, and tells you the monkeys are \"very naughty\" nine times.","mem:Paid for a Monkey Forest guide who read you the signs"]}]}],"next":"d2_act_out","cost":17},{"label":"Skip the forest, walk the road around it","do":["sc.nature+=1","sc.plan-=1","d2.skip=true","d2.priceOut=You skip the ticket and walk the road around the forest."],"next":"d2_act_out"}]},"yoga":{"text":"Drop-in: 150,000. The desk offers a three-class pass for 350,000. You leave tomorrow.","choices":[{"label":"Drop-in","do":["d2.priceOut=One class. The woman at the desk gives you a mat that smells faintly of everyone."],"next":"d2_act_out","cost":9},{"label":"The pass, why not","do":["sc.comfort+=1","d2.priceOut=The pass. You will use one third of it, and the card will live in your wallet for two years as a small monument to optimism.","mem:Bought a three-class yoga pass with one day left"],"next":"d2_act_out","cost":21},{"label":"Skip the studio. Stretch on the deck for free.","do":["sc.plan-=1","sc.comfort+=1","d2.skip=true","d2.priceOut=You skip the studio."],"next":"d2_act_out"}]}},"act2_out":{"terrace":{"text":[{"if":"flag:tip_npc1_a && home","text":"You take Wayan's advice and skip the famous one. The small terraces behind the village are empty except for a farmer, two ducks and the sound of water moving between levels. Two hours; nobody with a selfie stick. Across the valley you can see the famous swing, and the café beside it where the luwak lives in a cage by the till.","else":{"if":"time<540","text":"The famous terraces before the buses: a man setting out a DONATION 10K sign, the swing not yet running, and the terraces themselves real and beautiful and empty.","else":{"if":"time<960","text":"The famous terraces in the middle of the day: a queue for the swing, a queue for the photo spot, a man with a sign that says DONATION 10K. Behind the swing, if you keep walking, the terraces are real and beautiful and empty within four minutes.","else":"The famous terraces late on: the swing has stopped, the sign is coming in, and the last of the light is doing the thing everybody queued for."}}},{"if":{"not":"flag:tip_npc1_a && home"},"text":"Beside the swing, a café with an infinity pool sells coffee that has passed through a luwak. The luwak lives in a cage by the till. A cup costs more than lunch. It tastes like coffee."},{"if":"has:shoes","text":"In walking shoes the wet steps are easy.","else":"In flip-flops on wet stone you go slowly, which turns out to be the right speed, and your calves have opinions by lunch."},{"if":"!has:sunscreen","text":"By noon there is no shade on a terrace, and by evening the back of your neck knows it."}],"mem":"Walked the rice terraces","do":["sc.nature+=2",{"if":"has:shoes","do":["m.energy-=10"],"else":["m.energy-=18"]},{"if":"!has:sunscreen","do":["flag:sunburn","evt:Sunburn on the terraces. No sunscreen.","m.energy-=6"]},{"if":"flag:tip_npc1_a && home && region:ubud","do":["flag:used_tip"]}]},"monkey":{"text":{"if":"d2.skip","text":"You walk the road around the forest instead. Monkeys anyway, since they do not respect the ticket line, plus a warung, a woodcarver's yard and a view down into the trees that people inside are paying for from below.","else":["The forest is real forest: banyan roots, moss, three temples inside it. The monkeys are also real. One takes a water bottle from a man who was
