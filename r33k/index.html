html,body{height:100%;overflow:hidden;background:var(--sky);color:var(--ink);font-family:"Greycliff CF",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;top:max(14px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;pointer-events:none}
.pill{background:var(--glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:8px 14px;border-radius:999px;font-weight:700;font-size:15px;box-shadow:0 2px 10px rgba(27,42,74,.12)}
#hint{position:fixed;left:16px;right:16px;bottom:calc(max(26px,env(safe-area-inset-bottom)) + 96px);text-align:center;pointer-events:none;transition:opacity .8s}
#hint span{display:inline-block;background:var(--glass);padding:10px 16px;border-radius:14px;font-size:15px;font-weight:600}
#hint.fade{opacity:0}
.bottom{position:fixed;left:16px;right:16px;bottom:max(26px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px}
.card{background:var(--paper);border-radius:26px;padding:14px 16px;box-shadow:0 8px 30px rgba(27,42,74,.18);text-align:center;max-width:360px;width:100%}
.card p{font-size:15px;color:var(--muted);margin-bottom:12px;line-height:1.35}
.row{display:flex;gap:10px;justify-content:center}
button{font:inherit;font-weight:800;font-size:17px;border:0;border-radius:999px;padding:15px 26px;cursor:pointer;background:var(--accent);color:#fff;min-width:130px;transition:transform .1s ease,box-shadow .1s ease}
button:active{transform:scale(.96)}
#mapGo,#nextBtn,#removeBtn,#titleGo,#worldGo,#toWorld{background:linear-gradient(#FFD84A,#FFC400);color:#1B2A4A;font-size:18px;letter-spacing:.01em;box-shadow:0 5px 0 #D49B00,0 12px 24px rgba(27,42,74,.22)}
#mapGo:active,#nextBtn:active,#removeBtn:active,#titleGo:active,#worldGo:active,#toWorld:active{transform:translateY(4px);box-shadow:0 1px 0 #D49B00,0 6px 14px rgba(27,42,74,.2)}
button.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 #D6DCE6,0 8px 18px rgba(27,42,74,.12)}
button.ghost:active{transform:translateY(3px);box-shadow:0 1px 0 #D6DCE6}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.hide{display:none!important}
.card h2{font-size:19px;margin-bottom:6px}
.card .lead{font-size:14px;margin-bottom:6px}
.msg{font-weight:700;font-size:15px;margin-bottom:12px;padding:8px 10px;border-radius:10px}
.msg.good{background:#E3F8FD;color:#0E5E73}
.msg.warn{background:#FDF0DF;color:#8A4B06}
.msg.bad{background:#FCE6E2;color:#9A2A17}
button:disabled{opacity:.4;cursor:default}
.iconbtn{position:relative;width:74px;height:74px;min-width:0;padding:0;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 28%,#3A4E85,#1B2A4A 70%);border:3px solid #FFC800;box-shadow:0 5px 0 #0F1A33,0 12px 22px rgba(27,42,74,.35);touch-action:none}
.btnrow{display:flex;align-items:center;gap:14px}
.iconbtn.small{width:60px;height:60px;background:radial-gradient(circle at 35% 28%,#8A6440,#5E3F22 70%);border-color:#F2D3A0;box-shadow:0 4px 0 #3E2914,0 10px 18px rgba(27,42,74,.3)}
.iconbtn.active{outline:3px solid #FFC800;outline-offset:3px}
.iconbtn.carry{opacity:.45;transform:scale(.92)}
.badge{position:absolute;top:-4px;right:-4px;min-width:24px;height:24px;border-radius:12px;background:#FFC800;color:var(--ink);font-size:14px;font-weight:800;display:grid;place-items:center;border:2px solid #fff}
.tip{background:var(--glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:14px;padding:8px 12px;max-width:360px;text-align:center;box-shadow:0 2px 10px rgba(27,42,74,.12)}
.tip .msg{margin:0;padding:0;background:none!important;display:block}
.fbtn{position:fixed;left:0;top:0;width:50px;height:50px;min-width:0;padding:0;border-radius:50%;font-size:22px;font-weight:900;display:grid;place-items:center;border:3px solid #fff;box-shadow:0 4px 0 rgba(15,26,51,.25),0 8px 16px rgba(27,42,74,.3);z-index:5}
.fbtn.ok{background:#FFC800;color:#1B2A4A}
.fbtn.no{background:#fff;color:#1B2A4A}
.fbtn.off{opacity:.35;pointer-events:none}
#finger{position:fixed;left:50%;bottom:calc(max(26px,env(safe-area-inset-bottom)) + 24px);width:0;height:0;pointer-events:none;z-index:6}
#finger span{position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 0 0 6px rgba(255,255,255,.35),0 4px 12px rgba(27,42,74,.35);animation:drag 2.2s ease-in-out infinite}
@keyframes drag{0%{transform:translate(0,0);opacity:0}15%{opacity:1}70%{transform:translate(-40px,-210px);opacity:1}100%{transform:translate(-40px,-210px);opacity:0}}
@media (prefers-reduced-motion: reduce){#finger span{animation:none}}
#end{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:16px 16px max(26px,env(safe-area-inset-bottom));pointer-events:none;animation:pop .4s ease-out}
#end .card{padding:18px 18px;pointer-events:auto;max-width:340px}
#end .kick{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
#end h1{font-size:30px;margin:4px 0 4px}
#end .big{font-size:16px;font-weight:700;color:var(--ink);margin-bottom:12px}
#end .col{display:flex;flex-direction:column;gap:10px;align-items:center}
#end .col button{min-width:200px}
#map{position:fixed;inset:0;z-index:10;pointer-events:none}
#map .mapTop,#world .mapTop,#map .mapBottom button,#toast,#regionDone,#world .mapBottom button{pointer-events:auto}
#world{position:fixed;inset:0;z-index:10;pointer-events:none}
body.titlemode #world .mapBottom,body.titlemode #world .mapTop{display:none}
.mapTop{align-items:center}
.rbtn{width:46px;height:46px;min-width:0;padding:0;border-radius:50%;background:rgba(255,255,255,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 3px 0 rgba(27,42,74,.12),0 6px 16px rgba(27,42,74,.16);display:grid;place-items:center}
.strip{display:flex;flex-direction:column;align-items:center;gap:6px;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:8px 18px 10px;border-radius:18px;box-shadow:0 3px 0 rgba(27,42,74,.1),0 6px 16px rgba(27,42,74,.14)}
.strip b{font-size:15px;letter-spacing:.02em;color:#1B2A4A}
#dots{display:flex;gap:7px}
#dots i{width:12px;height:12px;border-radius:50%;background:#D9DDE5;box-shadow:inset 0 1px 2px rgba(27,42,74,.2)}
#dots i.on{background:#FFC800;box-shadow:0 0 0 2px rgba(255,200,0,.3)}
#regionDone{position:absolute;left:16px;right:16px;margin:0 auto;bottom:max(26px,env(safe-area-inset-bottom));max-width:340px}
#regionDone h2{font-size:20px}
.gift{position:relative;margin:0 0 14px;padding:14px 12px 12px;border-radius:16px;background:#FFF6D6;border:2px dashed #FFC800;text-align:center}
.gift small{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#8A6A00;margin-bottom:4px}
.gift b{display:block;font-size:19px;line-height:1.22;color:#1B2A4A}
.gtag{position:absolute;top:-11px;right:12px;background:#1B2A4A;color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
body.mapmode .bottom,body.mapmode #homeBtn,body.mapmode #hintBtn,body.mapmode #hint,body.mapmode #finger,body.mapmode .fbtn{display:none!important}
#title{position:fixed;inset:0;z-index:14;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:16vh 16px max(40px,env(safe-area-inset-bottom));background:linear-gradient(rgba(233,227,209,.15),rgba(233,227,209,.0) 40%,rgba(233,227,209,.55))}
#title h1{font-size:clamp(72px,22vw,140px);font-weight:900;letter-spacing:-.03em;color:#FFC800;text-shadow:0 6px 0 #1B2A4A,0 16px 34px rgba(27,42,74,.35);line-height:1}
#title .sub{margin-top:14px;font-size:20px;font-weight:800;color:#1B2A4A;text-align:center}
#title button{min-width:220px}
#restartBtn{position:fixed;top:max(14px,env(safe-area-inset-top));left:72px;width:46px;height:46px;min-width:0;padding:0;border-radius:50%;background:rgba(255,255,255,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 3px 0 rgba(27,42,74,.12),0 6px 16px rgba(27,42,74,.16);display:grid;place-items:center;z-index:9}
body.mapmode #restartBtn{display:none!important}
#confirm{position:fixed;inset:0;z-index:16;display:flex;align-items:center;justify-content:center;background:rgba(27,42,74,.25);padding:16px}
#confirm .card h2{margin-bottom:14px}
#tapFinger{position:fixed;left:0;top:0;width:0;height:0;pointer-events:none;z-index:7}
#tapFinger b{position:absolute;left:-25px;top:-14px;filter:drop-shadow(0 4px 6px rgba(27,42,74,.35));transform-origin:25px 14px}
.tring{position:fixed;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:4px solid #FFC800;box-shadow:0 0 0 2px rgba(27,42,74,.25);pointer-events:none;z-index:6;animation:tring .6s ease-out forwards}
@keyframes tring{0%{transform:scale(.45);opacity:1}100%{transform:scale(1.25);opacity:0}}
.iconbtn.ready{animation:ready 1.1s ease-in-out infinite}
@keyframes ready{50%{box-shadow:0 0 0 10px rgba(255,200,0,.45),0 5px 0 #0F1A33,0 12px 22px rgba(27,42,74,.35)}}
.fly{position:fixed;left:0;top:0;width:56px;height:56px;display:grid;place-items:center;z-index:12;pointer-events:none;transition:transform .65s cubic-bezier(.5,-0.2,.6,1)}
.fly svg{width:44px;height:44px}
.iconbtn.wait{opacity:.5}
.iconbtn.bump{animation:bump .45s ease-out}
@keyframes bump{40%{transform:scale(1.25)}}
.btnrow.pop{animation:pop .45s ease-out}
.g5{font-weight:900;font-size:27px;letter-spacing:-.02em;color:#FFC800;line-height:1}
#hintBtn{position:fixed;top:max(14px,env(safe-area-inset-top));left:128px;width:46px;height:46px;min-width:0;padding:0;border-radius:50%;background:rgba(255,255,255,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 3px 0 rgba(27,42,74,.12),0 6px 16px rgba(27,42,74,.16);display:grid;place-items:center;z-index:9}
#hintBtn.pop{animation:hint 1.2s ease-in-out infinite}
@keyframes hint{50%{box-shadow:0 0 0 8px rgba(255,200,0,.35),0 6px 16px rgba(27,42,74,.16)}}
#itemBox.empty .iconbtn{opacity:.38;filter:grayscale(.85)}
#mapSvg{position:absolute;inset:0;width:100%;height:100%;display:block}
.mapTop{position:absolute;top:max(14px,env(safe-area-inset-top));left:16px;right:74px;display:flex;justify-content:space-between}
.mapBottom{position:absolute;left:16px;right:16px;bottom:max(26px,env(safe-area-inset-bottom));display:flex;justify-content:center}
.mapBottom button{min-width:220px;box-shadow:0 6px 18px rgba(27,42,74,.3)}
.vil{cursor:pointer}
.pulse.p2{animation-delay:.8s}
.cloudy{animation:drift 5s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(7px)}}
.blink{animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
#muteBtn,#homeBtn{position:fixed;top:max(14px,env(safe-area-inset-top));width:46px;height:46px;min-width:0;padding:0;border-radius:50%;background:rgba(255,255,255,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 3px 0 rgba(27,42,74,.12),0 6px 16px rgba(27,42,74,.16);display:grid;place-items:center}
#muteBtn{right:16px;z-index:15}
#homeBtn{left:16px;z-index:9}
#muteBtn .x{display:none}
#muteBtn.off .w{display:none}
#muteBtn.off .x{display:inline}
.pulse{animation:pulse 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.4s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
#toast{position:fixed;z-index:15;left:50%;bottom:calc(max(26px,env(safe-area-inset-bottom)) + 76px);transform:translateX(-50%);background:#1B2A4A;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:15px;white-space:nowrap}
@media (prefers-reduced-motion: reduce){.pulse,.draw,.cloudy,.blink{animation:none;stroke-dashoffset:0}}
#hintAsk{position:fixed;top:calc(max(14px,env(safe-area-inset-top)) + 9px);left:186px;z-index:9;background:#1B2A4A;color:#fff;font-weight:800;font-size:14px;padding:6px 11px;border-radius:12px;pointer-events:none;animation:pop .3s ease-out}
#hintAsk:before{content:"";position:absolute;left:-6px;top:50%;margin-top:-6px;border:6px solid transparent;border-left:0;border-right-color:#1B2A4A}
#hintBtn.nudge{animation:nudge .9s ease-out}
@keyframes nudge{0%,100%{transform:none}18%{transform:translateY(-9px) scale(1.14)}36%{transform:none}54%{transform:translateY(-4px) scale(1.06)}72%{transform:none}}
#swipeHint{position:fixed;left:0;right:0;top:30%;z-index:7;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;animation:pop .35s ease-out}
#swipeHint .sw{position:relative;width:140px;height:96px}
#swipeHint .arr{position:absolute;left:10px;top:0}
#swipeHint b{position:absolute;left:45px;top:30px;filter:drop-shadow(0 4px 6px rgba(27,42,74,.35));animation:swipe 1.8s ease-in-out infinite}
@keyframes swipe{0%,100%{transform:translateX(-38px)}50%{transform:translateX(38px)}}
#swipeHint span{background:rgba(255,255,255,.92);color:#1B2A4A;font-weight:800;font-size:16px;padding:8px 14px;border-radius:14px;box-shadow:0 4px 14px rgba(27,42,74,.18)}
body.mapmode #swipeHint,body.mapmode #hintAsk,body.mapmode #think,body.mapmode #tapFinger,body.mapmode .tring{display:none!important}
#think{position:fixed;left:0;top:0;z-index:7;pointer-events:none}
#think svg{display:block;filter:drop-shadow(0 3px 6px rgba(27,42,74,.25));animation:pop .3s ease-out;transform-origin:8px 52px}
#fps{position:fixed;right:10px;bottom:6px;font-size:11px;color:rgba(27,42,74,.55);pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud hide"><div class="pill" id="lvlPill">Bölüm 1</div><div class="pill" id="count">Kule 0/1</div></div>
<div id="hint"><span></span></div>

  <div id="placeCard" class="tip hide"><span id="placeMsg" class="msg"></span></div>

      <svg viewBox="0 0 48 48" width="30" height="30" fill="none" aria-hidden="true"><path d="M17 6v36M31 6v36" stroke="#D9A066" stroke-width="3.4" stroke-linecap="round"/><path d="M17 12h14M17 20h14M17 28h14M17 36h14" stroke="#D9A066" stroke-width="3" stroke-linecap="round"/></svg>

<div id="finger" class="hide"><span></span></div>

</div></div>

  <div class="mapTop"><button id="worldBack" class="rbtn" aria-label="Dünya haritası"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#1B2A4A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><div class="strip"><b>1. Bölge</b><span id="dots"><i></i><i></i><i></i><i></i><i></i></span></div><span style="width:46px"></span></div>

</div>

<div id="confirm" class="hide"><div class="card"><h2>Baştan başlansın mı?</h2><div class="row"><button id="confirmNo" class="ghost">Vazgeç</button><button id="confirmYes">Evet</button></div></div></div>
<div id="tapFinger" class="hide"><b><svg viewBox="0 0 64 72" width="56" height="63" aria-hidden="true"><path d="M14 13a12 12 0 0 1 22 0M8 10a19 19 0 0 1 34 0" fill="none" stroke="#FFC800" stroke-width="3.5" stroke-linecap="round"/><path d="M25 14a5 5 0 0 1 5 5v19l9-1.6c1-.2 2 .1 2.8.7l1 .8a5 5 0 0 1 9 2.4l.1.7a5 5 0 0 1 7.2 4l.9 8.5c.6 5.6-1.3 11.2-5.2 15.3L52 71H30L18.5 55.3a5 5 0 0 1 7.5-6.6l-6-.1V19a5 5 0 0 1 5-5z" fill="#fff" stroke="#1B2A4A" stroke-width="3" stroke-linejoin="round"/></svg></b></div>
<button id="hintBtn" class="hide" aria-label="İpucu"><span class="badge hide" id="hintNum" style="top:-6px;right:-10px;min-width:30px;font-size:12px"></span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#1B2A4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z" fill="#FFC800"/></svg></button>
<div id="title" class="hide"><div style="text-align:center"><h1>Reach</h1></div><button id="titleGo">Başla</button></div>
<div id="world" class="hide"><div class="mapTop"><button id="worldHome" class="rbtn" aria-label="Ana ekran"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#1B2A4A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><div class="strip"><b>1 / 7</b></div><span style="width:46px"></span></div><div class="mapBottom"><button id="worldGo">Oyna</button></div></div>
