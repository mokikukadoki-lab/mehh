told not to carry a water bottle.","You take thirty phone photos of monkeys. In all of them the monkey is looking at something else."]},"mem":{"if":"d2.skip","text":"Walked around the Monkey Forest instead of through it","else":"The Monkey Forest, sunglasses intact"},"do":["m.energy-=10",{"if":"!d2.skip","do":["sc.nature+=1","sc.culture+=1",["photos:30"]]}]},"yoga":{"text":{"if":"d2.skip","text":"Twenty minutes of stretching on the deck with the ravine below. A rooster supervises. It is, honestly, most of what the class would have been, minus the man who was extremely good at it.","else":"An open shala above a river. Twenty-two people, mostly women, one man who is extremely good at it. You are not. The teacher says \"let go of the day\" and a rooster agrees. By the end you are calmer than you have been in a month, or asleep; you are not sure which."},"mem":{"if":"d2.skip","text":"Stretched on the deck instead of the yoga class","else":"A yoga class above a river"},"do":["m.energy+=8",{"if":"!d2.skip","do":["sc.comfort+=1","sc.nature+=1"]}]}},"npc2_intro":"A woman is correcting a stack of handwritten forms. She looks up.\n\n\"Yoga teacher training applications. I've read the words 'find myself' forty times today. Priya. Sit, you're blocking the fan.\"","npc2_a":"\"Check out the villages. Penestanan, Sayan, anywhere you hear roosters. The centre is for buying things. Ubud is what happens on the walk between two warungs. And if you're invited to a ceremony, go.\" She squares the forms. \"Ubud Market before half seven, or don't bother. After that it's the same building at different prices and you won't be able to tell.\"","npc2_b":"\"Came for a training in 2020, the borders shut, I was the last person on the course. Nothing spiritual. I just noticed I wasn't in a hurry any more, and I hadn't not been in a hurry since I was nine.\" She looks out at the valley. \"The irrigation up there is a thousand years old and it's losing to swimming pools. And I'm still here, so.\"","npc2_c":"\"Fair enough.\" She passes you the fan remote without looking up. The next form says \"find myself\" again.","eve":{"quietSub":"","outSub":"The night market, then a jazz café.","outCost":10,"quietSound":"Frogs, then more frogs, then something large moving in the ravine that is definitely a bird.","outText":"The night market: satay smoke, corn, a man selling kites at night for some reason. Then a jazz café where a Balinese trio does the standards better than the band at home. You talk to nobody and feel part of something anyway.","outMem":"The night market, then a jazz trio","outPeople":""},"d3":{"breakfast":"Ibu Sari brings the porridge and asks, gently, what time the flight is.","restSub":"Slow breakfast, deck, nothing at all.","exploreSub":{"if":"has:shoes","text":"Sunrise on the ridge, then whatever the village is doing.","else":"Sunrise on the ridge in flip-flops, slowly, then whatever the village is doing."},"restOut":"You do nothing, expertly. The deck, the porridge, a gecko you have started to think of as yours. Below, the river goes on with its day.","exploreOut":["The ridge at dawn is a different place: mist in the valleys, a farmer already at the wall, the whole thing lit from the side.",{"if":"!has:shoes","text":"The stone is wet and the flip-flops are a liability; you take them off and walk the last part barefoot, which the farmer finds very funny."},"On the way back, the village is dressing a temple in yellow cloth for something that is happening tomorrow, and nobody minds you watching."],"exploreMem":"The ridge at dawn, the village dressing a temple","npc1Bye":"Wayan's daughter runs up the path with a small woven basket: three flowers, a little rice, a stick of incense. \"For your trip,\" she says, in English she has clearly practised. You will carry it through two airports.","npc1ByeMem":"Wayan's daughter brought an offering for the trip","road":"The road down from the hills is empty until it isn't, and then it is Denpasar."},"tips":{"npc1a":{"a":"","b":""},"npc1b":{"a":"tip:Tomcat | Lights off at night, and never crush the orange-and-black beetle on your skin. | Wayan","b":""},"npc1q2":{"a":"tip:Tenganan | Where the real woven bags are made. Smoke-cured; the road ones bend. | Wayan"},"npc2a":{"a":"tip:Penestanan | The village side, quieter than central Ubud. | Priya","b":"tip:Pasar Ubud | Before half seven it is a real market. After, it is a different one. | Priya"},"npc1intro":{"a":""}},"hub":{"friction":20,"eventRate":0.45,"actions":[{"id":"ridge","art":"ridge","pri":3,"air":"out","label":"The Campuhan ridge walk","sub":"A paved path along a ridge between two rivers you can hear but not see.","dur":140,"cost":0,"until":1110,"do":["act1=beach","sc.nature+=1",{"if":"has:shoes","do":["m.energy-=3"],"else":["m.energy-=8"]},{"if":"!has:sunscreen && timeBand==midday","do":["m.energy-=4","flag:sunburn"]},{"if":"phone<45 && has:powerbank && !flag:bankday","do":["phone=100","flag:bankday","evt:The phone hit single digits out on the coast. The power bank, that brick, earned its place."]}],"next":[{"if":"!flag:met_npc1 && home","next":"act1_out"},{"next":"hub_out"}],"out":{"2":"The same path, earlier, with mist still in the valley and nobody on it.","by":"done.act:ridge","default":"Tall grass, two rivers, villas creeping up the far side, and everyone saying hello because on this path people say hello."},"where":"road"},{"id":"watertemple","art":"watertemple","pri":2,"air":"out","label":"Visit the water temple in town","sub":{"if":"has:sarong","text":"Lotus pond, a gate carved within an inch of its life, a queue for the same photograph.","else":"Lotus pond, a gate carved within an inch of its life, and a dress code you have not thought about yet."},"dur":120,"cost":{"if":"has:sarong","text":3,"else":0},"from":420,"until":1080,"once":true,"do":["m.energy-=5",{"if":"phone<45 && has:powerbank && !flag:bankday","do":["phone=100","flag:bankday","evt:The phone was down to a quarter by mid-afternoon. The power bank, that brick, earned its place."]},{"if":"has:sarong","do":["act1=temple","sc.culture+=1"]}],"next":[{"if":"!has:sarong","next":"temple_gate"},{"if":"!flag:met_npc1 && home","next":"act1_out"},{"next":"hub_out"}],"out":["The temple sits behind a lotus pond in the middle of town, and the town does not stop for it.",{"if":"has:sarong","text":"You tie the sarong on at the steps and sit a while, which is the part nobody photographs.","else":"Two euros for a sarong at the gate, and you sit a while anyway, which is the part nobody photographs."}],"where":"road","costBand":[0,7]},{"id":"terraces","art":"terraces","pri":3,"air":"out","label":{"if":"region:ubud && flag:tip_npc1_a","text":"The small terraces behind the village","else":"Walk the rice terraces"},"sub":{"if":"region:ubud && flag:tip_npc1_a","text":"Not the famous one. Wayan's: no sign, no swing, a green door and two ducks.","else":"The famous ones. A queue for the swing, a queue for the photograph, and real terraces four minutes further on."},"dur":210,"cost":0,"from":390,"until":1050,"once":true,"transit":true,"transitMin":50,"do":["d2.act=terrace",{"if":"phone<45 && has:powerbank && !flag:bankday","do":["phone=100","flag:bankday","evt:The phone hit single digits out on the coast. The power bank, that brick, earned its place."]}],"next":"d2_price","where":"road","costBand":[0,12]},{"id":"monkey","art":"monkeyforest","pri":2,"air":"out","label":"The Monkey Forest","sub":"Sacred, wild, and full of animals who have worked out what sunglasses are worth.","dur":165,"cost":0,"from":480,"until":1020,"once":true,"do":["d2.act=monkey"],"next":"d2_price","where":"road","costBand":[0,17]},{"id":"yoga","art":"shala","pri":2,"air":"out","label":"Drop-in yoga above the river","dur":150,"cost":0,"from":390,"until":1020,"once":true,"do":["d2.act=yoga"],"next":"d2_price","where":"indoor","costBand":[0,21]},{"id":"trip_canggu","pri":3,"air":"out","label":"Canggu for the day","sub":"You decide over there how long you stay.","cost":0,"dur":0,"from":420,"until":1000,"once":true,"if":"day==2 && !flag:halfday && home","noEvent":true,"noFriction":true,"do":["d2.target=canggu","flag:daytrip"],"next":"d2_transport","route":"ubud-canggu","roundTrip":true,"where":"road"},{"id":"trip_uluwatu","pri":2,"air":"out","label":"Uluwatu for the day","sub":"A long day whichever way you cut it.","cost":0,"dur":0,"from":390,"until":900,"once":true,"if":"day==2 && !flag:halfday && home","noEvent":true,"noFriction":true,"do":["d2.target=uluwatu","flag:daytrip"],"next":"d2_transport","route":"ubud-uluwatu","roundTrip":true,"where":"road"},{"id":"market_u","art":"market","pri":2,"air":"out","label":"Walk the market before the tourists","sub":"Early on it is a food market for the village. Later it is sarongs and wooden cats.","dur":120,"cost":5,"from":360,"until":690,"once":true,"do":["m.social+=1","sc.culture+=1","food:Ubud: fruit and a jaja from the morning market","person:the woman who sells snake fruit and would not let you pay the first price"],"out":"Snake fruit, a banana leaf packet you eat standing up, and a woman who refuses to let you pay what you first offered.","where":"road"},{"id":"legong","art":"legong","slot":"night","pri":2,"air":"in","label":"Legong dance at the palace","sub":"Gamelan, gold, and eye movements that took eleven years to learn.","dur":150,"cost":8,"from":1050,"until":1290,"once":true,"do":["sc.culture+=2","m.energy-=8","mem:Legong at the palace, and the eyes"],"out":"The gamelan is louder than you expected and the dancers' eyes do most of the work. Behind you, a man films the whole thing vertically.","where":"indoor"},{"id":"deck","art":"deck","pri":0,"air":"out","label":"The deck above the ravine","dur":115,"cost":0,"noFriction":true,"do":["act1=rest","sc.comfort+=1","m.energy+=12"],"next":[{"if":"!flag:met_npc1 && home","next":"act1_out"},{"next":"hub_out"}],"out":"Water, insects, a gamelan practising somewhere below. Ibu Sari brings tea without being asked.","rest":true,"where":"home"},{"id":"warung_u","art":"warungcase","pri":1,"air":"in","label":"A café over the paddies","dur":120,"cost":4,"from":420,"until":1140,"do":["m.energy+=5",{"if":"has:laptop","do":["phone=100","sc.comfort+=1","flag:laptop_used"],"else":["phone+=30"]}],"out":["Coffee, paddies, one duck doing laps.",{"if":"has:laptop","text":"You take the table with the plug, answer four emails and leave with a full battery and the faint sense of having been at work.","else":"The phone gets half an hour on the only plug, which is half an hour of somebody else's playlist."}],"rest":true,"oncePerDay":true,"where":"indoor"},{"id":"massage_u","events":"handoff","art":"massage","pri":1,"air":"in","label":"Massage behind the green door","dur":110,"cost":7,"do":[{"if":"hub.actions.massage_u<=1","do":["m.energy+=20"],"else":["m.energy+=8"]},"sc.comfort+=1"],"out":{"1":["An hour of being folded by someone who knows exactly which bit hurts. You walk out taller.","The hour is spent looking down through the hole in the table at a pair of feet in flip-flops. Two of the toes never got painted."],"by":"hub.actions.massage_u","default":["The second one today does less. Your body noticed.","The hour is spent looking down through the hole in the table at a pair of feet in flip-flops. Two of the toes never got painted."]},"rest":true,"oncePerDay":true,"where":"indoor"},{"id":"walk_u","pri":0,"air":"out","label":"Walk the lanes","dur":105,"cost":0,"noFriction":true,"eventRate":0.6,"do":[{"if":"has:shoes","do":["m.energy-=1"],"else":["m.energy-=3"]},{"if":"phone<45 && has:powerbank && !flag:bankday","do":["phone=100","flag:bankday","evt:The phone was down to a quarter by mid-afternoon. The power bank, that brick, earned its place."]}],"out":{"by":"timeBand","morning":"Offerings on every step, smoke, a man carrying a ladder on a scooter, roosters with an agenda.","midday":"Green, wet heat, a stonemason's yard, three dogs asleep in the shade of one wall.","afternoon":"Schoolchildren in white, a ceremony being assembled in a side yard, someone's gamelan practice.","evening":"The light goes gold across the paddies and then the frogs start, hundreds of them, all at once.","night":"Frogs, geckos, a motorbike, a warung with one bulb and four plastic chairs.","default":"Lanes, paddies, the smell of incense and cut grass."},"rest":true,"where":"road"},{"id":"lunch_u","art":"warungcase","slot":"food","pri":2,"air":"in","label":"Lunch at a warung","sub":"No menu. Ibu decides, and Ibu is right.","dur":75,"cost":2,"from":690,"until":"plan.lunchCloses","noFriction":true,"do":["m.energy+=8","bellyRisk+=0.15","food:Ubud: nasi campur, no menu, Ibu decided","flag:ate_lunch"],"out":"Rice, jackfruit curry, something fried, something green and alarming. Two euros, and the best thing you eat all week.","oncePerDay":true,"rest":true,"where":"indoor"},{"id":"eat_u","art":"warungcase","slot":"food","pri":3,"air":"in","label":"Dinner","dur":0,"cost":0,"from":1050,"until":1290,"if":"home","noEvent":true,"noFriction":true,"do":["flag:ate1"],"next":"dinner","oncePerDay":true,"rest":true,"where":"indoor"},{"id":"nightmarket","art":"market","slot":"food","pri":1,"air":"out","label":"Satay at the night market","dur":90,"cost":3,"from":1110,"until":1320,"noFriction":true,"do":["m.energy+=5","bellyRisk+=0.2","food:Ubud: satay and corn at the night market","m.social+=1"],"out":"Satay smoke in your clothes for two days, corn blackened on the edges, and a kite you nearly buy.","rest":true,"where":"road"},{"id":"sleep","art":"guesthouse","slot":"bed","pri":3,"air":"in","label":"Back to the bungalow. Sleep.","dur":0,"cost":0,"from":1140,"if":"day<3 && home","noEvent":true,"noFriction":true,"do":[{"if":"!flag:ate1","do":["m.energy-=5","evt:Skipped dinner"]},"unflag:ate1"],"next":[{"if":"day==1","next":"night1"},{"next":"d2_eve"}],"oncePerDay":true,"rest":true,"where":"home"}],"events":[{"id":"marta2","tag":"pos","w":400,"if":"flag:marta1 && !flag:marta2 && day>=2","mem":"Ran into Marta again, and the yellow raincoat","do":["flag:marta2","npc.marta+=1","m.social+=1","npc.tip=1","person:Marta, fourth time on the island, yellow raincoat"],"next":"npc_marta2"},{"id":"macaques","tag":"neutral","w":28,"text":"A troop of macaques crosses the lane at their own pace. Everything stops. Nobody honks. Here, the monkeys have right of way and everyone knows it.","mem":"Waited for the monkeys to cross","do":["time+=10","sc.nature+=1"]},{"id":"offerings_u","tag":"neutral","w":24,"text":"A woman lays a canang on a step, then on a wall, then on the seat of a parked scooter, as if watering plants.","mem":"Offerings on a step, a wall, a scooter seat"},{"id":"gamelan","tag":"neutral","w":20,"if":"timeBand==afternoon || timeBand==evening","text":"A gamelan rehearsal starts up behind a wall: twenty men, one of them fourteen and better than the rest. It goes on for an hour.","mem":"A gamelan rehearsal behind a wall","do":["sc.culture+=1"]},{"id":"frogs","tag":"neutral","w":18,"if":"timeBand==night","text":"The frogs start. Hundreds of them, all at once, and then something large in the ravine that is almost certainly a bird.","mem":"The frogs, all at once, and something in the ravine"},{"id":"procession","tag":"neutral","w":14,"text":"The road closes. A ceremony: the whole village in white and gold, women carrying towers of fruit on their heads, gamelan behind. You stand still for twenty minutes and are glad of it.","mem":"A procession closed the road, white and gold","do":["time+=20","sc.culture+=2"]},{"id":"buses","tag":"neg","w":26,"if":"timeBand==midday || timeBand==afternoon","text":"Four tour buses arrive at once on a road built for one. Nothing moves for a quarter of an hour.","mem":"Fifteen minutes behind four tour buses","do":["time+=15","m.energy-=3"]},{"id":"drizzle","tag":"neg","w":14,"if":"!flag:m_rain","text":"It rains for eight minutes with the sun still out, which here is not even weather.","mem":"Eight minutes of sunlit rain"},{"id":"steps","tag":"neg","w":14,"if":"!has:shoes","text":"A short cut turns out to be ninety wet stone steps. In flip-flops it becomes a negotiation with gravity.","mem":"Ninety wet steps in flip-flops","do":["m.energy-=6"]},{"id":"teacher","tag":"pos","w":24,"if":"timeBand!=night","text":"Someone at the next table has been here nine months and tells you, unprompted, which of the four things you were going to do is not worth it.","mem":"Told which of four things to skip","do":["m.social+=1","person:a yoga teacher from Bristol who has been here nine months"]},{"id":"invited","tag":"pos","w":16,"text":"A man at a gate waves you in. It is his family compound and there is a ceremony and there is, apparently, always room for one more.","mem":"Waved into a family compound for a ceremony","do":["time+=25","m.social+=1","sc.culture+=2","person:Pak Nyoman, who waved you in off the lane"]},{"id":"rambutan","tag":"pos","w":18,"text":"A boy on a wall hands you two rambutan without a word and goes back to his wall.","mem":"Two rambutan from a boy on a wall"}]}},"uluwatu":{"name":"Uluwatu","blurb":"Cliffs, surf, sunset.","sub":"On the Bukit peninsula. You will want a scooter.","hotel":"a family homestay on a cliff lane","owner":"Ibu Ketut","neighbors":["canggu","ubud"],"npc1":{"name":"Made","role":"who rents boards at the beach","gender":"m"},"npc2":{"name":"Rafa","role":"runs a surf camp on the Bukit","place":"warung","item":"coffee","gender":"f"},"arrive":"The car winds up onto the Bukit, where the road runs along the tops of cliffs and every gap in the trees is a piece of ocean. Your homestay is a family compound on a cliff lane, ten minutes on foot from anything. Ibu Ketut hands you a key, a sarong \"for the temple\", and a flyer for her nephew's scooter rental.","act1":[{"k":"beach","label":"Padang Padang beach","sub":"A narrow beach through a gap in the rock. Fifteen minutes by scooter taxi,","do":["act1=beach","sc.beach+=1","m.energy-=8",{"if":"!has:flipflops","do":["m.energy-=5","flag:hotsand"]}],"next":"act1_out","cost":2,"dur":120},{"k":"temple","label":"Uluwatu temple","sub":{"if":"has:sarong","text":"On the cliff. Monkeys, professional ones.","else":"Cliff, monkeys, a small temple on the edge. No sarong: you rent one at the gate."},"do":["act1=temple","sc.culture+=1","spend:3","m.energy-=10",{"if":"!has:sarong","do":["flag:rented_sarong","evt:Rented a sarong at the temple gate"]}],"next":"act1_out","dur":{"if":"has:sarong","text":120,"else":135},"cost":{"if":"has:sarong","text":0,"else":2}},{"k":"rest","label":"Rest at the homestay","sub":"The sea is below you. That is enough for now.","do":["act1=rest","sc.comfort+=1","m.energy+=10",{"if":"!has:repellent","do":["m.energy-=3","flag:bitten"]}],"next":"act1_out","dur":60}],"act1_out":{"beach":{"text":["Padang Padang: down a flight of steps, through a gap in the rock barely wider than you, and out onto a small, perfect beach with a serious wave at the end of it. A monkey sits on the steps and watches you like a bouncer.",{"if":"flag:hotsand","text":{"if":"timeBand==midday || timeBand==afternoon","text":"The sand is a hotplate and you cross it in a series of small jumps, watched by the monkey, who has seen this before.","else":"The sand is bearable at this hour, which it will not be later, and the monkey watches you cross it anyway."},"else":"The water is warmer than the air."}],"mem":"Padang Padang through the gap in the rock"},"temple":{"text":["The temple sits on the edge of a seventy-metre cliff. The monkeys sit on the edge of the wall and watch the tourists for sunglasses. You keep yours on your face, as instructed by everyone, and walk the cliff path with the sea roaring below and nothing between you and Africa.",{"if":"!has:shoes","text":"The path is uneven and long; in flip-flops you take it slowly and arrive with a blister that will be with you for the trip."},{"if":"has:sarong","text":"The sarong is in the bag, so you tie it on at the gate and walk in with everyone else.","else":"Knees are knees: no sarong, so you rent one at the gate for two euros and queue twice."}],"mem":"The cliff path at Uluwatu temple"},"rest":{"text":["The homestay has a bench at the end of the garden where the land just stops. Below: the sea, white lines of swell, three surfers waiting for something. Ibu Ketut's grandson practises his English on you. \"Where are you from. Do you like Bali. Do you like chicken.\"",{"if":"!has:repellent","text":"When the light starts to go the mosquitoes find you. You do not find them.","else":"The mosquitoes come with the last of the light and go away again, offended by the repellent."}],"mem":"Sat at the end of the garden where the land stops"}},"npc1_intro":{"beach":"At the bottom of the steps a young man is stacking rental boards under a tarp. He speaks before you do.\n\n\"Swell is too big for you today. Tomorrow, smaller. I am Made.\"","temple":"On the temple path a young man is walking backwards, filming his cousin while a monkey inspects the cousin's sandal. He notices you flinch.\n\n\"Don't hold your sunglasses in your hand. And if one takes something, don't chase it and don't throw food — it's a trade. Find the men in the black and white sarong.\" He grins. \"I am Made, I work at the beach.\"","rest":"A young man drops a scooter at the gate and asks Ibu Ketut something in Balinese. She points at you.\n\n\"You want to rent? Tomorrow is fine also. I am Made.\""},"npc1_a":{"q":"\"What's it like living here?\"","a":"\"Now? Busy. When I was small there was one warung on this beach and my uncle's boards. Do you ride — the little flower trays on the road. Don't ask what they mean. Just slow down where there are many in one corner. Somebody already found out why.\"","q2":[["\"Can you teach a total beginner?\"","\"Everyone is a total beginner. Tomorrow, half six. Not nine — the wind turns onshore by half nine and the water goes to chop. The schools start at nine because that is when tourists wake up. For you, three hundred fifty. Don't tell the Australians.\""],["\"Do you want it to change?\"","\"I want my little brother to have a job that is not carrying boards. And I want the water to stay clean. Both cannot be true.\" He shrugs. \"Seven tomorrow, if you want to try. Three-fifty.\""]]},"npc1_b":["\"Maybe tomorrow, then.\"","\"Tomorrow is smaller. Ask for Made, not the other Made.\" There are, you will learn, several. \"And in the cave at Suluban — when the water starts pulling inwards instead of sitting still, you go. It fills.\""],"npc1_c":"You nod and keep going. Behind you the boards keep stacking. The sea is very loud today.","rain":{"roof":"a warung on the cliff lane whose owner is already rolling down the tarps","roofShort":"a warung with the tarps down and people looking out","under":"The owner brings tea nobody ordered. Below the cliff the sea has gone white. A surfer is still out there, tiny, waiting."},"dinner":{"warung":{"label":"A cliff-lane warung","cost":4},"tourist":{"label":"A beach club dinner","cost":27},"tip":{"label":"The fish place by the steps","sub":"Where Made and the surfers eat.","cost":4}},"sunset":"You walk to the cliff edge. The sun drops into the Indian Ocean with the temple in silhouette to your left. Below, the last surfers paddle in through pink water. A woman next to you says \"oh\" out loud and does not seem embarrassed.","night_sound":"the sea","breakfast2":"Ibu Ketut has left a thermos and two fried bananas by the door, and the sea is doing its thing below.","events":[{"id":"wait","if":"d2.transport==driver && phone>=30","w":45,"text":"Drivers are scarce on the Bukit. The app says four minutes, then twelve, then twenty-five. You drink Ibu Ketut's thermos on the wall and watch the sea. When Pak Nyoman finally comes he has driven from Jimbaran to get you, and says so, and charges for it, fairly.","mem":"Waited twenty-five minutes for a driver. The Bukit.","do":["m.energy-=5","spend:5","person:Pak Nyoman, who drove from Jimbaran"]},{"id":"ceremony","if":"phone>=30 && !flag:rainride","w":15,"text":"Bamboo poles bent over both sides of the road, and gamelan from somewhere ahead. Then the road stops being a road. A man in uniform waves you into a side lane without discussion. The map shows nothing; the map does not know about this. Twenty minutes, and something you would have paid to see.","mem":"Waved into a side lane by a ceremony the map did not know about","do":["sc.culture+=1","time+=20","transitMin+=20","evt:A ceremony closed the road. Twenty minutes, and worth it."]},{"id":"cancel_dead","if":"d2.transport==driver && phone<30","w":100,"text":"You open the app at {phone}% and it dies mid-order, screen black. On the Bukit there is no one to flag down; the cliff lane is empty in both directions. You walk twenty minutes to the temple road, where Ibu Ketut's nephew is waiting with the scooter you did not rent, grinning, and rents it to you anyway.","mem":"Phone dead, walked to the temple road, ended up on the scooter after all","do":["phone=0","d2.transport=scooter","m.energy-=12","spend:6","evt:Phone dead before the day had properly started. No adapter."]},{"id":"distance","if":"d2.transport==scooter && phone>=30 && !flag:rainride","w":40,"text":"The distances are longer than the map suggests: forty minutes of cliff road, wind, one wrong turn into a villa driveway, and a fuel stop at a stall selling petrol in vodka bottles. On the Bukit everything is ten minutes away and nothing is.","mem":"Forty minutes of cliff road for what the map called ten","do":["m.energy-=8","spend:1","sc.nature+=1"]},{"id":"flat","if":"d2.transport==scooter && phone>=30 && !flag:rainride","w":25,"text":"Twenty minutes in, the back wheel goes soft on the cliff road with nothing on either side but sky. You push it to a warung where a boy of about twelve looks at it, disappears, and comes back with a plug kit. Six minutes, twenty thousand rupiah.","mem":"Flat tyre on the cliff road, fixed by a twelve-year-old","do":["m.social+=1","spend:2","m.energy-=5"]},{"id":"monkey","if":"phone>=30 && !flag:rainride","w":20,"text":"On the temple road a monkey is holding a tourist's sunglasses to ransom. A man from the warung negotiates with a packet of crackers. The exchange takes place on the wall, formally, like diplomats. The tourist gets the glasses back, scratched.","mem":"Watched a monkey ransom a pair of sunglasses","do":["sc.nature+=1"]},{"id":"lost_dead","if":"d2.transport==scooter && phone<30","w":100,"text":"Maps dies at 6%, then 0%, on a cliff road where every turn looks like every other turn. You follow a surfer with a board on his scooter on the theory that he is going to the sea. He is. You arrive forty minutes late and he lends you wax.","mem":"Phone dead, followed a surfer to the beach","do":["phone=0","m.social+=1","m.energy-=10","evt:Phone dead before the day had properly started. No adapter."]},{"id":"rain","if":"d2.transport==scooter && flag:rainride","w":100,"text":["It rains for the first twenty minutes, the cliff road turning into a river with a view.",{"if":"has:jacket","text":"The jacket earns its place in the bag: wet legs, dry everything else.","else":"You are wet, then dry, in that order; the wind off the sea sees to it."}],"mem":"Rode the scooter through the morning rain","do":[{"if":"!has:jacket","do":["m.energy-=8"]}]}],"act2":[{"k":"surf","label":"Surf lesson at Padang Padang","sub":"Small day, beginner-friendly.","do":["d2.act=surf"],"next":"d2_price","dur":120},{"k":"cliffs","label":"Cliff beaches on foot","sub":"Bingin, Dreamland, a great many stairs.","do":["d2.act=cliffs"],"next":"d2_price","dur":240},{"k":"kecak","label":"Uluwatu temple and the Kecak dance","sub":"Fire, chanting, a hundred men, monkeys.","do":["d2.act=kecak",{"if":"!has:sarong","do":["spend:2","flag:rented_sarong","evt:Rented a sarong for the Kecak"]}],"next":"d2_price","dur":{"if":"has:sarong","text":180,"else":195}}],"price":{"surf":{"text":{"if":"flag:tip_npc1_q2 && home","text":"The boards under the tarp. You say the name. Made laughs. \"Three-fifty. Don't tell the Australians.\" Nobody haggles; the price was decided yesterday.","else":"The instructor says five hundred thousand, about thirty euros. The sign behind him says four hundred."},"choices":[{"if":"flag:tip_npc1_q2 && home","label":"Pay 350k","do":["m.social+=1","d2.priceOut=You pay three-fifty and get the good board, the one without the dent.","mem:Surfed with Made at the friend price","flag:used_tip"],"next":"d2_act_out","cost":21},{"if":"flag:tip_npc1_q2 && home","label":"Pay the 500k anyway","do":["sc.comfort+=1","d2.priceOut=You pay the full price. Made looks at you for a second, then gives you the good board and an extra half hour. Nobody mentions it.","mem:Paid full price for the surf lesson on purpose","flag:used_tip"],"next":"d2_act_out","cost":30},{"if":"!flag:tip_npc1_q2 || !home","label":"Pay 500k","do":["sc.comfort+=1","sc.plan+=1","d2.priceOut=You pay it. He gives you the newer board. Whether that is connected is unclear.","mem:Surf lesson, full price, no fuss"],"next":"d2_act_out","cost":30},{"if":"!flag:tip_npc1_q2 || !home","label":"Offer 350k","do":["sc.haggle+=1",{"random":[{"p":0.7,"do":["spend:-6","d2.priceOut=He sighs, theatrically. \"Four hundred. Because you asked nicely.\" You both know how this works.","mem:Haggled the surf lesson down to 400k"]},{"do":["d2.priceOut=\"Five hundred. Small day, high demand.\" You pay it. He is not wrong about the demand.","mem:Tried to haggle the surf lesson. Lost."]}]}],"next":"d2_act_out","cost":30,"paidBand":[24,30]},{"if":"!flag:tip_npc1_q2 || !home","label":"Walk to the next stack of boards","do":["sc.haggle+=1","sc.plan-=1","m.energy-=5",{"random":[{"p":0.5,"do":["spend:-9","d2.priceOut=Next stack: three-fifty, older board, older instructor, better instructor as it turns out.","mem:Walked to the next board stack and found the better teacher"]},{"do":["d2.priceOut=Next stack is the same price, and now the first guy has your slot. You wait forty minutes for the tide, then pay five hundred anyway.","mem:Walked to the next stack. Same price, lost the slot."]}]}],"next":"d2_act_out","cost":30,"paidBand":[21,30]},{"label":"Watch from the sand instead","cost":0,"do":["d2.skip=true","d2.priceOut=You watch the lesson from the sand. The instructor's students fall off in the same order you would have.","mem:Watched the surf lesson from the sand"],"next":"d2_act_out"}]},"cliffs":{"text":"At the top of the Bingin stairs a boy holds out a hand: \"Parking, ten thousand.\" There is no car park. At the bottom, a warung lady offers a bean bag: \"Fifty thousand, or free if you eat.\"","choices":[{"label":"Pay the boy, eat at the warung","do":["m.social+=1","food:Bingin: grilled fish on a bean bag","d2.priceOut=You pay the boy, who says \"terima kasih\" like a man closing a deal, and eat grilled fish on a bean bag while the wave does its thing thirty metres away.","mem:Fish on a bean bag at Bingin"],"next":"d2_act_out","cost":4},{"label":"Pay the boy, skip the bean bag, sit on the sand","sub":"","do":["sc.beach+=1","d2.priceOut=You pay the boy and sit on the sand with a bottle of water. It is enough.","mem:Sat on the sand at Bingin, ten thousand rupiah"],"next":"d2_act_out","cost":1},{"label":"Argue about the parking","do":["sc.haggle+=1",{"random":[{"p":0.5,"do":["spend:-1","sc.comfort-=1","d2.priceOut=He shrugs and lets you pass. Later the scooter has a small scratch that may or may not have been there before.","mem:Argued about parking at Bingin. Regretted it, probably."]},{"do":["d2.priceOut=He shrugs, you pay, everyone is ten seconds older.","mem:Argued about ten thousand rupiah, then paid it"]}]}],"next":"d2_act_out","cost":1,"paidBand":[0,1]},{"label":"Skip the stairs, sit on the cliff top for free","cost":0,"do":["d2.skip=true","d2.priceOut=You sit on the cliff top with the wind and the view and no bill.","mem:Sat on the cliff top above Bingin, free"],"next":"d2_act_out"}]},"kecak":{"text":"Kecak tickets: 150,000 at the counter, and a queue of two hundred people. A man by the gate is selling \"VIP, front row\" for 300,000.","choices":[{"label":"The counter, the queue","sub":"Side seats, probably.","do":["sc.plan+=1","m.social+=1","d2.priceOut=Twenty minutes in the queue with a family from Jakarta who share their crackers. Side seats. Fine seats.","person:a family from Jakarta with crackers"],"next":"d2_act_out","cost":9},{"label":"The VIP guy","do":[{"random":[{"p":0.6,"do":["sc.comfort+=1","d2.priceOut=Front row. It is a real ticket; he is just faster than the counter. The fire will be very close.","mem:Front row at the Kecak, via the guy at the gate"]},{"do":["d2.priceOut=It is a real ticket. Second row. \"VIP\" was optimistic.","mem:Second-row \"VIP\" at the Kecak"]}]}],"next":"d2_act_out","cost":18},{"label":"Skip the show, watch the sunset from the cliff path","do":["sc.nature+=2","sc.plan-=1","d2.skip=true","d2.priceOut=You skip the show."],"next":"d2_act_out","cost":3},{"label":"Listen from outside the gate, free","cost":0,"do":["d2.skip=true","d2.priceOut=You listen from the cliff path outside the arena, with the sky on fire and no ticket.","mem:Heard the Kecak from outside the gate"],"next":"d2_act_out"}]}},"act2_out":{"surf":{"text":{"if":"d2.skip","text":"Two hours on the sand. A dog lies down against your leg and stays for most of it.","else":["Two hours. You stand up once, for maybe a second and a half, and it is the best second and a half of the year. Your arms stop working around minute ninety. The instructor says \"good, good\" in a way that means \"not good, but good\".",{"if":"!has:sunscreen","text":"By evening your shoulders are the colour of the sunset. Tomorrow will know about it.","else":""}]},"mem":{"if":"d2.skip","text":"","else":"Stood up on a surfboard for a second and a half"},"do":[{"if":"d2.skip","do":["m.energy-=5"],"else":["sc.beach+=1","m.energy-=25",{"if":"!has:sunscreen","do":["flag:sunburn","evt:Sunburn. No sunscreen in the bag.","sc.comfort-=1","m.energy-=10"]}]}]},"cliffs":{"text":{"if":"d2.skip","text":"From the top, Bingin is a strip of sand and a line of surfers the size of commas. The stairs stay somebody else's problem.","else":["Bingin: 178 steps down through a village of stairs and warungs. At the bottom, a beach forty metres wide, a wave that experts wait for, and nobody trying to sell you anything. Dreamland later is the opposite: big, developed, a car park with a beach attached.",{"if":"has:flipflops","text":"Flip-flops were the right call for the stairs and the sand.","else":"Your shoes fill with sand on the first beach and stay that way; on the stairs back up you carry them."},{"if":"!has:sunscreen","text":"By evening your shoulders are the colour of the sunset. Tomorrow will know about it.","else":""}]},"mem":{"if":"d2.skip","text":"","else":"The cliff beaches, all the stairs"},"do":[{"if":"d2.skip","do":["sc.nature+=1","m.energy-=3"],"else":["sc.beach+=2","sc.nature+=1",{"if":"has:flipflops","do":["m.energy-=15"],"else":["m.energy-=22"]},{"if":"!has:sunscreen","do":["flag:sunburn","evt:Sunburn. No sunscreen in the bag.","sc.comfort-=1","m.energy-=10"]}]}]},"kecak":{"text":{"if":"d2.skip","text":"You walk the cliff path as the sun goes down. From outside the arena you can hear it start, a hundred men going chak-chak-chak, with the sea below and the sky on fire. Free, and possibly better.","else":["The temple sits on a seventy-metre cliff. Monkeys everywhere, professionals. At six a hundred men sit in a ring and chant while the sun goes down behind them and a man in a monkey costume runs through actual fire. It is the strangest, best hour of the trip so far.","Every phone in the arena is up. Yours too, for a minute, until you notice you are watching it through a screen and stop."]},"mem":{"if":"d2.skip","text":"Heard the Kecak from the cliff path, watched the sunset for free","else":"The Kecak at Uluwatu, fire included"},"do":["m.energy-=10",{"if":"!d2.skip","do":["sc.culture+=2","sc.nature+=1",["photos:20"]],"else":["photos:0"]}]}},"npc2_intro":"At a cliffside warung a woman with sun-bleached hair is fixing a fin with a screwdriver that is too big.\n\n\"Rafa. I run the surf camp up the road. Five years. You're at Ibu Ketut's? She told me. She tells everyone everything.\"","npc2_a":"\"Rent a scooter or you'll spend the whole trip waiting for drivers — and keep coins for the man in the orange vest. Tourists think it's a scam. It's the cheapest insurance on the island. Go to Bingin at sunset on a weekday: the stairs kill you, and that's why it's still nice. If you want a bar on every corner, that's Canggu, and there's no shame in it.\"","npc2_b":"\"The wave. That's the boring answer. The real answer is I got tired of explaining to people in São Paulo why I wasn't tired.\" She blows on the fin. \"Now I explain it to people in Ubud instead. And every time a tourist gets deported for climbing something, the village pays for the ceremony to clean it.\"","npc2_c":"\"Beleza.\" She goes back to the fin. The warung lady brings you a coffee you did not order and charges you for it, correctly.","eve":{"quietSub":"","outSub":"A cliff bar for the last light, then a warung with plastic chairs.","outCost":15,"quietSound":"The sea, working on the cliff. It has been at it for a while.","outText":{"parts":["The cliff bar: a DJ, the last of the sunset, tourists in linen. Then a warung with plastic chairs where",{"if":"flag:tip_npc1","text":"Made's cousin is serving and remembers you from the beach.","else":"the surfers eat, loudly, and one of them lends you his chair."}]},"outMem":"The cliff bar, then plastic chairs with the surfers","outPeople":{"if":"flag:tip_npc1","text":"Made's cousin, at the warung","else":""}},"d3":{"breakfast":"Ibu Ketut leaves the thermos and, today, a small bag of fried bananas \"for the plane\".","restSub":"Slow breakfast, the bench, nothing at all.","exploreSub":"Sunrise from the cliff, then the cave at Suluban.","restOut":"You do nothing, expertly. The bench at the end of the garden, the thermos, the sea below doing exactly what it did yesterday. This is the whole point, you suspect.","exploreOut":"Sunrise from the cliff, then down through the cave at Suluban, where the rock opens into a room with the sea coming in one end and the light coming in the other. Three surfers are already out. One of them, tiny, waves.","exploreMem":"Sunrise from the cliff and the cave at Suluban","npc1Bye":"Made is at the gate on the scooter. \"I saw you on the road. Small day today also.\" He takes you down to the beach for twenty minutes, no charge, no lesson, just the water. You do not stand up. It does not matter.","npc1ByeMem":"Twenty minutes in the water with Made, no lesson, no charge","road":"The Bukit road is empty. The airport is twenty-five minutes away and you almost wish it were more."},"tips":{"npc1a":{"a":"tip:Canang | Many offerings on one corner is a warning, not decoration. Slow down. | Made","b":""},"npc1b":{"a":"tip:Suluban | The cave fills at high tide. When the water starts pulling inwards, leave. | Made","b":""},"npc1q2":{"a":"tip:Surf timing | In at half six, out by half nine — that is when the wind turns onshore. | Made"},"npc2a":{"a":"tip:Bingin | Weekday sunset. The stairs are why it is still nice. | Rafa","b":"tip:Parking | The coins for the orange vest are insurance, not a scam. | Rafa"},"npc1intro":{"a":"tip:Monkeys | If one takes something, don't chase it. Find the men in the black and white sarong. | Made"}},"hub":{"friction":30,"eventRate":0.45,"actions":[{"id":"padang","art":"bingin","pri":3,"air":"out","label":"Padang Padang beach","sub":"Down a flight of steps and through a gap in the rock barely wider than you. A small, perfect beach with a serious wave at the end of it.","dur":180,"cost":2,"until":1080,"transit":true,"transitMin":40,"do":["act1=beach","sc.beach+=1","m.energy-=8",{"if":"!has:flipflops && done.act:padang<=1","do":["m.energy-=5","flag:hotsand"]},{"if":"!has:sunscreen","do":["m.energy-=5","flag:sunburn"]},{"if":"has:drybag","do":["flag:drybag_used"],"else":["phone-=6"]},{"if":"phone<45 && has:powerbank && !flag:bankday","do":["phone=100","flag:bankday","evt:The phone hit single digits out on the coast. The power bank, that brick, earned its place."]}],"next":[{"if":"!flag:met_npc1 && home","next":"act1_out"},{"next":"hub_out"}],"out":{"2":"Different tide, different beach. The wave is somebody else's problem today.","by":"done.act:padang","default":"A monkey on the steps watches you like a bouncer. The water is warmer than the air."},"where":"beach"},{"id":"temple_w","art":"uluwatutemple","pri":2,"air":"out","label":"Visit Uluwatu temple","sub":{"if":"has:sarong","text":"A small temple on the edge of a seventy-metre cliff, and monkeys who have made a career of tourists.","else":"A small temple on the edge of a seventy-metre cliff, monkeys with a career, and a man at the gate who checks knees."},"dur":165,"cost":{"if":"has:sarong","text":3,"else":0},"from":420,"until":1050,"once":true,"transit":true,"transitMin":40,"do":["m.energy-=10",{"if":"has:sarong","do":["act1=temple","sc.culture+=1"]}],"next":[{"if":"!has:sarong","next":"temple_gate"},{"if":"!flag:met_npc1 && home","next":"act1_out"},{"next":"hub_out"}],"out":["\"Monkeys on the stairs,\" says the man at the gate. \"Hold your glasses or buy new ones.\"",{"if":"has:sarong","text":"Ibu Ketut's sarong, handed over on arrival \"for the temple\", turns out to have been the whole point of it.","else":"Two euros for a sarong at the gate, from a man who has clearly had this conversation four hundred times."}],"where":"road","costBand":[0,7]},{"id":"surf_w","art":"surf","pri":3,"air":"out","label":"Take a surf lesson at Padang Padang","dur":180,"cost":0,"from":390,"until":900,"transit":true,"transitMin":40,"do":["d2.act=surf"],"next":"d2_price","tiredLock":20,"lockText":"You're too tired for that","where":"water","oncePerDay":true,"costBand":[0,30]},{"id":"cliffs","art":"bingin","pri":3,"air":"out","label":"The cliff beaches on foot","sub":"Bingin, then Dreamland, then a great many stairs in both directions.","dur":270,"cost":0,"from":450,"until":1080,"once":true,"transit":true,"transitMin":60,"do":["d2.act=cliffs",{"if":"phone<45 && has:powerbank && !flag:bankday","do":["phone=100","flag:bankday","evt:The phone was down to a quarter by mid-afternoon. The power bank, that brick, earned its place."]}],"next":"d2_price","where":"beach","costBand":[0,4]},{"id":"kecak","art":"kecak","pri":3,"air":"out","label":"The Kecak dance at the temple","sub":"Fire, a hundred men chanting, monkeys, and the sun going into the ocean behind all of it. Book nothing; turn up early.","dur":{"if":"has:sarong","text":195,"else":210},"cost":0,"from":930,"until":1245,"once":true,"transit":true,"transitMin":40,"do":["d2.act=kecak"],"next":"d2_price","where":"road","costBand":[0,18]},{"id":"ride_w","art":"nyangnyang","pri":2,"air":"out","label":"The nephew's scooter, out to Nyang Nyang","sub":"Ibu Ketut's flyer, a scooter with a bald front tyre, and the emptiest beach on the peninsula at the bottom of five hundred steps.","dur":225,"cost":6,"from":480,"until":1050,"once":true,"transit":true,"transitMin":90,"do":["sc.nature+=1","sc.beach+=1","m.energy-=18","flag:scooter_day",{"if":"has:drybag","do":["phone-=5","flag:drybag_used"],"else":["phone-=15"]},{"if":"!has:sunscreen","do":["flag:sunburn","m.energy-=5"]},{"if":"!has:shoes","do":["m.energy-=6"]},{"if":"phone<45 && has:powerbank && !flag:bankday","do":["phone=100","flag:bankday","evt:The phone hit single digits out on the coast. The power bank, that brick, earned its place."]}],"out":["Five hundred steps down, a beach with four people on it and a shipwreck, and five hundred steps back up in the afternoon heat.",{"if":"has:drybag","text":"The phone rides in the dry bag, which is the only thing that comes back clean."}],"where":"road"},{"id":"cliffbar","art":"nightout","pri":2,"air":"out","label":"A cliff bar for the last light","dur":165,"cost":15,"from":1000,"until":1260,"once":true,"do":["sc.comfort+=2","m.social+=1","m.energy-=5","mem:The cliff bar, the linen, the last of the light",{"if":"sim==skip","do":["time+=15","spend:2","flag:sim_cost","evt:No SIM, so the ride home had to be arranged from the bar's wifi. Fifteen minutes of standing about."]}],"out":"Two drinks at European prices, a view that is genuinely worth one of them, and a DJ who starts exactly when the sun has gone.","where":"indoor"},{"id":"trip_canggu","pri":3,"air":"out","label":"Canggu for the day","sub":"You decide over there how long you stay.","cost":0,"dur":0,"from":420,"until":1000,"once":true,"if":"day==2 && !flag:halfday && home","noEvent":true,"noFriction":true,"do":["d2.target=canggu","flag:daytrip"],"next":"d2_transport","route":"uluwatu-canggu","roundTrip":true,"where":"road"},{"id":"trip_ubud","pri":2,"air":"out","label":"Ubud for the day","sub":"A long day whichever way you cut it.","cost":0,"dur":0,"from":390,"until":900,"once":true,"if":"day==2 && !flag:halfday && home","noEvent":true,"noFriction":true,"do":["d2.target=ubud","flag:daytrip"],"next":"d2_transport","route":"uluwatu-ubud","roundTrip":true,"where":"road"},{"id":"bench","pri":0,"air":"out","label":"The bench at the end of the garden","dur":115,"cost":0,"noFriction":true,"do":["act1=rest","sc.comfort+=1","m.energy+=12"],"next":[{"if":"!flag:met_npc1 && home","next":"act1_out"},{"next":"hub_out"}],"out":"The thermos, the bench, the sea two hundred feet down doing exactly what it did yesterday. This is, you suspect, the whole point.","rest":true,"where":"home"},{"id":"warung_w","art":"warungcase","pri":1,"air":"in","label":"A warung on the cliff lane","sub":{"if":"sim==skip","text":"There is wifi, which is where you call cars from now."},"dur":105,"cost":4,"from":420,"until":1140,"do":["m.energy+=5","m.social+=1",{"if":"has:laptop","do":["phone=100","flag:laptop_used"],"else":["phone+=20"]}],"out":"The owner brings coffee nobody ordered and charges you for it, correctly. Two surfers relitigate a wave from this morning.","rest":true,"oncePerDay":true,"where":"indoor"},{"id":"massage_w","events":"handoff","art":"massage","pri":1,"air":"in","label":"Massage on the lane","dur":110,"cost":7,"do":[{"if":"hub.actions.massage_w<=1","do":["m.energy+=20"],"else":["m.energy+=8"]},"sc.comfort+=1"],"out":{"1":["An hour of being taken apart gently, with the sea through the wall. Your shoulders forgive the stairs.","The hour is spent looking down through the hole in the table at a pair of feet in flip-flops. Two of the toes never got painted."],"by":"hub.actions.massage_w","default":["The second one today does less. Your body noticed.","The hour is spent looking down through the hole in the table at a pair of feet in flip-flops. Two of the toes never got painted."]},"rest":true,"oncePerDay":true,"where":"indoor"},{"id":"walk_w","pri":0,"air":"out","label":"Walk the cliff lane","dur":105,"cost":0,"noFriction":true,"eventRate":0.6,"do":[{"if":"has:shoes","do":["m.energy-=2"],"else":["m.energy-=5"]},{"if":"phone<45 && has:powerbank && !flag:bankday","do":["phone=100","flag:bankday","evt:The phone was down to a quarter by mid-afternoon. The power bank, that brick, earned its place."]}],"out":{"by":"timeBand","morning":"Boards on scooters going one way, school uniforms going the other, the sea flat and grey and enormous.","midday":"No shade anywhere and the limestone throwing the heat straight back up at you.","afternoon":"Every gap in the trees is a piece of ocean. Someone is hosing a board down outside a homestay.","evening":"The lane empties towards the cliff. Everyone here is walking the same way for the same reason.","night":"Dark, warm, loud with sea. One warung, four plastic chairs, a generator.","default":"Limestone, scooters, and the sea at the edge of everything."},"rest":true,"where":"road"},{"id":"lunch_w","art":"warungcase","slot":"food","pri":2,"air":"in","label":"Lunch at a cliff-lane warung","dur":85,"cost":4,"from":690,"until":"plan.lunchCloses","noFriction":true,"do":["m.energy+=8","bellyRisk+=0.15","food:Uluwatu: grilled fish at a cliff-lane warung","flag:ate_lunch"],"out":"Fish, rice, sambal that means it, and the Indian Ocean doing the decor for free.","oncePerDay":true,"rest":true,"where":"indoor"},{"id":"eat_w","art":"warungcase","slot":"food","pri":3,"air":"in","label":"Dinner","dur":0,"cost":0,"from":1050,"until":1305,"if":"home","noEvent":true,"noFriction":true,"do":["flag:ate1"],"next":"dinner","oncePerDay":true,"rest":true,"where":"indoor"},{"id":"fish","slot":"food","pri":1,"air":"out","label":"The fish place by the steps","sub":{"if":"region:uluwatu && flag:met_npc1","text":"Where Made and the surfers eat.","else":"Where the surfers eat."},"dur":95,"cost":5,"from":1110,"until":1320,"noFriction":true,"do":["m.energy+=6","bellyRisk+=0.15","m.social+=1","food:Uluwatu: grilled fish by the steps, where the surfers eat",{"if":"region:uluwatu && flag:met_npc1 && flag:tip_npc1_a","do":["flag:used_tip"]}],"out":"A grill, a cool box, a plastic chair lent to you by a surfer who does not stop talking. Best five euros of the day.","rest":true,"where":"road"},{"id":"sleep","art":"guesthouse","slot":"bed","pri":3,"air":"in","label":"Back to the homestay. Sleep.","dur":0,"cost":0,"from":1155,"if":"day<3 && home","noEvent":true,"noFriction":true,"do":[{"if":"!flag:ate1","do":["m.energy-=5","evt:Skipped dinner"]},"unflag:ate1"],"next":[{"if":"day==1","next":"night1"},{"next":"d2_eve"}],"oncePerDay":true,"rest":true,"where":"home"}],"events":[{"id":"marta2","tag":"pos","w":400,"if":"flag:marta1 && !flag:marta2 && day>=2","mem":"Ran into Marta again, and the yellow raincoat","do":["flag:marta2","npc.marta+=1","m.social+=1","npc.tip=1","person:Marta, fourth time on the island, yellow raincoat"],"next":"npc_marta2"},{"id":"monkey_w","tag":"neutral","w":26,"text":"A macaque sits on a wall at eye level and holds your gaze until you look away first. It has done this before.","mem":"Lost a staring contest with a macaque"},{"id":"boards","tag":"neutral","w":24,"text":"Four scooters go past with boards under the arm, in a line, at exactly the same speed. Nobody here carries anything sensibly.","mem":"Four scooters, four boards, one speed"},{"id":"swell","tag":"neutral","w":20,"text":"The swell has come up overnight and everybody has an opinion about it. You stand at a fence and watch one man make one wave look easy.","mem":"Watched one man make one wave look easy","do":["sc.beach+=1"]},{"id":"seanight","tag":"neutral","w":16,"if":"timeBand==night","text":"The sea is louder at night, and closer, and it is not closer. It takes a while to stop checking.","mem":"The sea, louder at night and no nearer"},{"id":"wait_w","tag":"neg","w":32,"text":"Drivers are scarce on the Bukit. The app says four minutes, then twelve, then twenty-five. You wait on a wall and watch the sea.","mem":"Twenty-five minutes waiting for a driver. The Bukit.","do":["time+=25","m.energy-=4"]},{"id":"stairs_w","tag":"neg","w":22,"if":"!has:shoes","text":"Another hundred steps, wet at the bottom where the sea comes in. In flip-flops it is an act of faith.","mem":"A hundred wet steps in flip-flops","do":["m.energy-=7"]},{"id":"sun_w","tag":"neg","w":18,"if":"!has:sunscreen && timeBand==midday","text":"There is no shade on the Bukit at noon and the limestone throws the sun back up at you from underneath.","mem":"No shade, no sunscreen, white limestone","do":["flag:sunburn","m.energy-=5"]},{"id":"petrol","tag":"neg","w":14,"if":"flag:scooter_day","text":"The scooter runs down to the last bar of fuel on an empty stretch. You buy petrol from a woman selling it out of vodka bottles on a shelf.","mem":"Petrol out of a vodka bottle on a roadside shelf","do":["spend:2","time+=10"]},{"id":"made","tag":"pos","w":24,"if":"timeBand!=night","text":"Someone who works the beach recognises you from yesterday, asks where you have been, and tells you where to eat tonight. Not the club.","mem":"Told where to eat, and where not to","do":["m.social+=1","person:a boy from the board rack who studies tourism at night in Jimbaran"]},{"id":"cave","tag":"pos","w":18,"text":"The tide is out and the rock opens into a room with the sea coming in one end and the light coming in the other. Three surfers are already asleep in it.","mem":"The cave at Suluban with the light coming in","do":["sc.nature+=1","time+=20"]},{"id":"turtle","tag":"pos","w":12,"text":"A turtle surfaces forty metres out, considers the situation, and goes back down.","mem":"A turtle, briefly, forty metres out"}]}}},"scoring":{"base":40,"social":2.5,"engagement":1.6,"comfort":1.5,"energy":1.5,"broke":-6,"rainWalk":5,"rainOk":2,"rainPhone":-4,"haggle":3,"scooter":4,"localFood":3,"bellyBad":-5,"bellyMeds":2,"sunset":3,"tipDinner":3,"goodbye":2,"min":30,"max":97},"verdict":{"style":[{"if":"sc.plan>=2","text":"Planner"},{"if":"sc.plan<=-2","text":"Improviser"},{"if":true,"text":"Flexible"}],"company":[{"if":"m.social>=5","text":"Social"},{"if":"m.social<=0","text":"Solo"},{"if":true,"text":"Solo, with exceptions"}],"money":[{"if":"sc.comfort>=4","text":"Comfort first"},{"if":"sc.comfort<=1","text":"Local first"},{"if":true,"text":"Local, with a daybed"}],"budget":{"base":380,"perComfort":60},"discoveries":[{"if":"rainWalk","text":"Rain does not ruin your day. It is part of it."},{"if":"rainOk==false","text":"You would rather be dry than out. The dry season is May to October."},{"if":"m.social>=5","text":"You talk to strangers, and it pays off."},{"if":"m.social<=0","text":"You like your own company. Choose the quieter regions."},{"if":"flag:emptyWallet","text":"You ran the wallet dry on day three. Budget a third more than you think."},{"if":"m.energy<30","text":"You go home tired. A nothing day would fit in this trip."},{"if":"sc.haggle>0","text":"You will negotiate, politely. That is the correct amount."},{"if":"sc.haggle<=0","text":"You pay the asking price. It is fine; it is still cheap."},{"if":"sc.nature>=4","text":"You go looking for the green bits. Ubud will keep you busy."},{"if":"sc.beach>=4","text":"You want the sea within walking distance."},{"if":"sc.comfort>=4","text":"You spend on comfort. Bali is happy to take it."},{"if":"d2.transport==scooter","text":"You are a scooter person. That opens the whole island."},{"if":"d2.transport!=scooter","text":"You would rather be driven. Budget for it; it is worth it."},{"if":"d2.eve==quiet","text":"Your ideal night ends around ten."}],"advice":[{"if":"v.score>=80","text":"Most of it. You traveled the way Bali is easiest to travel."},{"if":"v.score>=65","text":"A good part of it, with room left in the trip."},{"if":"v.score>=50","text":"Some of it. The slower version of this trip shows more of the island."},{"if":true,"text":"A small part of it. The slower, earlier, cheaper version of this trip shows more."}],"lastDay":[{"if":"flag:verylate && flag:nearlymissed","text":"You made the plane. You made it with the gate already boarding, and you didn't make the last morning."},{"if":"flag:verylate","text":"You made the plane. You didn't make the last morning, and the driver earned his ten euros."},{"if":"flag:late","text":"You made the plane. You didn't make the last morning."},{"if":"flag:latecheckout && !flag:late","text":"You made the plane with room to spare, and paid five euros for the hour you took off the room."}],"booking":{"yes":[{"if":"m.money<=0","text":"You would book it, and you ran out of money doing it. Those two facts are not in tension: you spent the wallet on the island rather than bringing it home."},{"if":"m.social>=6","text":"You would book it, and the reason is on the card: you talked to people. That is not a Bali feature. That is you, and it will work in Lisbon too."},{"if":"sc.comfort>=4","text":"You would book it, and you would book the comfortable version again. Nothing wrong with that — just know that is what you are buying."},{"text":"You would book it. Which means the thing you did with those three days is the thing you actually wanted to do with them."}],"maybe":[{"if":"flag:late || flag:verylate","text":"Maybe, and the last day is why. It ended in a car with the clock against you, and a trip you would book again does not end like that."},{"if":"m.money<=0","text":"Maybe, and the wallet is why. Three days at this pace wants more than you gave it, or a slower three days."},{"if":"transitMin>=300","text":"Maybe — and you spent {transitMinDur} of it on the road. A maybe with that number in it usually means one region, not three."},{"text":"Maybe. Which is the honest answer to most trips, and the useful one: you know now which parts you would keep."}],"no":[{"if":"sc.comfort>=4","text":"No — and you did it the comfortable way. Worth asking whether it was the island you did not like or the version of it you bought."},{"if":"m.social<=0","text":"No, and you barely spoke to anyone for three days. That is allowed. It is also most of what people mean when they say a place did nothing for them."},{"if":"rainAfternoons>=2","text":"No, and it rained on you twice. The dry season is April to October and this was not it."},{"text":"No. Three days, honestly spent, and the answer is no — which is worth more than a maybe you did not mean."}]}},"profileHint":{"plan":[{"if":"sc.plan>=2","text":"Planner."},{"if":"sc.plan<=-2","text":"Improviser."},{"if":true,"text":"Somewhere between planner and improviser."}],"social":[{"if":"m.social>=4","text":"Talks to people."},{"if":"m.social<=0","text":"Keeps to yourself."},{"if":true,"text":"Talks to people when there is a reason."}]},"scenes":{"title":{"day":0,"type":"title","art":{"bg":"title","time":"sunset"},"title":"DESTINATION","text":["ONE WALLET. NO PLAN.","A playable simulation of a trip: you pack, you land, and you spend the money, the time and the daylight you have."],"choices":[{"label":"START JOURNEY","next":"budget"}]},"budget":{"day":0,"type":"text","art":{"bg":"home","time":"day"},"title":"How much do you want to spend per day?","text":"Flights and the room are paid. ":["spend:2","bellyRisk+=0.5","food:{region.name}: nasi goreng from a cart at 23:00"]},{"if":"phone<=0","do":["m.energy-=10","evt:Walked home at midnight with a dead phone"]},{"mem":{"ref":"region.eve.outMem"}},{"person":{"ref":"region.eve.outPeople"}}]},{"if":"has:adapter","do":["phone=100"],"else":{"if":"has:powerbank","do":["phone=100"],"else":["phone-=46"]}},"hub=null"],"text":{"if":"d2.eve==quiet","text":[{"if":"has:book","text":"You finish the paperback under the fan. First book in a year. Outside, {region.night_sound}, all night, and the island did not need you tonight.","else":{"if":"has:laptop","text":"You open the laptop, just to check, and lose an hour to email under the fan. Outside, {region.night_sound}. You close it at eleven with the feeling of having been somewhere else for the last hour, which is the opposite of what you came for.","else":"You lie under the fan and listen. {region.eve.quietSound} You are asleep by 21:40 and do not feel old about it."}},{"if":"region:ubud && !has:repellent","text":"The ravine sends up its mosquitoes at dusk and they stay for the night.","else":{"if":"region:ubud","text":"The ravine sends up its mosquitoes at dusk; the repellent sends them back."}}],"else":[{"ref":"region.eve.outText"},{"if":"flag:early_home","text":"By half past ten you are done, honestly done, and you leave with the band still playing. Home by eleven, which is early here, and you do not care.","else":{"if":"d2.late","text":{"if":"flag:exposed2","text":"At eleven you eat nasi goreng from a cart because a Dutch guy said it was the best on the island. It was very good. It will have consequences.","else":"At eleven you eat nasi goreng from a cart because a Dutch guy said it was the best on the island. It was."}}},{"if":"phone<=0","text":"No phone, no Grab. You walk the forty minutes back under more stars than seems reasonable, and a dog escorts you for the last ten."}]},"choices":[{"label":"End the day","next":"sum2"}]},"sum2":{"day":2,"phase":"Full day ","next":[{"if":"flag:hubmode && !home","next":"wake_away"},{"if":"flag:hubmode && region:canggu","next":"hub_c3"},{"if":"flag:hubmode && region:ubud","next":"hub_u3"},{"if":"flag:hubmode","next":"hub_w3"},{"next":"d3_morning"}]}]},"d3_morning":{"day":3,"phase":"Last day","time":"","loc":"{region.name}","weather":"Sunny","art":{"bg":"region","time":"morning"},"text":["How do you want to spend it?",{"if":"m.energy<30","text":"Your legs, for the record, have already voted."}],"choices":[{"label":"Rest","sub":{"ref":"region.d3.restSub"},"do":["d3.morning=rest","sc.comfort+=1","m.energy+=10"],"next":"d3_morning_out","dur":90},{"label":"One last exploration","sub":{"if":"flag:belly3","text":"Not today. Your stomach has vetoed it.","else":{"if":"m.energy<30","text":"Not today. Your legs have vetoed it.","else":{"ref":"region.d3.exploreSub"}}},"enabled":"!flag:belly3 && m.energy>=30","do":["d3.morning=explore","sc.nature+=1","m.energy-=10"],"next":"d3_morning_out","dur":120},{"label":"The market","sub":"Sarongs, coffee, wooden things you did not know you wanted.","do":["d3.morning=market","m.social+=1"],"next":"d3_morning_out","cost":20,"dur":90}]},"d3_morning_out":{"day":3,"phase":"Last day","time":"","loc":"{region.name}","weather":"Sunny","art":{"bg":{"if":"d3.morning==market","text":"market","else":"region"},"time":"morning","player":true},"enter":[{"if":"d3.morning==rest","do":["mem:A last morning of nothing, done properly"]},{"if":"d3.morning==explore","do":[{"mem":{"ref":"region.d3.exploreMem"}},["photos:15"]]},{"if":"d3.morning==market","do":["mem:The market, a sarong, a woman with a son in Sydney","person:the woman at the market with a son in Sydney"]}],"text":{"by":"d3.morning","rest":{"ref":"region.d3.restOut"},"explore":{"ref":"region.d3.exploreOut"},"market":["The market: you buy a sarong you will never wear, coffee you will drink too fast, and a wooden thing. The woman at the stall asks where you are from and tells you about her son in Sydney, who calls on Sundays.",{"if":"flag:sunburn","text":"She looks at your shoulders, tuts, and adds a small bottle of aloe to the bag without charging for it."}]},"choices":[{"label":"Continue","next":"d3_surprise"}]},"d3_surprise":{"day":3,"phase":"Last day","time":"","loc":"{region.name}","weather":"Sunny","art":{"bg":{"if":"d3.surprise==gecko","text":"hotel","else":{"if":"d3.surprise==ceremony","text":"procession","else":"region"}},"time":"day","player":{"if":"d3.surprise!=gecko"},"npc":{"if":"d3.surprise!=gecko"},"ceremony":{"if":"d3.surprise==ceremony"}},"enter":[{"if":"flag:tip_npc1_q2","do":["d3.surprise=npc1"],"else":{"if":"sc.culture>=2 || sc.nature>=4","do":["d3.surprise=ceremony"],"else":{"if":"m.social>=4 && d2.npc2!=c","do":["d3.surprise=npc2"],"else":["d3.surprise=gecko"]}}},{"if":"d3.surprise==npc1","do":[{"mem":{"ref":"region.d3.npc1ByeMem"}},"evt:An unplanned goodbye","m.social+=1"]},{"if":"d3.surprise==ceremony","do":["mem:Stood at the side of the road for a whole ceremony, flower behind your ear","evt:A ceremony took over the road","sc.culture+=1","m.social+=1"]},{"if":"d3.surprise==npc2","do":["mem:A goodbye hug from {npc2}","evt:An unplanned goodbye","m.social+=1"]},{"if":"d3.surprise==gecko","do":["mem:A gecko said tokek seven times. Lucky, apparently.","evt:A tokek gecko, seven times"]}],"text":{"by":"d3.surprise","npc1":{"ref":"region.d3.npc1Bye"},"ceremony":"On the way back the road fills up: a ceremony, the whole village in white and gold, a gamelan on the back of a truck. A woman hands you a flower for behind your ear and points you to the side of the road. You stand there for twenty minutes. It is the thing you will tell people about.","npc2":"{npc2} is at the {target.npc2.place} when you pass. \"Leaving? Everyone leaves. Then they come back and complain about the traffic.\" A handshake that turns into a hug, which surprises you both.","gecko":"In the bathroom a gecko the length of your forearm looks at you from the wall and says, clearly, TO-KEH. Seven times. {region.owner} tells you later that seven is lucky. You choose to believe her."},"choices":[{"label":"Continue","next":"d3_pack"}]},"d3_pack":{"day":3,"phase":"Last day","loc":"{region.hotel}","weather":"Sunny","art":{"bg":"hotel","time":"day","packing":true},"enter":["time+=20","mem:\"Next time, longer,\" said {region.owner}","unflag:hubmode","hub=null"],"text":[{"parts":["You pack in eleven minutes. Sand comes with you. The charger is on the floor behind the bed; you find it this time.",{"if":"has:laptop","text":"The laptop, opened once, has gained roughly half a kilo of humidity."},{"if":"flag:meds_unused","text":"The tablets go home unopened. Insurance."},{"if":"phone<30","text":"The phone is at {phone}%. It has been at {phone}% for a day and a half, spiritually."},{"if":"flag:sunburn","text":"The shirt goes on over the shoulders in stages."}]},"{region.owner} takes the key, looks at you the way people here look at people leaving, and says: \"Next time, longer.\""],"choices":[{"label":"Continue","next":"d3_airport"}]},"d3_airport":{"day":3,"phase":"Last day","loc":"To the airport","weather":"Sunny","art":{"bg":"road","time":"day","region":"$region","vehicle":"car"},"enter":[{"if":"region:canggu","do":["time+=70","transitMin+=70"]},{"if":"region:ubud","do":["time+=105","transitMin+=105"]},{"if":"region:uluwatu","do":["time+=55","transitMin+=55"]},{"if":"transport==bike","do":["spend:3"]},{"if":"transport==grab","do":["spend:8"]},{"if":"transport==taxi","do":["spend:16"]},{"if":"transport==transfer","do":["spend:25"]},{"if":"m.money<=0","do":["evt:Left with an empty wallet","flag:emptyWallet"]},{"random":[{"p":0.3,"do":["flag:traffic3","time+=30","transitMin+=30","evt:Traffic on the bypass. Thirty minutes of nothing."]},{"do":[]}]},{"if":"sim==skip && transport==grab","do":["spend:4","flag:sim_cost","evt:No SIM for the app on the way out, so {region.owner} called a friend with a car. Four euros over the app price."]},{"if":"time>plan.flight-90","do":["flag:nearlymissed","evt:Reached the desk with the gate already boarding."]}],"text":[{"ref":"region.d3.road"},{"if":"m.money<=0","text":"You pay the driver with the last coins from every pocket, and he waves off the difference the way people here do."},{"if":"!flag:late","text":"You are, for once, early."},{"if":"flag:traffic3 && flag:late","text":"The bypass is a car park. The driver takes a road that is not a road. You made it, barely."},{"if":"flag:traffic3 && !flag:late","text":"The bypass jams for thirty minutes. You had the time; you spent it watching scooters fill every gap."},{"if":"flag:late && !flag:traffic3","text":"Late out of the room, fast driver, no traffic: you made it, and paid ten euros for the privilege."}],"choices":[{"label":"Continue","next":[{"if":"flag:marta1","next":"npc3"},{"next":"d3_fly"}]}]},"d3_fly":{"day":3,"phase":"Last day","loc":"Seat 31A","weather":"","art":{"bg":"window","time":"night"},"text":["Window seat. The island tilts under the wing: dark, then a string of lights along the coast, then only the moon on the water.",{"if":"m.energy<30","text":"You are asleep before the seatbelt sign goes off. Three days, and you are going home to rest.","else":"You already know which bit you would go back to."}],"choices":[{"label":"One last question","next":"book"}],"enter":[{"if":"time<plan.boarding","do":["time={plan.boarding}"]}]},"book":{"day":3,"type":"question","qid":"book","art":{"bg":"title","time":"night"},"title":"Would you actually book this trip?","text":"","choices":[{"label":"Yes","do":["q.book=yes"],"next":"end"},{"label":"Maybe","do":["q.book=maybe"],"next":"end"},{"label":"No","do":["q.book=no"],"next":"end"}]},"end":{"day":3,"type":"end","art":{"bg":"homecase","time":"night"},"title":"Your {region.name}","text":"","choices":[{"label":"Try again","next":"__restart"}]},"npc0":{"day":1,"phase":"Arrival","time":"08:30","loc":"Ngurah Rai Airport","weather":"Hot, humid","art":{"bg":"belt","time":"morning","player":true,"npc":true},"enter":["flag:marta1","npc.marta+=1","person:the woman in the yellow raincoat"],"text":["It was a long way here. The baggage hall.","The belt has been going round for twenty minutes with the same four bags on it, and two of you are still standing there.","She is wearing a yellow raincoat, indoors.","\"Third time this has happened to me here,\" she says, without looking away from the belt. \"It always comes. Twelve minutes after you give up.\""],"choices":[{"label":"\"How many times have you been?\"","do":["m.social+=1","npc.tip=1","flag:marta_open","mem:A woman at the baggage belt in a yellow raincoat"],"next":"sim"},{"label":"\"Twelve minutes exactly?\"","do":["m.social+=1","flag:marta_open","mem:A dry joke at the baggage belt with a stranger","flag:marta_dry"],"next":"sim"},{"label":"Say nothing. Watch the belt.","do":["m.social-=1","mem:Said nothing to the woman at the belt. Nineteen hours is nineteen hours."],"next":"sim"}]},"npc3":{"day":3,"phase":"Last day","time":"","loc":"Ngurah Rai airport","weather":"","art":{"bg":"gate","time":"night","player":true,"npc":true},"enter":["npc.marta+=1","flag:marta3"],"text":[{"if":"flag:marta2","text":"At the gate, two rows over, the yellow raincoat. Same flight.","else":"At the gate, two rows over, a yellow raincoat, and under it the woman from the baggage belt on your first morning. Same flight."},{"if":"flag:sunburn","text":"She looks at your shoulders and does not say anything about them, which is worse."},"\"So,\" she says. \"Are you coming back?\"",{"if":"m.social>=5","text":"You have spent three days talking to strangers and you notice, saying it out loud, that you already have an answer."},{"if":"m.money<=0","text":"You have eleven cents and a boarding pass and you notice, saying it out loud, that this does not feel like the problem it should."}],"choices":[{"label":"\"Yes. Longer, and one place.\"","do":["m.social+=1","flag:marta_yes","mem:\"Are you coming back?\" Yes. Longer, and one place."],"next":"d3_fly"},{"label":"\"I don't know yet.\"","do":["mem:\"Are you coming back?\" You didn't know yet, and said so."],"next":"d3_fly"},{"label":"\"Once was the point.\"","do":["mem:\"Are you coming back?\" Once was the point."],"next":"d3_fly"}]},"hub_visit":{"type":"hub","phase":"Day trip","region":"{d2.target}","loc":"{target.name}","weather":"{d2.weather}","art":{"bg":"target","time":"day"},"text":[{"by":"timeBand","morning":"You are in {target.name} with the whole day still in front of you and a bed {trip} away.","midday":"{target.name} in the middle of the day. Your bed is {trip} back the other way.","afternoon":"{target.name}, and the light is starting to think about leaving. {trip} back, whenever you go.","evening":"{target.name} in the evening. The road home is still {trip}, and it will be dark on it.","night":"{target.name} after dark. Your room is {trip} away and nobody is holding it for you.","default":"{target.name}. Your bed is {trip} back the other way."},{"if":"d2.transport==driver && !flag:driverleft","text":"The driver parks in the shade, tips the seat back and says he will be here."},{"if":"d2.transport==scooter","text":"The scooter is yours until you take it back, which is a freedom with an edge on it."}],"moments":[{"at":"plan.lunchCloses","flag":"m_lunch","if":"!flag:ate_lunch","label":"the warungs","warn":"you'd miss lunch","miss":"Lunch went somewhere else while you were busy. The glass cases are empty until evening.","drift":"By the time you looked up the warungs had closed their cases. Nothing to eat now until the evening.","do":["m.energy-=7","flag:missed_lunch","evt:Missed lunch; the warungs had wiped their cases down before you got there"]},{"at":1110,"flag":"m_ridehome","hard":true,"label":"the ride home","warn":"you'd still be here at half six","next":"road_late"}],"bedtime":1275,"sleepNext":"sleep_away","overrun":60},"road_late":{"phase":"Day trip","loc":"{target.name}","weather":"{d2.weather}","art":{"bg":"target","time":"sunset","player":true},"enter":[{"if":"d2.transport==driver","do":["flag:driverleft","evt:The driver's day ended in {target.name} before yours did. The way back cost again."]},{"if":"d2.transport==scooter","do":["flag:darkride","m.energy-=6"]},{"if":"sim==skip","do":["time+=15","flag:sim_cost","evt:No SIM, so finding the cousin meant finding wifi first. Fifteen minutes on a warung step."]}],"text":[{"if":"d2.transport==driver","text":"The driver finds you, apologetic and firm. His daughter has something at the temple. He was hired for a day and the day is over.\n\nHe can call his cousin. The cousin will come, and the cousin will charge properly.","else":"The light goes and the road stops being the road you rode in on. Trucks with one headlight, dogs with none, and every pothole now a matter of faith."},{"if":"d2.transport==driver","text":"You are still in {target.name}, and getting out of it is now a separate purchase.","else":"You are still in {target.name}, {trip} from a bed, in the dark."},{"if":"sim==skip","text":"And you cannot call anyone from here. There is a warung two hundred metres back with a password taped to the fridge, which is how this gets solved."}],"choices":[{"label":"Continue","next":"$hub"}]},"sleep_away":{"day":2,"phase":"Full day","loc":"{target.name}","weather":"Clear","art":{"bg":"target","time":"night"},"enter":[{"if":"m.money>=15","do":["spend:15","flag:slept_away","mem:Stayed the night in {target.name}, because the day ran out before the road did","evt:Paid fifteen euros for a room in {target.name}. The money was never the problem."],"else":["flag:slept_away","flag:slept_rough","m.energy-=14","mem:Slept on two chairs in the back of a shop in {target.name}, because there was nothing left for the room","evt:No fifteen euros for the room in {target.name}. Two chairs, a blanket, and the street until two."]}],"text":[{"if":"!flag:slept_rough","text":"You have the money. You do not have the road."},"The last shared cars have gone. What is left is somebody's cousin, at a price that has nothing to do with the distance, and you would arrive in the middle of the night.","A woman with a ledger has a room over a shop: a fan, a bucket of cold water. Fifteen euros.","Your room in {region.name} sits empty tonight.",{"if":"flag:slept_rough","text":"You count it out on the counter and it is not fifteen euros. She looks at the money, then at you, then puts two chairs together at the back of the shop and finds a blanket. She will not take what you have."}],"choices":[{"label":{"if":"flag:slept_rough","text":"Take the chairs","else":"Take the room"},"next":"sum2","do":["hub=null","m.energy+=6"]}]},"hub_out":{"type":"hub_out","phase":"","loc":"{target.name}","art":{"bg":"target","time":"day"}},"hub_rain":{"phase":"","loc":"{target.name}","weather":"Rain","art":{"bg":"target","time":"day","rain":true,"player":true},"enter":["rainAfternoons+=1",{"if":"hub.where!=indoor && hub.where!=home","do":["m.energy-=2"]},{"if":"hub.where==water","do":[],"else":{"if":"has:drybag","do":["flag:drybag_used"],"else":["phone-=10","flag:phonewet","rainOk=false"]}}],"text":["The sky goes the colour of wet cement and comes down. Not drizzle: a wall.",{"by":"hub.where","water":"You are already in the water, which turns out to be the one place rain cannot make you wetter. Everyone else is climbing out and running for cover with their hands over their heads, as if that helps.","beach":"The sand goes dark in a single sweep, from the tree line to the surf. The bean bags are folded and gone in under a minute and the dogs are under them.","indoor":"You are already under a roof, which makes this a spectator sport. The road outside turns into a shallow brown river and every scooter in Bali arrives at once looking for shelter.","home":"You are at your own place when it starts, which is the luxury nobody books for. The gutters take about four seconds to give up.","default":"There is no warning and there is nowhere in reach. Ponchos appear from under seats, whole families going past with three people under one."},{"if":"hub.where!=water && hub.where!=indoor && hub.where!=home","text":{"if":"has:jacket","text":"The jacket goes on. Around you people are running; you do not have to.","else":"You have a t-shirt."}},{"if":"hub.where!=water && hub.where!=indoor && hub.where!=home","text":{"if":"has:drybag","text":"The phone goes into the dry bag before you have thought about it.","else":"The phone goes under your shirt, which works about as well as it sounds."}}],"choices":[{"if":"hub.where==water","label":"Stay in","dur":20,"do":["rainWalk=true","sc.nature+=1","m.energy+=4","mem:Stayed in the water through the afternoon rain while everyone else got out"],"next":"$hub"},{"if":"hub.where==water","label":"Get out and dry off","dur":25,"do":["m.energy-=2","mem:Got out of the water for the rain, like a sensible person"],"next":"$hub"},{"if":"hub.where==beach","label":"Sit it out where you are","dur":25,"do":["rainWalk=true","sc.beach+=1","mem:Sat out the rain on the sand with the dogs"],"next":"$hub"},{"if":"hub.where==beach","label":"Make for the warung at the top","dur":30,"do":["m.social+=1","mem:Waited out the rain in a beach warung under a tarp"],"next":"$hub"},{"if":"hub.where==indoor","label":"Order something else and watch it","dur":30,"cost":2,"do":["sc.comfort+=1","mem:Watched the afternoon rain from under a roof with a second coffee"],"next":"$hub"},{"if":"hub.where==indoor && has:jacket","label":"Put the jacket on and leave anyway","dur":10,"do":["rainWalk=true","sc.nature+=1","mem:Walked out into the rain in the jacket while the café stayed put"],"next":"$hub"},{"if":"hub.where==home","label":"Let it happen","dur":35,"do":["m.energy+=6","sc.comfort+=1","mem:The rain on the roof, from inside, doing nothing at all"],"next":"$hub"},{"if":"hub.where==road && has:jacket","label":"Keep going in it","dur":15,"do":["rainWalk=true","sc.nature+=1","mem:Kept going through the afternoon rain in the jacket"],"next":"$hub"},{"if":"hub.where==road","label":"Ge
