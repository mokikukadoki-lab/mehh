<script>
/* ===== Bali, three days: data-driven engine =====
   All content lives in story.json (STORY). This file only interprets it.
   Public surface used by ui.js / tests: STORY, REG, TRIP, ITEMS, SC, newState, has, verdict, profileHint, setRng, ctx
*/
const STORY = (typeof STORY_DATA !== 'undefined') ? STORY_DATA : require('./story.json');
const REG = STORY.regions, ITEMS = STORY.items;
/* The canonical road table: minutes between places, and the only place they are written down.
   Everything else — the prose, a day trip's two legs, the map later — is derived from it. */
const TRAVEL = STORY.travel || {};
const legMin = (a,b)=>TRAVEL[a+'-'+b];
/* The last day is not the same trip from every region: the deadline is the flight, minus check-in,
   minus the road you happen to be at the far end of. Uluwatu 55 minutes, Ubud 105. */
function planOf(S){
  const p=STORY.plan; if(!p) return {};
  const leg=TRAVEL[(S.region||'')+'-airport']||0;
  const leaveBy=p.flight-(p.checkin||0)-leg;
  /* What the road out will cost, read from the same table d3_airport charges from, so the money
     changer can know on the last morning whether the wallet covers the ride to the plane. */
  const fare=(p.fare||{})[S.transport]||0;
  return Object.assign({}, p, { airportLeg:leg, leaveBy, fare,
    flightClock:fmtClock(p.flight), leaveByClock:fmtClock(leaveBy), airportLegDur:fmtDur(leg),
    lunchClosesClock:fmtClock(p.lunchCloses) });
}
const TRIP = new Proxy({}, { get:(_,k)=>{ const n=TRAVEL[String(k)]; return n==null?'':'about '+fmtDur(n); } });

/* ---- rng (overridable for tests) ---- */
let _rng = Math.random;
function setRng(f){ _rng = f || Math.random; }
let rndCalls=0;
const rnd = ()=>{ rndCalls++; return _rng(); };
function getRndCalls(){ return rndCalls; }

/* ---- state ---- */
function newState(){
  const S = JSON.parse(JSON.stringify(STORY.state));
  S.m = Object.assign({}, STORY.meters);
  S.days = STORY.meta.days || 3; S.day = 0; S.time = 0; S.hub = null;
  S.mem = {}; for(let d=1; d<=S.days; d++) S.mem[d]=[];
  return S;
}
const fmtClock = t => { t=((t%1440)+1440)%1440; return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'); };
const parseClock = s => { const m=String(s||'').match(/^(\d{1,2}):(\d{2})$/); return m ? Number(m[1])*60+Number(m[2]) : null; };
const fmtDur = m => m>=60 ? (Math.floor(m/60)+'h'+(m%60?String(m%60).padStart(2,'0'):'')) : m+'m';
const timeBand = t => t<660?'morning':t<840?'midday':t<1050?'afternoon':t<1260?'evening':'night';
/* The sky is a function of the clock, never of which scene you happen to be looking at. */
// 06:30 morning · 10:00 day · 17:00 sunset · 18:45 night. These are the real bands over Bali; they are
// not padded to cover a moment that fired late. A moment more than GRACE minutes past its hour is gone
// (hub.js), so the sky never has to lie about how late it is.
const clockBand = t => { t=((t%1440)+1440)%1440; return t<390?'night':t<600?'morning':t<1020?'day':t<1125?'sunset':'night'; };
const energyWord = S => S.m.energy>=70?'fresh':S.m.energy>=45?'fine':S.m.energy>=25?'tired':'wrecked';
const has = (S,id)=>S.bag.includes(id);
const bagSlots = S=>S.bag.reduce((n,i)=>{ const it=ITEMS.find(x=>x.id===i); return n+(it?(it.slots||1):1); },0);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---- context for templates and conditions ---- */
function sctx(S){
  const reg = REG[S.region] || {};
  const tk  = S.d2.target || S.region;
  const tgt = REG[tk] || {};
  return Object.assign({}, S, {
    region: reg, target: tgt, regionKey: S.region, targetKey: tk,
    npc1: reg.npc1 ? reg.npc1.name : '', npc2: tgt.npc2 ? tgt.npc2.name : '',
    travel: TRAVEL, trip: TRIP[S.region+'-'+tk] || '', home: tk===S.region,
    tripTo: { canggu: TRIP[S.region+'-canggu']||'', ubud: TRIP[S.region+'-ubud']||'', uluwatu: TRIP[S.region+'-uluwatu']||'' },
    event: S.d2.eventObj || {},
    plan: planOf(S),
    clock: fmtClock(S.time), timeBand: timeBand(S.time), energyWord: energyWord(S),
    daysLeft: Math.max(1, S.days - Math.max(S.day,1) + 1), moneyLeft: Math.max(0, Math.round(S.m.money)),
    perDayLeft: Math.max(0, Math.round(Math.max(0,S.m.money) / Math.max(1, S.days - Math.max(S.day,1) + 1))),
    bagSlots: bagSlots(S), transitMinDur: fmtDur(S.transitMin||0),
    bagNames: S.bag.map(i=>{ const it=ITEMS.find(x=>x.id===i); return it?it.name.toLowerCase():i; }).join(', '),
  });
}
function get(path,S){ let o=sctx(S); for(const k of String(path).split('.')){ if(o==null) return undefined; o=o[k]; } return o; }
function tpl(s,S){ return String(s).replace(/\{([\w.]+)(\|\w+)?\}/g,(m,p,f)=>{ let v=get(p,S); if(v==null) v=''; v=String(v); if(f==='|lower') v=v.toLowerCase(); if(f==='|upper') v=v.toUpperCase(); return v; }); }

/* ---- conditions ---- */
function parseVal(v){ v=String(v).trim(); if(/^-?\d+(\.\d+)?$/.test(v)) return Number(v); if(v==='true') return true; if(v==='false') return false; if(v==='null') return null; return v.replace(/^['"]|['"]$/g,''); }
function atom(a,S){
  a=a.trim(); let neg=false; if(a.startsWith('!')){ neg=true; a=a.slice(1).trim(); }
  let r;
  let m;
  if(a==='') r=true;
  else if((m=a.match(/^has:(\w+)$/))) r=has(S,m[1]);
  else if((m=a.match(/^flag:(\w+)$/))) r=!!S.flags[m[1]];
  else if((m=a.match(/^region:([\w,]+)$/))) r=m[1].split(',').includes(S.region);
  else if((m=a.match(/^target:([\w,]+)$/))) r=m[1].split(',').includes(S.d2.target||S.region);
  else if(a==='home') r=(S.d2.target||S.region)===S.region;
  else if((m=a.match(/^rand<(\d*\.?\d+)$/))) r=rnd()<Number(m[1]);
  else if((m=a.match(/^rand<([\w.]+)$/))) r=rnd()<Number(get(m[1],S)||0);
  /* The left side may contain a colon: the per-action counters live at `done['act:<id>']`, and
     "done.act:beach<=1" is how the data asks for them. Without ':' in this class the whole atom
     fell through to `!!get(...)` and was false every time — which is how the hot sand, the
     flip-flops' one real consequence on the beach, never once fired (v28, found by audit_items). */
  else if((m=a.match(/^([\w.:]+)\s*(==|!=|>=|<=|>|<)\s*(.+)$/))){ let L=get(m[1],S);
    /* A counter that has never counted is zero, not "undefined": `hub.actions.massage<=1` is read
       before the first massage is recorded, and with an undefined left side every ordering test is
       false. The first massage of the day paid the second massage's +8 instead of +20, every time. */
    if(L===undefined && /[<>]/.test(m[2]) && /^-?\d*\.?\d+$/.test(m[3].trim())) L=0; let Rv=parseVal(m[3]); if(typeof Rv==='string' && /^[a-zA-Z_][\w]*\.[\w.]+$/.test(Rv)){ const g=get(Rv,S); if(g!==undefined) Rv=g; }
    r = m[2]==='=='?L==Rv : m[2]==='!='?L!=Rv : m[2]==='>='?L>=Rv : m[2]==='<='?L<=Rv : m[2]==='>'?L>Rv : L<Rv; }
  else r=!!get(a,S);
  return neg?!r:r;
}
function cond(c,S){
  if(c==null||c===true) return true; if(c===false) return false;
  if(Array.isArray(c)) return c.every(x=>cond(x,S));
  if(typeof c==='object'){ if(c.any) return c.any.some(x=>cond(x,S)); if(c.all) return c.all.every(x=>cond(x,S)); if(c.not!==undefined) return !cond(c.not,S); return true; }
  return String(c).split('||').some(part=>part.split('&&').every(a=>atom(a,S)));
}

/* ---- effects ---- */
function setPath(S,path,val){ const ks=path.split('.'); let o=S; for(const k of ks.slice(0,-1)){ if(o[k]==null) o[k]={}; o=o[k]; } o[ks[ks.length-1]]=val; }
function resolveVal(v,S){ if(v==='$region') return S.region; if(v==='$target') return S.d2.target||S.region; return parseVal(v); }
function pushU(arr,t){ if(!arr.includes(t)) arr.push(t); }
function spendMoney(S,n){ if(n>=0){ const pay=Math.min(n,Math.max(0,S.m.money)); S.spend+=pay; S.m.money-=pay;
    /* What the wallet could not cover is not nothing. Before this the last ride to the airport was
       charged against an empty wallet, the charge clamped to zero, and the trip ended as though
       the car had been free. The shortfall is kept so the end card can say who you owe. */
    if(pay<n-0.005) S.unpaid=Math.round(((S.unpaid||0)+(n-pay))*100)/100;
  } else { S.spend+=n; S.m.money-=n; } S.m.money=Math.max(0,S.m.money);
  // the day the wallet emptied is a fact about the trip, so the card can say it
  if(S.m.money<=0 && !S.brokeDay && S.day>0) S.brokeDay=S.day; }
function logIt(S,kind,text,day){ S.log.push({ day: day||S.day, time: S.time, kind, text }); }
function run(e,S,day){
  if(e==null) return; if(Array.isArray(e)){ e.forEach(x=>run(x,S,day)); return; }
  if(typeof e==='object'){
    if(e.if!==undefined){ run(cond(e.if,S)?e.do:e.else,S,day); return; }
    if(e.random){ const r=rnd(); let acc=0; for(const o of e.random){ if(o.p==null){ run(o.do,S,day); return; } acc+=o.p; if(r<acc){ run(o.do,S,day); return; } } return; }
    if(e.pick){ const list=get(e.pick,S)||[]; const el=list.filter(x=>cond(x.if,S) && (x.repeat || !S.usedEvents.includes(x.id))); const wOf=x=>Number(val(x.w,S))||1; const tot=el.reduce((s,x)=>s+wOf(x),0); let r=rnd()*tot; let ch=el[el.length-1]; for(const x of el){ r-=wOf(x); if(r<0){ ch=x; break; } }
      if(ch){ setPath(S,e.into,ch.id); if(e.obj) setPath(S,e.obj,ch); if(!S.usedEvents.includes(ch.id)) S.usedEvents.push(ch.id); run(ch.do,S,day); } return; }
    if(e.set){ for(const k in e.set) setPath(S,k,resolveVal(e.set[k],S)); return; }
    if(e.doRef){ run(get(tpl(e.doRef,S),S),S,day); return; }
    if(e.mem!==undefined){ const t=txt(e.mem,S); if(t){ S.mem[e.day||day].push(t); logIt(S,'mem',t,e.day||day); } return; }
    if(e.food!==undefined){ const t=txt(e.food,S); if(t){ S.foods.push(t); logIt(S,'food',t,day); } return; }
    if(e.person!==undefined){ const t=txt(e.person,S); if(t){ pushU(S.people,t); logIt(S,'person',t,day); } return; }
    if(e.evt!==undefined){ const t=txt(e.evt,S); if(t){ S.events.push(t); logIt(S,'event',t,day); } return; }
    return;
  }
  const s=tpl(String(e),S); let m;
  /* A template that resolves to nothing is nothing. The region tip slots are shared scene effects
     ("{region.tips.npc1b.a}") and a region with nothing to say in that slot resolves to ''. */
  if(!s) return;
  if((m=s.match(/^spend:(-?\d*\.?\d+)$/))){ spendMoney(S,Number(m[1])); return; }
  if((m=s.match(/^wallet:(\d+)$/))){ S.m.money=(S.budgetPerDay||0)*S.days+Number(m[1]); S.wallet=S.m.money; return; }
  // Drawing more cash is not income: it is recorded separately so the final screen can say what the trip really cost.
  if((m=s.match(/^draw:(\d+)$/))){ const n=Number(m[1]); S.m.money+=n; S.extraDrawn=(S.extraDrawn||0)+n; return; }
  // a dead phone takes no photographs. The count is the mechanism; the scene does not need a second version of itself.
  if((m=s.match(/^photos:(\d+)$/))){ if(S.phone>0) S.photos+=Number(m[1]); return; }
  /* A hub action that hands the player to a price or a gate does not spend the day on the click:
     the block is parked on `hub.pending` and settled here, once the player has actually committed.
     `commit` spends it and counts the action; `abandon:<share>` charges only that share of it and
     counts nothing — `abandon:0` at a price you walked away from, `abandon:0.5` at a temple gate you
     turned around at, because you did travel there. Before this, backing out of a surf lesson cost
     nearly three hours for doing nothing. */
  if(s==='commit'){ const q=S.hub&&S.hub.pending; if(q){ S.time+=q.dur; S.transitMin+=(q.transit||0);
      if(q.id){ S.hub.actions[q.id]=(S.hub.actions[q.id]||0)+1; S.done['act:'+q.id]=S.hub.actions[q.id];
        /* `commitDo` is the part of an action that must not happen until the player has said yes —
           the ride home from a beach club you might still walk away from. Looked up by id so the
           parked block stays a plain, serialisable object. */
        const pool=[...(((REG[S.hub.region]||{}).hub||{}).actions||[]), ...((STORY.hub&&STORY.hub.common)||[])];
        const act=pool.find(x=>x.id===q.id); if(act&&act.commitDo) run(act.commitDo,S,day);
        /* v34: past a temple gate the visit still gets its outcome screen and its picture. The gate
           screen has already told the sarong story, so only the place line is kept; before this the
           gate went straight back to the hub and the temple was never drawn. */
        if(act && q.via==='temple_gate'){ const first=Array.isArray(act.out)?act.out[0]:act.out;

}

/* ---- verdict ---- */

}
function profileHint(S){ const P=STORY.profileHint; const first=list=>{ for(const o of list){ if(cond(o.if,S)) return txt(o.text,S); } return ''; }; return first(P.plan)+' '+first(P.social); }

if(typeof module!=='undefined'){ module.exports={STORY,REG,TRIP,TRAVEL,legMin,ITEMS,SC,newState,verdict,profileHint,has,setRng,cond,txt,run,sctx,fmtClock,energyWord,fmtDur,bagSlots,val,get,tpl,rnd,spendMoney,timeBand,clockBand,logIt}; }

<script>
/* ===== Hub loop (developed separately; loads after engine.js) =====

   Loop: HUB -> action (cost -> time -> effects -> contextual event?) -> hub_out -> HUB.
   Fixed moments (rain, sunset, bedtime) redirect the hub to existing linear scenes. */
const HUB = (function(){
  const E = (typeof module!=='undefined' && typeof require!=='undefined') ? require('./engine.js') : { STORY, REG, SC, TRAVEL, cond, txt, run, val, get, tpl, rnd, spendMoney, timeBand, clockBand, fmtDur, fmtClock, logIt };
  const { STORY:ST, REG:RG, SC:SCT } = E;

     you actually stand in. Read the field through here, never raw. */

     opened on a screen that listed it. An option that sat unopened under `Something else…` was
     never on the player's screen and is not seen. Recorded per trip. */
  /* A sub exists to introduce a place or a consequence the player cannot know from the label
     (HANDOFF §10b, v28 B.1). Once the option has been seen it is known, so from then on the line
     under it is empty — unless the data supplies a `subAgain` that says something new. None does
     at present; the field stays so that one can. */

  function markSeen(S,ids){ if(!S.seenActs) S.seenActs=[];
    for(const id of ids) if(id && S.seenActs.indexOf(id)<0) S.seenActs.push(id); }

    const R=RG[regOf(def,S)]||{}; const H=R.hub||{}; const list=[...(H.actions||[]), ...((ST.hub&&ST.hub.common)||[])];
    return list;
  }
  function inWindowCalc(from,until,dur,S){ return S.time>=from && S.time+dur<=until; }

     leads to one of these parks its block on `hub.pending` instead of spending it (engine: `commit`
     and `abandon`), so the price is read at the hour the player clicked. */

  function lockedByPre(a,S,enough,inWindow){ return enough && inWindow && !(a.tiredLock!=null && S.m.energy<a.tiredLock); }
  function nextOfA(a,S){ if(!a.next) return 'hub_out'; if(typeof a.next==='string') return a.next; for(const o of a.next){ if(E.cond(o.if,S)) return o.next; } return 'hub_out'; }

     A moment is an appointment with the day: the sunset, the departure, the rain. A moment never
     fires from inside an action; it waits for you to come back to the hub. Rain is the exception:
     it is weather, it arrives on its own clock, and it cuts short whatever you were doing.
     GRACE is the whole tolerance — how late you may turn up and still get the moment, and equally
     the overrun a button has to warn you about. ONE number, so the warning and the loss can never

  const numOf=(v,S)=>{ if(v==null) return v; if(typeof v==='number') return v;

    const n=Number(r); return Number.isFinite(n)?n:Number(E.get(String(r),S)); };

      const at=at_(m,S);

     "Something else..." button in the UI. Nothing here changes an outcome —
     it only sets c.primary. Tuning knobs: the action's `pri`, `slot`

      if(now>=1230 && c.air==='out' && c.dur>=60 && !c.slot) s-=8;  // after dark a daytime outing is not the thing

      if(c.lockedBy==='rule') s-=8;

       costs nothing — and anything the data marks `must`, which is how the money changer stops

    const guard=[c=>c.must, c=>c.slot==='bed', c=>c.slot==='food', c=>c.cost===0&&!c.lockedBy];
    for(const g of guard){
      if(pick.some(x=>g(x.c))) continue;

       on the screen — a pool where almost everything is free used to leave nothing removable. */

      for(let j=pick.length-1;j>=0;j--){

  }
  function pickEvent(def,S,a){
    const R=RG[regOf(def,S)]||{}; const H=R.hub||{}; if(!H.events||!H.events.length) return null;
    const rate=(a&&a.eventRate!=null)?numOf(a.eventRate,S):(H.eventRate==null?0.4:numOf(H.eventRate,S));
    if(E.rnd()>=rate) return null;

       their own. A massage outcome is about the massage: a driver who takes twenty-five minutes on
       the Bukit does not belong on it (v28 B.4), but meeting Marta afterwards does, because she
       arrives on the next screen, not on this one. */
    const handoffOnly = a && a.events==='handoff';
    const el=H.events.filter(x=>E.cond(x.if,S) && !S.usedEvents.includes(x.id) && !(last==='neg' && x.tag==='neg') && (!handoffOnly || x.next));
    if(!el.length) return null;
    const wOf=x=>numOf(x.w,S)||1; const tot=el.reduce((s,x)=>s+wOf(x),0); let r=E.rnd()*tot; let ch=el[el.length-1]; for(const x of el){ r-=wOf(x); if(r<0){ ch=x; break; } }
    S.usedEvents.push(ch.id); S.hub.lastTag=ch.tag||'neutral'; E.run(ch.do,S,def.day||S.day);

  function sky(def,S){ const a=Object.fromEntries(Object.entries(def.art||{}).map(([k,v])=>[k,E.val(v,S)])); if(a.time!==undefined) a.time=E.clockBand(S.time); return a; }

     the one you sleep in. */
  function artWith(def,S,bg){
    const a=sky(def,S); if(!bg) return a;
    const reg = a.region || ((a.bg==='target'||a.bg==='act2') ? (S.d2.target||S.region) : S.region);
    return Object.assign({},a,{ bg, region:reg });
  }
  function makeHub(id,def){
    SCT[id]=(S,opts)=>{
      const peek=opts&&opts.peek;
      if(!peek){

        if(S.done[id]===1 && def.enter) E.run(def.enter,S,def.day||1);

        if(!S.hub.where) S.hub.where='home';

        S.hub.id=id; S.hub.region=rk;

        // (or backed out of) must not be charged to whatever they do next

        S.clockRunning=true;   // from here on the clock is real: the HUD shows it and no scene may wind it back
        // fixed moments: first one whose time has come and has not fired

          const at=at_(m,S);
          if(S.time<at || S.flags[m.flag] || !E.cond(m.if,S)) continue;
          /* Past the tolerance the moment is gone, and the clock is not asked to pretend otherwise
             (which is what a sunset band stretched to 19:30 used to be doing). Who it belonged to
             decides the line, not whether it happened:
               - warned on the button and taken anyway -> `miss`, in the second person
               - something else ate the clock (an event, a conversation, the rain) -> `drift`, which
                 reports the world instead of blaming the player: "By the time you got back to the
                 beach the last light had gone."

          if(!m.weather && !m.hard && S.time-at>GRACE){
            S.flags[m.flag]=true;
            const warned = !!(S.hub && S.hub.willMiss===m.flag);
            if(warned) S.hub.willMiss=null;
            const line = warned ? (m.miss||m.drift) : (m.drift||m.miss);
            if(line) E.logIt(S, warned?'miss':'drift', E.txt(line,S), def.day||S.day);
            if(!m.next) E.run(m.do,S,def.day||S.day);   // a moment with no screen IS its own consequence
            continue;
          }
          S.flags[m.flag]=true; E.run(m.do,S,def.day||S.day);

             used to open a screen whose only button was Continue, under a journal line that had
             already said the same thing. The effects land, the line is written, the hub renders. */

           that road lives once, in STORY.travel. Both legs are said out loud before the click. */

        /* An explicit `dur` always wins: a day trip announces both legs on the button but spends
           its minutes later, on the road scene, after you have chosen how you are travelling. */

        const legLine=!a.route?'':(a.roundTrip
          ? ' '+E.fmtDur(leg)+' there, '+E.fmtDur(leg)+' back \u2014 '+E.fmtDur(leg*2)+' of the day on the road.'
          : ' '+E.fmtDur(leg)+' on the road.');
        const nTrip=S.done['act:'+a.id]||0;
        if(a.once && nTrip>0) continue; if(a.oncePerDay && n>0) continue;
        const from=numOf(a.from,S)||0, bed=numOf(def.bedtime,S);
        /* An action's own window may close early but never later than the day can absorb.
           `overrun` is how far past the day's end you are allowed to knowingly run: an hour and a
           half on a normal night (you just go to bed late), forty-five minutes on the last day —
           enough to leave late, pay the fast driver and still be at the desk, never enough to miss
           the plane. Without this a three-hour Kecak started at half past three put you at check-in
           at nine in the evening for an eight o'clock flight. */
        const cap = bed==null ? 1440 : bed + (numOf(def.overrun,S)||0);
        const until=Math.min(numOf(a.until!=null?a.until:def.bedtime,S), cap);
        const inWindow = inWindowCalc(from,until,dur,S);
        const enough = cost<=0 || S.m.money>=cost;
        const tired = S.m.energy<25 && dur>=60 && !a.rest && lockedByPre(a,S,enough,inWindow);
        const over = pending(def,S,dur+(a.noFriction?0:friction));   // what this costs you, said before you click
        const warns=[]; if(over) warns.push(over.warn||("you'd miss "+(over.label||'it')));   // v35: the tired note is gone; the cost still applies
        const ruleOk = (a.enabled===undefined || E.cond(a.enabled,S)) && !(a.tiredLock!=null && S.m.energy<a.tiredLock);
        const lockedBy = !enough?'money':!inWindow?(S.time<from?'early':'time'):!ruleOk?'rule':null;
        /* A lock has to say what would unlock it. "Not yet" and "Not enough money" tell the player
           nothing they cannot already see; "Opens at 8:00" and "€6 short" tell them what to do next. */
        const short = Math.ceil(cost - Math.max(0,S.m.money));
        const left  = Math.max(0, until - S.time);
        const lockText =
          lockedBy==='money' ? '\u20ac'+short+' short' :
          lockedBy==='early' ? 'Opens at '+E.fmtClock(from) :
          lockedBy==='time'  ? (left>0 ? ((a.transit||a.route)?'Too late to leave today.':'Too late for this today.') : 'Closed for today') :   // v35: one plain sentence, no arithmetic

          /* The short form fires on SEEN, not on taken. `nTrip` counts clicks, so an option
             surfaced nine times and never chosen used to print its full sub nine times — which is

          pri:a.pri||0, slot:a.slot||'', air:a.air||'', rest:!!a.rest, must:!!a.must, from, until,
          enabled: S2=>lockedBy===null,
          effect: S2=>{

               he was putting his jacket on and running for a roof. */

              wet=rainDuring(def,S2,start,S2.time); if(wet!=null) S2.time=wet;   // the rain sends you back early

               literally hub_out" — the merge below changes the latter and would otherwise turn
               contextual events off without a single test noticing. */

               printed above the hub's own text; an outcome that carries anything else keeps a
               screen of its own, because a consequence needs a beat to land in. "Anything else" is
               measured, not guessed: an event fired, a flag moved, a journal line was written, or
               money moved by an amount the button did not announce. */

              || Object.keys(S2.flags).length!==flags0
              || S2.log.length!==log0
              || Math.abs((S2.spend-spend0)-(cost>0?cost:0))>0.005
              || (S2.extraDrawn||0)!==drawn0

               the player had just done, which is why it did not read as meeting somebody. */
            /* The picture rides with the outcome, on both paths. Without this the merge ate the
               illustration: a light outcome went home to the hub and the hub drew its own
               backdrop, so the only actions that ever showed their own picture were the heavy
               ones — which is the opposite of a rule anybody would choose. */

                         // what happened is the picture: a coconut from a cart beats the lane it was bought on

          lockedBy:null, lockText:'', warn:'', pri:0, slot:'', air:'in', rest:true, from:0, until:nxt,
          enabled:()=>true,
          effect:S2=>{ S2.time+=span; S2.hub.willMiss=null; S2.hub.out={ text:'You sit on the step with the bag between your feet and let the last of it happen around you.', event:'', next:null, merge:true }; },
          next:S2=>(S2.hub&&S2.hub.id)||'hub_out' });

      const shown=surface(choices,S,def,weather);

         instead of taking a screen of its own (see `heavy` below). It is printed above the hub's

         (rain, the last car, bedtime) does not swallow it: it waits for the next hub render. */

      }

         "the light is starting to think about leaving", "the scooter is yours until you take it
         back", once per return (v28 B.4). A paragraph is now printed the first time it would
         appear in a day and not again. `S.hub` is rebuilt every morning, so the record is per day,
         and a band change still brings its own new line. */
      const said=(S.hub && S.hub.said) || [];
      const paras=E.txt(def.text,S).split('\n\n').filter(Boolean);
      const fresh=paras.filter(p=>said.indexOf(p)<0);
      if(!peek && S.hub){ S.hub.said=said.concat(fresh); }

      const text=[carried,body].filter(Boolean).join('\n\n');
      if(!peek) markSeen(S, shown.filter(c=>c.primary!==false).map(c=>c.id));
      return { id, day:def.day||S.day, phase:def.phase||'', time:'', hasEnter:!!def.enter, loc:E.txt(def.loc,S,' '), weather, type:'hub', art:artWith(def,S,carriedArt), title:'', text, choices:shown };
    };

         event's own `next`, which is how Marta's mid-trip screen never once played. */
      const onward=o.next||null;
      /* The record is cleared by Continue, not by rendering. Clearing it here meant this screen
         could only be drawn once: Back from the next screen (Marta, after a massage) restored a
         snapshot taken after the render had already emptied it, and the player got an outcome
         screen with no outcome on it — just the delta line and a Continue. */
      const text=[o.text,o.event].filter(Boolean).join('\n\n');
      const back=(S.hub&&S.hub.id)||'title';
      return { id, day:S.day, phase:def.phase||'', time:'', hasEnter:!!def.enter, loc:E.txt(def.loc,S,' '), weather:'', type:'text', art:artWith(def,S,o.art||null), title:'', text,
        choices:[{ label:'Continue', enabled:undefined, effect:S2=>{ if(S2.hub) S2.hub.out=null; }, next:()=>onward||back }] };
    };
  }
  for(const id in ST.scenes){ const d=ST.scenes[id]; if(d.type==='hub') makeHub(id,d); else if(d.type==='hub_out') makeOut(id,d); }

  /* ---- the same weighted rule, applied to linear screens --------------------------------------
     A screen that is one paragraph and a Continue, and that hands back to a hub, is merged on
     exactly the terms an action's outcome is: if entering it changed nothing but the clock, its
     line rides to the hub instead of costing a screen and a click. If anything else happened — a
     flag, a journal line, money — it keeps its screen, because a consequence needs somewhere to
     land. Opt in from the data with `mergeWhenLight: true`; the rule decides the rest, per visit.
     A screen whose Continue leads anywhere but a hub is never merged: only a hub can carry a line. */
  for(const id of Object.keys(ST.scenes).filter(k=>ST.scenes[k].mergeWhenLight)){
    const inner=SCT[id];
    SCT[id]=(S,opts)=>{
      const peek=opts&&opts.peek;
      const f0=Object.keys(S.flags).length, l0=S.log.length, sp0=S.spend;
      const sc=inner(S,opts);

  }
  return { makeHub, makeOut, surface, markSeen, MAXP, MINP };
})();

</script>
<script>
/* ===== Pixel art (160x90 grid, fillRect only) ===== */

            sunset:['#2E1A4F','#6E2E68','#C2504B','#EE8A45','#F6BE6C'], night:['#070B22','#0E1538','#151F4C','#1B2856'],
            rain:['#7F8E9B','#97A5B0','#ADB9C2','#C0CACF'] };

function sky(k,t){ const b=SKY[k]; const hh=58; const n=b.length; for(let i=0;i<n;i++) rect(0,i*hh/n,W,hh/n+1,b[i]);

  if(k==='sunset'){ rect(70,47,20,3,'#FFE29A'); rect(72,44,16,3,'#FFE29A'); rect(75,42,10,2,'#FFF1C0'); }
  if(k==='rain'){ for(let i=0;i<4;i++){ const cx=(hr(i+30)*150+t*0.3)%(W+40)-20, cy=4+i*8; rect(cx,cy,22,4,'#6E7C88'); rect(cx+4,cy-2,12,2,'#6E7C88'); } }
}
function sea(y0,k,t){ const cols=SEA[k]; rect(0,y0,W,H-y0,cols[0]); for(let y=y0;y<H;y+=2){ rect(0,y,W,1,cols[(Math.floor(y/2))%cols.length]); }
  for(let i=0;i<18;i++){ const x=(hr(i)*W + t*(0.6+hr(i+3)))%W; const y=y0+1+Math.floor(hr(i+50)*(H-y0-3)); rect(x,y,3+Math.floor(hr(i+7)*7),1,FOAM[k]); } }
function palm(x,yb,h,k){ const g=GREEN[k]; rect(x,yb-h,2,h,k==='night'?'#3A2A1E':'#7A5638'); const tx=x+1, ty=yb-h;
  rect(tx-7,ty-1,7,2,g[1]); rect(tx+1,ty-1,7,2,g[1]); rect(tx-5,ty-4,4,3,g[2]); rect(tx+2,ty-4,4,3,g[2]); rect(tx-8,ty,3,3,g[0]); rect(tx+6,ty,3,3,g[0]); rect(tx-1,ty-5,3,3,g[3]); rect(tx-3,ty+1,2,3,g[0]); rect(tx+2,ty+1,2,3,g[0]); }

   a different shape in the terraces, a third at the guesthouse — which reads as three people.
   There is one player. This is what they look like. Feet sit on `yb`. `figure()` stays, for
   everybody else in the world. */
const PLAYER_SHIRT='#F2C14E';
function player(x,yb,o={}){

/* --- Bingin: the stairs, and how far down the beach is -----------------------
   The place is vertical: a village on the clifftop, a switchback of cut steps down
   the face, and a beach that stays small right until you are standing on it. Drawn
   as three flights with landings, because one straight diagonal reads as a ridge
   line and the number of steps is the whole point. */
function bingin(k,t,o={}){
  /* The staircase is the picture. Houses, warungs, palms and parasols all competed with it and the
     distance stopped reading, so they are gone: cliff, sea, sun, stairs from the top of the frame
     all the way down to the sand, one figure. The empty rock is doing the work. */
  const b=SKY[k]; for(let i=0;i<b.length;i++) rect(0,i*H/b.length,W,H/b.length+1,b[i]);
  if(k==='day'){ rect(126,10,7,7,'#FFF3B0'); rect(127,9,5,9,'#FFF3B0'); rect(125,11,9,5,'#FFF3B0'); }
  if(k==='sunset'){ rect(112,44,20,4,'#FFE29A'); rect(115,40,14,4,'#FFE29A'); rect(118,37,8,3,'#FFF1C0'); }
  if(k==='night'){ for(let i=0;i<50;i++) rect(hr(i)*W,hr(i+9)*40,1,1,'#9FB0E8'); }
  sea(66,k,t);
  const A=k==='night'?'#2A2622':k==='rain'?'#5A5148':'#8A7659';
  const B=k==='night'?'#1D1A17':k==='rain'?'#454039':'#6E5D45';
  // the beach: a thin strip at the foot of it, and it stays small, which is the point
  rect(46,76,W-46,5,k==='night'?'#6E6350':'#E8D9B4');
  for(let i=0;i<7;i++) rect(52+i*14,75+(Math.floor(t/5+i)%2),8,1,FOAM[k]);
  // the cliff: one mass, nothing on it that could be mistaken for something to look at
  const edge=x=>2+Math.pow(Math.min(1,x/98),1.45)*76;
  for(let x=0;x<=100;x++){ const e=edge(x); rect(x,e,1,H-e,A); rect(x,e,1,2,B); }
  for(let x=98;x<=112;x++){ const e=78+(x-98)*0.4; rect(x,e,1,H-e,B); }

  /* 26 cut steps, top of the frame to the sand. They are CUT INTO the slope, not hung on it:
     the uphill end of every tread disappears into the rock, the downhill end catches the light,
     and a shadow sits under each one where it beds into the hill. Without those three things it
     reads as a ladder leaning against a cliff. */
  const steps=26, pt=i=>{ const p=i/(steps-1);
    return { p, x: 24 + Math.sin(p*3.0)*15 + p*30, y: 5 + Math.pow(p,1.04)*70 }; };
  const TREAD = k==='night'?'#3A342C':'#CBB894';
  const LIT   = k==='night'?'#4A4236':'#E3D3B0';
  const RISER = k==='night'?'#241F1B':'#7E6B4E';
  /* First the channel: a wall of cut rock up the inside of the whole flight and a lip on the
     outside. A staircase reads as cut in when the hill is visibly opened either side of it. */
  for(let i=0;i<steps;i++){
    const {p,x:sx,y:sy}=pt(i);
    const w=5+Math.round(p*8), x0=Math.round(sx-w/2), y0=Math.round(sy);
    const wall=3+Math.round(p*3);
    rect(x0-wall,y0-2,wall,6+Math.round(p*4),B);             // the cut face on the uphill side
    rect(x0-wall,y0-2,1,6+Math.round(p*4),A);
    rect(x0+w,y0,2+Math.round(p*2),5+Math.round(p*4),B);     // the outer lip, falling away
  }
  for(let i=0;i<steps;i++){
    const {p,x:sx,y:sy}=pt(i);
    const w=5+Math.round(p*8), h=1+(p>0.5?1:0);
    const x0=Math.round(sx-w/2), y0=Math.round(sy);
    rect(x0,y0+h,w,1+Math.round(p*2),RISER);                 // the riser, in shadow under the tread
    rect(x0,y0,w,h,TREAD);                                   // the tread
    rect(x0+Math.round(w*0.45),y0,Math.round(w*0.55),h,LIT); // the downhill half catching the light
    rect(x0,y0,1,h,B);                                       // the uphill end, in the wall's shadow
  }
  // one figure, a third of the way down: stairs above and stairs below both read
  const f=pt(9); player(Math.round(f.x)-2, Math.round(f.y));
}

/* --- scene pictures ---------------------------------------------------------------------------
   One picture per SCENE, not per region. A region tints these; it does not replace them. Each one
   is here because it carries a piece of information the player needs and the prose keeps repeating:
   how far down Bingin is, that the temple is standing in the sea, that the line-up is crowded,
   that your room is a small place with a pool, that the glass case empties, that the terraces have

function tanahlot(k,t,o={}){

  const d=k==='night'?'#1B1B22':'#4A3B2E', s=k==='night'?'#2A2A33':'#6E5F4E';

  for(let x=56;x<70;x++) rect(x,58+(x-56),1,H-58-(x-56),k==='night'?'#1E1A16':'#5A4B39');
  for(let i=0;i<3;i++) palm(8+i*17,58,11+Math.floor(hr(i)*5),k);
  // the rock: near-vertical sides, undercut only at the waterline, so it stands IN the water
  const rx=86, rw=44, top=50;
  for(let y=0;y<18;y++){
    const inset = y<3 ? 3-y : (y>14 ? (y-14)*2 : 0);
    rect(rx+inset,68-y,rw-inset*2,1, y>15 ? '#2E251C' : (y<2?s:d)); }
  rect(rx+2,68,rw-4,2,k==='night'?'#101014':'#2A2118');       // its own shadow on the sea
  for(let i=0;i<10;i++){ const x=rx-6+i*6; rect(x,67+(Math.floor(t/4+i)%2),5,1,FOAM[k]); }
  meru(rx+14,50,5,k); meru(rx+30,52,3,k);
  for(let x=rx+5;x<rx+rw-5;x+=7) shrub(x,51,6,k);
  // the causeway: stepping stones, the far half already under
  for(let i=0;i<8;i++){ const x=62+i*3.2, under=i>3;
    rect(Math.round(x),69+(i%2),3,2, under ? SEA[k][2] : (k==='night'?'#3A342C':'#B9A684')); }
  // the queue on the headland, a hundred metres away from the thing they paid to see

  if(o.after) for(let i=0;i<8;i++) rect(hr(i+9)*W,70+hr(i+19)*18,1,1,'rgba(255,255,255,0.3)');
}

// An hour of massage, seen from where you actually spend it: face down, through the hole.
function facehole(k,t,o={}){
  /* You are face down with your head in the hole, looking down the length of your own body toward
     the foot of the table. So her feet stand BELOW you in the frame and the toes point down, and
     the near lip of the table is the bar across the top. On a pair of feet seen this way the big
     toes are on the inside, facing each other. */
  rect(0,0,W,H,'#0D0B0A');
  const cx=80, cy=48, R=36;
  for(let y=0;y<H;y++){ const dy=y-cy; const hw=Math.sqrt(Math.max(0,R*R-dy*dy)); if(hw<=0) continue;
    const x0=Math.round(cx-hw), w=Math.round(hw*2);
    rect(x0,y,w,1, Math.floor((y-cy+R)/9)%2 ? '#B9744E' : '#A9663F'); }
  for(let y=cy-R;y<cy+R;y+=9){ const dy=y-cy; const hw=Math.sqrt(Math.max(0,R*R-dy*dy));
    if(hw>1) rect(Math.round(cx-hw),y,Math.round(hw*2),1,'#8E5232'); }
  for(let x=cx-R;x<cx+R;x+=11) for(let y=cy-R;y<cy+R;y++){ const dy=y-cy, dx=x-cx;
    if(dx*dx+dy*dy<=R*R) rect(x,y,1,1,'#8E5232'); }

  const SKIN='#E3B48D', SKIN2='#EFC9A6', SHAD='#C9996F', SOLE='#4A3A2E', STRAP='#2E2118';
  /* left=true is the foot on the LEFT of frame, so its big toe is on its RIGHT edge — the two feet
     face each other. Widths, nail colour and how far each toe reaches all follow the same order. */
  const foot=(fx,fy,left)=>{
    let wid   = [3,3,4,4,5];          // little -> big, reading left to right
    let paint = [false,false,true,true,true];
    let reach = [4,3,2,1,0];          // how far short of the big toe each one stops
    if(!left){ wid=wid.slice().reverse(); paint=paint.slice().reverse(); reach=reach.slice().reverse(); }
    const slots=[]; let x=fx;
    for(let n=0;n<5;n++){ slots.push({x,w:wid[n]}); x+=wid[n]+1; }
    const width=x-1-fx;
    rect(fx+4,fy,width-8,5,SHAD);                       // the heel, furthest away, in shadow
    rect(fx+2,fy+4,width-4,7,SKIN);                     // the arch
    rect(fx,fy+10,width,8,SKIN);                        // the ball of the foot
    rect(fx,fy+17,width,1,'#F0CDA6');
    for(let n=0;n<5;n++){
      const {x:tx,w:tw2}=slots[n], r=reach[n], len=7-r;
      rect(tx,fy+18,tw2,len,SKIN2);                     // the toe
      rect(tx,fy+18+len-2,tw2,2,'#F3D6B6');             // the nail on the end of it
      if(paint[n]) rect(tx+1,fy+18+len-2,tw2-2,2,'#C2504B');
      rect(tx,fy+17,tw2,1,SHAD);
    }
    rect(fx-2,fy+2,2,17,SOLE); rect(fx+width,fy+2,2,17,SOLE); rect(fx+2,fy,width-4,2,SOLE);
    // the thong, between the big toe and the one beside it, running back to both sides of the sole
    const bi = left?3:1;                                 // the gap between big and second toe
    const bx = slots[bi].x + (left ? slots[bi].w : -1);
    rect(bx,fy+15,2,6,STRAP);
    for(let n=0;n<5;n++){ const lx=bx-1-n, rx=bx+2+n;
      if(lx>=fx-1) rect(lx,fy+14-n,2,2,STRAP);
      if(rx<=fx+width-1) rect(rx,fy+14-n,2,2,STRAP); }
  };
  foot(46,40,true); foot(88,40,false);

  // a bowl of oil on the floor above them, out of the way
  rect(72,26,16,6,'#4A3A2E'); rect(73,23,14,3,'#C9B25A'); rect(77,22,6,1,'#EFD9A0');

  // everything outside the hole is the table you are lying on
  for(let y=0;y<H;y++){ const dy=y-cy; const hw=Math.sqrt(Math.max(0,R*R-dy*dy));
    if(hw<=0){ rect(0,y,W,1,'#241C17'); continue; }
    const x0=Math.round(cx-hw), x1=x0+Math.round(hw*2);
    rect(0,y,x0,1,'#241C17'); rect(x1,y,W-x1,1,'#241C17');
    rect(x0-1,y,2,1,'#3A2C23'); rect(x1-1,y,2,1,'#3A2C23'); }
  /* The near lip of the table, across the top: the padding under your chin, which is what makes
     the viewpoint read as a face hole and not a porthole. */
  rect(0,0,W,12,'#2E241D'); rect(0,10,W,2,'#4A3A2E'); rect(0,12,W,1,'#1A1411');
  for(let x=0;x<W;x+=18) rect(x,8,9,1,'#3A2C23');
  rect(0,H-4,W,4,'#17110E');
  // the hem of the curtain the room is behind, on the floor at the far side of the hole
  for(let x=cx-R;x<cx+R;x+=6){ const y=cy-R+7+((Math.floor(t/7)+x)%2), dy=y-cy, dx=x-cx;
    if(dx*dx+dy*dy<=R*R-40) rect(x,y,4,2,'#7A4A9C'); }
}

  };
  // the teacher at the front, facing the class, standing, arms up. Drawn first so the class overlaps.
  rect(46,72,36,4,'#EDE6D3');
  rect(60,64,7,8,'#D9D3C4'); rect(61,58,5,4,'#E3B48D'); rect(61,57,5,2,'#2B1B12');
  rect(57,56,2,9,'#E3B48D'); rect(67,56,2,9,'#E3B48D');
  const mats=['#7A4A9C','#3F7BD6','#3F9E6E','#E05A3A','#B48BD0','#3F7BD6'];
  for(let r2=0;r2<2;r2++) for(let i=0;i<3;i++){
    const mx=14+i*46+r2*14, my=72+r2*13;
    // the player is on the near mat in the middle, in the same yellow shirt as everywhere else
    if(o.player && r2===1 && i===1) seated(mx,my,'#F2C14E',PLAYER_SHIRT);
    else seated(mx,my,mats[(i+r2*3)%mats.length]);

// A warung is a glass case with the day's cooking in it. By two o'clock it looks like this.
function warungcase(k,t,o={}){
  const night=k==='night';
  rect(0,0,W,H,night?'#3A322B':'#CBBBA0');

// Kecak: a hundred men in a ring, fire in the middle, on a cliff with the sun going into the sea.
function kecak(k,t,o={}){
  const kk = k==='night' ? 'night' : 'sunset';
  sky(kk,t); sea(40,kk,t);
  // the clifftop the temple stands on: the sea keeps going behind it
  rect(0,56,W,H-56,kk==='night'?'#1B1714':'#463A2C');
  for(let x=0;x<W;x++){ const e=56+Math.round(Math.sin(x*0.07)*2); rect(x,e,1,3,kk==='night'?'#2A2420':'#6E5D45'); }
  for(let i=0;i<10;i++) rect(hr(i)*W,54+hr(i+5)*2,6,1,FOAM[kk]);
  meru(20,56,4,kk); gate(140,58,kk);
  // the arena: a closed oval of seated figures. The back rows are small and dark, the front rows
  // big and lit by the fire, which is what a hundred men in a ring actually looks like.
  const cx=80, cy=74;
  for(let ring=3; ring>=0; ring--){
    const rx=24+ring*12, ry=7+ring*3.2, n=16+ring*6;
    for(let i=0;i<n;i++){
      const a=(i/n)*Math.PI*2;
      const x=Math.round(cx+Math.cos(a)*rx), y=Math.round(cy+Math.sin(a)*ry);
      const front = Math.sin(a)>0;                      // this side of the ring is nearer the camera
      const hgt = front ? 4+ring : 2+Math.floor(ring/2);
      const wid = front ? 2+Math.floor(ring/2) : 2;
      const lit = front ? '#F4EEDC' : '#B9AE95';
      rect(x,y-hgt,wid,hgt,lit);
      rect(x,y-hgt-1,wid,1,'#2B1B12');
    }
  }
  // the fire, and what it throws on the front row
  rect(cx-3,cy-9,6,7,'#9C3B26'); rect(cx-2,cy-13,4,5,'#E05A3A');
  rect(cx-1,cy-17,2,5,'#F6D07A'); rect(cx,cy-20,1,3,'#FFF1C0');
  for(let i=0;i<14;i++){ const x=cx-28+i*4; rect(x,cy+4,3,1,'rgba(246,208,122,0.30)'); }
  monkey(10,58); monkey(152,56);
  if(kk==='sunset'){ rect(100,36,14,3,'#FFE29A'); rect(103,33,8,3,'#FFF1C0'); }
}

/* D.6 — the window seat, v35: from inside, the way you actually see it. A tall oval window in a thick
   moulded surround, the blind pushed up, the tip of the wing and its red light, and below it the island
   at night: black land, the coast picked out in lights, the moon and its road on the water. The flight
   is at 20:00, so it is always night. */
function windowSeat(k,t,o={}){
  const wallD='#4E525C';
  rect(0,0,W,H,'#5C606B'); for(let y=0;y<H;y+=7) rect(0,y,W,1,wallD);              // cabin wall, cabin lights down
  const cx=78, cy=41, rx=25, ry=33;                                               // one tall oval
  const inO=(x,y,ax,ay)=>(x*x)/(ax*ax)+(y*y)/(ay*ay)<=1;
  for(let y=-ry-7;y<=ry+7;y++) for(let x=-rx-7;x<=rx+7;x++){
    const px=cx+x, py=cy+y;
    if(inO(x,y,rx,ry)){
      const hz=-14+Math.round(x*0.15);                                             // the plane banks a little
      let c;

      else if(a2==='cliffs'){ if(art.player) player(56,H-36); }
      else if(art.player){ const py = reg==='uluwatu'?H-38:reg==='ubud'?86:80; player(reg==='uluwatu'?62:70,py); }
      if(art.npc){ const py = reg==='uluwatu'?H-38:reg==='ubud'?86:80; const nc={canggu:'#3F7BD6',ubud:'#E05A3A',uluwatu:'#3F9E6E'}[reg]; figure(reg==='uluwatu'?74:84,py,nc,{hairLong:reg==='canggu',hat:reg==='ubud'?'#C9B25A':null}); }

<script>
/* ===== UI ===== */
(function(){
  const $=s=>document.querySelector(s);
  const app=$('#app'), hud=$('#hud'), cv=$('#scene'), panel=$('#panel'), choicesEl=$('#choices'), journal=$('#journal'), jbtn=$('#jbtn'), prog=$('#prog');
  const c2=cv.getContext('2d'); c2.imageSmoothingEnabled=false; setCtx(c2);
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let S=newState(), cur='title', scene=null, t=0, timer=null;
  const hist=[]; let lastDelta=null; let restartArmed=false; let moreOpen=false; let pend=null;
  const META=STORY.meta||{}, DEST=META.destination||'Bali';
  const KEY=META.saveKey||'destination_bali_v1', PKEY=KEY+'_packing', AKEY=KEY+'_answers';
  /* The key never changes — renaming it would orphan the learned packing list and the answers log
     with it. What is versioned is the SAVE PAYLOAD: a half-played trip carries a clock, a wallet and
     a set of moment flags that only mean anything under the build that produced them, so a save from
     an older content version is dropped rather than resumed into a day whose hours have moved.
     Nothing else is touched: `_packing` and `_answers` are never versioned and never cleared. */
  const SV=META.saveVersion||1; let staleSave=false;
  const load=()=>{ try{ const j=localStorage.getItem(KEY); if(!j) return null; const o=JSON.parse(j);
      if(!o||!o.S||!o.cur||!SC[o.cur]) return null;
      if((o.v||1)!==SV){ staleSave=true; localStorage.removeItem(KEY); return null; }
      return o; }catch(e){} return null; };
  const save=()=>{ try{ if(cur==='title'||cur==='end'){ localStorage.removeItem(KEY); } else localStorage.setItem(KEY,JSON.stringify({v:SV,S,cur})); }catch(e){} };

  /* ---- the learned packing list -------------------------------------------
     Not a travel checklist. An item lands here only when the trip made its
     absence cost something, so passports and chargers never appear. The same
     list is the recap's "what you wish you'd packed", the copyable list at the
     end, and what comes back pre-ticked in the next run's suitcase. */
  function learned(S){
    const F=f=>!!S.flags[f], out=[];
    const add=(id,why)=>{ if(has(S,id)) return; const it=ITEMS.find(x=>x.id===id); if(it) out.push({id,name:it.name,why}); };
    /* A lesson is not a suitcase item: it is something to do when you land. It persists in the list
       like everything else, but it must never come back pre-ticked in the next run's suitcase —
       "buy one when you get there" and a ticked box at home are opposite advice. */
    const lesson=(id,name,why)=>out.push({id:'lesson:'+id,name,why});
    if(F('belly_bad')) add('meds','a morning of the trip went missing without them');
    if(F('rented_sarong')||F('skipped_temple')||F('bought_sarong'))
      lesson('sarong','Sarong',"buy one on your first day, €4. You'll use it at temples and ceremonies");
    if(F('sim_cost')) lesson('sim','SIM card','get one on arrival, €8. It pays for itself by the second ride');
    if(F('phonewet')) add('drybag','the phone spent a storm under your shirt');
    if(F('sunburn')) add('sunscreen','your shoulders found out at midday');
    if(S.rainAfternoons>0||F('m_rain')||F('m_rain2')) add('jacket','you ran for a roof in the afternoon rain');
    if(F('phonedied')||F('phonedies')||S.phone<=0) add('powerbank','the phone died while you still needed it');
    if(S.log.some(l=>/no adapter/i.test(l.text))) add('adapter','the socket in the room did not take your plug');
    if(F('bitten')) add('repellent','something found your ankles at dusk');
    if(F('hotsand')) add('flipflops','the sand at four o\'clock');
    return out;
  }
  const isLesson=id=>String(id).startsWith('lesson:');
  const loadPacking=()=>{ try{ const a=JSON.parse(localStorage.getItem(PKEY)||'[]'); return Array.isArray(a)?a.filter(id=>isLesson(id)||ITEMS.some(i=>i.id===id)):[]; }catch(e){ return []; } };
  const savePacking=list=>{ try{ localStorage.setItem(PKEY,JSON.stringify([...new Set(loadPacking().concat(list.map(x=>x.id)))])); }catch(e){} };
  /* Two layers: the short list anyone going there needs, then the few things this trip taught you. */
  const BASICS=META.packingBasics||[];
  const packingText=list=>('YOUR '+DEST.toUpperCase()+' PACKING LIST\n\n'
    +BASICS.map(b=>'[ ] '+b).join('\n')
    +(list.length?'\n\nYOU LEARNED THIS THE HARD WAY\n'+list.map(x=>'[x] '+x.name+' — '+x.why+'.').join('\n'):'')
    +'\n\nMade by playing DESTINATION \u2014 '+DEST+'.\n');
  /* The Yes / Maybe / No answer, kept on the device with the shape of the trip that produced it. */
  const saveAnswer=S=>{ try{ const a=JSON.parse(localStorage.getItem(AKEY)||'[]');
      a.push({ at:new Date().toISOString(), destination:DEST, days:S.days, region:S.region, budgetPerDay:S.budgetPerDay,
        spent:Math.round(S.spend), actions:Object.keys(S.done).filter(k=>k.indexOf('act:')===0).length,
        learned:learned(S).map(x=>x.id), answer:S.q.book||null });
      localStorage.setItem(AKEY,JSON.stringify(a.slice(-50))); }catch(e){} };
  const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const paras=s=>s.split('\n\n').map(p=>'<p>'+esc(p)+'</p>').join('');

  function draw(){ try{ drawScene(scene.art,S,t); }catch(e){ console.error(e); } }
  function loop(){ t++; draw(); }
  function startLoop(){ if(timer) clearInterval(timer); draw(); if(!reduce) timer=setInterval(loop,110); }

  function go(id){
    if(id==='__restart'){ S=newState(); cur='title'; hist.length=0; lastDelta=null; save(); render(); return; }
    cur=id; render(); save();
  }
  function render(){
    const m0=S.m.money;
    scene=SC[cur](S); if(scene.id&&scene.id!==cur) cur=scene.id;
    if(pend){ pend.money+=Math.round((m0-S.m.money)*100)/100; lastDelta=fmtDelta(pend); pend=null; } if(scene.onEnter) scene.onEnter(S); app.dataset.scene=cur; moreOpen=false;
    const canBack=!!(hist.length&&hist[hist.length-1].safe); $('#back').disabled=!canBack; $('#back').classList.toggle('locked',!canBack&&hist.length>0); $('#backwhy').textContent=(!canBack&&hist.length>0&&scene.type!=='title')?'That already happened.':'';
    cv.setAttribute('aria-label', altText(scene)); notePic(scene.art);
    { const I=OPENING.indexOf(cur); if(I>=0 && !openSeen.has(cur)){ openSeen.add(cur); track('i'+(I+1)); } }   // v38: bali/i1…i9, where the opening loses people
    { const mi=$('#mapimg'); if(mi && !mi.dataset.wired){ mi.dataset.wired='1'; mi.addEventListener('error',()=>{ mi.dataset.failed='1'; mi.hidden=true; cv.hidden=false; }); if(mi.complete && !mi.naturalWidth) mi.dataset.failed='1'; } }   // it may have failed before this script ran
    { const mi=$('#mapimg'), useMap=!!(mi && !mi.dataset.failed && (cur==='title'||cur==='region')); if(mi){ mi.hidden=!useMap; cv.hidden=useMap; } }   // v36: title_bali.webp beside index.html; the painted scene if it fails to load
    renderHud(); renderProgress(); renderBody(); startLoop();
    journal.hidden=true; jbtn.setAttribute('aria-expanded','false');
    window.scrollTo({top:0, behavior: reduce?'auto':'smooth'});
    panel.classList.remove('in'); void panel.offsetWidth; panel.classList.add('in');
  }
  /* ---- the counter hook (v32) ----------------------------------------------------------------
     Four events go through here and nowhere else. The page never loads a tracker of its own: the
     site that hosts it may define window.destTrack(name, data). If it does not, this does nothing,
     and if it throws, the game does not notice. */
  /* the opening screens in order, bali/i1…i8 (v39: Marta's reply now opens the SIM screen) */
  const OPENING=['title','budget','pack','npc0','sim','transport','transport_out','region'], openSeen=new Set();
  /* The counter script sits after the game in the page, so the title's event (i1) is raised before
     destTrack exists: hold events until the page has finished parsing. */
  const TQ=[];
  function track(name,data){ try{ if(typeof window.destTrack!=='function'){ if(TQ.length<20) TQ.push([name,data]); return; }
      while(TQ.length){ const [n,d]=TQ.shift(); try{ window.destTrack(n,d||{}); }catch(e){} }
      window.destTrack(name,data||{}); }catch(e){} }
  document.addEventListener('DOMContentLoaded',()=>{ if(TQ.length && typeof window.destTrack==='function'){ const [n,d]=TQ.shift(); track(n,d); } });
  /* ---- the pictures this trip actually showed (v31) --------------------------------------------
     The share card is made of them, so they must be ones the player saw, drawn from the state they
     were seen in. Only the memorable ones are kept — people, moments — the first time each appears. */
  /* v37: the card is places first, and at most one person. */
  const PLACES=['uluwatutemple','act2:cliffs','nyangnyang','watertemple','luwak','act2:kecak','legong','procession','act1:temple','act2:monkey',
    'act2:surf','act1:beach','ridge','deck','beachclub','act2:club','canang','parkir','coconut','dogs','belt'];
  const PEOPLE=['falk','wayan','made','marta','jonas','priya','rafa'];
  const PIC_ORDER=PLACES.concat(PEOPLE);
  function picKey(a){ if(!a||typeof a.bg!=='string') return null;
    if(a.bg==='act2'||a.bg==='act1'){ const act=a.bg==='act2'?S.d2.act:S.act1; if(!act) return null;
      if(act==='terrace'||act==='terraces'){ const home=(S.d2.target||S.region)===S.region; return (a.done && !(S.flags.tip_npc1_a&&S.region==='ubud'&&home))?'luwak':null; }
      return a.bg+':'+act; }
    /* the same place reached as a hub picture rather than through act1/act2 carries the list's key */
    const ALIAS={ tanahlot:'act1:temple', bingin:'act2:cliffs', surf:'act2:surf', kecak:'act2:kecak', monkeyforest:'act2:monkey', canangrow:'canang' };
    return ALIAS[a.bg]||a.bg; }
  function notePic(a){ const k=picKey(a); if(!k||PIC_ORDER.indexOf(k)<0) return; if(!S.pics) S.pics={}; if(S.pics[k]) return;
    S.pics[k]={ art:JSON.parse(JSON.stringify(a)), region:S.region, target:S.d2.target, act:S.d2.act, act1:S.act1, tip:S.npc.tip, tipA:!!S.flags.tip_npc1_a, time:S.time, bag:S.bag.slice() }; }
  /* The one person: the NPC whose advice you actually used (flag:used_tip, set where the advice changes
     what happens), otherwise Marta, otherwise nobody. They go in the last square, bottom right. If there
     are fewer than three places, other people fill the gaps so the card is never half empty. */
  function chosenKeys(){ const have=S.pics||{}, N=4;
    const npc1={canggu:'falk',ubud:'wayan',uluwatu:'made'}[S.region];
    const person=(S.flags&&S.flags.used_tip&&have[npc1])?npc1:(have.marta?'marta':null);
    const places=PLACES.filter(k=>have[k]).slice(0,person?N-1:N);
    const fill=PEOPLE.filter(k=>have[k]&&k!==person).slice(0,Math.max(0,(person?N-1:N)-places.length));
    return places.concat(fill,person?[person]:[]); }

        const URL_=META.url||'', NAME=(META.title||DEST);
        const INVITE=META.invite||'';
        const story=[head, type, money, facts.join(' · '), ...notes, 'Would I book it? '+(L[S.q.book]||'—'), '', reading, '', NAME+(URL_?' — '+URL_:''), META.description||INVITE].filter(Boolean).join('\n');   // v33: the pitch closes the text; it ends on the same €30 question as the card's invite
        const full=story+'\n\n'+packingText(pack);
        /* Share: the picture card as a file where the browser can share files; a download of it where
           it cannot; the text only when there is no canvas to draw on at all. A cancelled share
           sheet is a decision, not a failure, and falls back to nothing. */
        choicesEl.insertAdjacentHTML('afterbegin',
          btn('Share my trip','','share')
          +btn('Copy story','Everything, including the packing list.','copy'));
        const done=(b,word)=>{ b.querySelector('.lbl').firstChild.textContent=word; };
        const copy=(text,b)=>{
          if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(()=>done(b,'Copied')).catch(()=>fallback(text,w=>done(b,w)));
          else fallback(text,w=>done(b,w)); };
        const textShare=b=>{ track('share',{via:'text'}); try{ if(navigator.share){ navigator.share({title:NAME, text:story, url:URL_||undefined}).then(()=>done(b,'Shared')).catch(()=>copy(story,b)); return; } }catch(e){} copy(story,b); };
        const sb=choicesEl.querySelector('[data-i="share"]');
        sb.onclick=()=>{ const info={ head, type, money, book:(L[S.q.book]||'—'), name:NAME, url:URL_, invite:INVITE };
          cardBlob(info).then(blob=>{
            const file=(typeof File!=='undefined') ? new File([blob],'destination-'+(META.slug||'bali')+'.png',{type:'image/png'}) : null;
            if(file && navigator.canShare && navigator.canShare({files:[file]}) && navigator.share){
              return navigator.share({files:[file], title:NAME, text:story}).then(()=>{ done(sb,'Shared'); track('share',{via:'file'}); },e=>{ if(e&&e.name==='AbortError') return; textShare(sb); }); }
            const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='destination-'+(META.slug||'bali')+'.png';
            document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); done(sb,'Saved'); track('share',{via:'download'});
          }).catch(()=>textShare(sb)); };
        const cb=choicesEl.querySelector('[data-i="copy"]');
        cb.onclick=()=>copy(full,cb);
      }
      return;
    }
    h=(scene.title?'<h2>'+esc(scene.title)+'</h2>':'')+feelLine()+paras(scene.text);
    panel.innerHTML=h; renderChoices();
  }
  /* Three rungs, and the bottom one is honest. The clipboard API is the normal path; execCommand is
     the old one; if both are gone — which happens inside an artifact iframe, where confirm() is also
     swallowed (HANDOFF §8) — the text goes on screen, selected, and the button says so rather than
     claiming it copied something it did not. */
  function fallback(txt,done){
    const ta=document.createElement('textarea'); ta.value=txt; ta.setAttribute('readonly','');
    ta.style.position='fixed'; ta.style.left='-9999px'; document.body.appendChild(ta); ta.select();
    let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
    if(ok){ done('Copied'); return; }
    showText(txt); done('Select it');
  }
  function showText(txt){
    let box=$('#handoff');
    if(!box){ box=document.createElement('textarea'); box.id='handoff'; box.setAttribute('readonly','');
      box.className='handoff'; panel.appendChild(box); }
    box.value=txt; box.focus(); box.select();
  }

  jbtn.onclick=()=>{ const open=journal.hidden; journal.hidden=!open; jbtn.setAttribute('aria-expanded',String(open)); if(open){ let h=''; for(const d of dayList()) if(S.mem[d]&&S.mem[d].length) h+='<h3>Day '+d+'</h3><ul class="mem">'+S.mem[d].map(m=>'<li>'+esc(m)+'</li>').join('')+'</ul>'; journal.innerHTML=h||'<p>Nothing yet. It is early.</p>'; } };
  $('#restart').onclick=()=>{ const b=$('#restart'); if(cur==='title'||restartArmed){ restartArmed=false; b.textContent='Restart'; go('__restart'); return; } restartArmed=true; b.textContent='Sure? Start over'; setTimeout(()=>{ restartArmed=false; b.textContent='Restart'; },4000); };
  window.__bali={ cardKeys:()=>chosenKeys(), picKeyOf:a=>picKey(a), get S(){ return S; }, get cur(){ return cur; }, get scene(){ return scene; }, learned:()=>learned(S), packing:()=>loadPacking() }; /* test hook, read-only */
  render();
})();

</script>
<script>
  window.destTrack = function (name, data) {
    var extra = data ? Object.values(data).join('-') : '';
    var path = 'bali/' + name + (extra ? '/' + extra : '');
    function send() {
      if (window.goatcounter && window.goatcounter.count) {
        window.goatcounter.count({ path: path, title: name, event: true });
        return true;
      }
      return false;
    }
    if (!send()) {
      var tries = 0;
      var t = setInterval(function () {
        if (send() || ++tries > 20) clearInterval(t);
      }, 500);
    }
  };
</script>
<script data-goatcounter="https://mokikukadoki.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
